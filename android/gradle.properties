# Gradle braucht Luft: der Bau zieht eine 118 MB große Modelldatei durch die
# Verpackung. Mit dem Standardwert bricht er mit Speichermangel ab.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin-Standardbibliothek und AndroidX in der heutigen Form.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
