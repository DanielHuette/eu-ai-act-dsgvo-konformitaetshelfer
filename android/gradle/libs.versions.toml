# Alle Fassungen an einer Stelle. Wer eine ändert, sieht hier sofort, was
# sonst noch davon abhängt.

[versions]
bauwerkzeug = "8.13.2"
kotlin = "2.2.20"
# Compose-Sammelfassung: legt ui, foundation und material3 zueinander passend
# fest, damit keine Einzelfassung aus der Reihe fällt.
compose-sammlung = "2026.06.01"
kern = "1.17.0"
tatigkeit = "1.13.0"
lebenslauf = "2.10.0"
sqlite = "2.7.1"
onnx = "1.28.0"
schluesselspeicher = "1.1.0"
serialisierung = "1.9.0"
okhttp = "4.12.0"
nebenlaeufig = "1.11.0"
junit = "4.13.2"

[libraries]
kern-ktx = { module = "androidx.core:core-ktx", version.ref = "kern" }
tatigkeit-compose = { module = "androidx.activity:activity-compose", version.ref = "tatigkeit" }
lebenslauf-ansichtsmodell = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lebenslauf" }
compose-sammlung = { module = "androidx.compose:compose-bom", version.ref = "compose-sammlung" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-grafik = { module = "androidx.compose.ui:ui-graphics" }
compose-werkzeug = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-werkzeug-fehlersuche = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Datenbank: mitgeliefertes SQLite, nicht das des Telefons. Nachgemessen am
# 2026-10-03: in sqlite-bundled-android 2.7.1 sind FTS5, unicode61 und
# remove_diacritics=2 eingebaut. Das SQLite des Telefons hat FTS5 je nach
# Android-Fassung nicht, und dann fiele die Stichwortsuche aus.
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlite-mitgeliefert = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Festgelegt auf 1.28.0, und das mit Absicht. Nachgemessen an den
# Bibliotheken selbst am 2026-10-03:
#   bis 1.28.0  keine Berechtigung, kein Telemetrie-Anbieter, keine
#               Telemetrie-Klassen im Paket
#   ab  1.29.0  zwei Berechtigungen (INTERNET, ACCESS_NETWORK_STATE), ein
#               ContentProvider "TelemetryInitializer", der beim Start der App
#               von allein anläuft, und ein Paket mit HttpClient,
#               ConnectivityCallback und PowerInfoReceiver
# Ein Werkzeug, das damit wirbt, dass die Beschreibung des KI-Systems das
# Gerät nicht verlässt, kann keine Telemetrie mitliefern, die beim Start
# anspringt. Vor einer Erhöhung dieser Fassung ist zu prüfen, ob die
# Telemetrie wieder dabei ist.
onnx-laufzeit = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnx" }
schluesselspeicher = { module = "androidx.security:security-crypto", version.ref = "schluesselspeicher" }
serialisierung-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialisierung" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
nebenlaeufig = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "nebenlaeufig" }
nebenlaeufig-pruefung = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "nebenlaeufig" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "bauwerkzeug" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
