# Unternehmensfragen — der Maßstab für die Genauigkeit der Einstufung.
#
# WOZU DIESE DATEI
# Die 44 Anwendungsfälle in daten/faelle sind der Maßstab für die Pflichten.
# Für die Genauigkeit taugen sie nicht allein: an ihnen wurden die Wortlisten
# entwickelt, und 44 von 44 heißt dort nur, dass nichts zurückgefallen ist.
#
# Hier stehen 100 Beschreibungen, wie Unternehmen sie wirklich einreichen:
# knapp, in eigener Sprache, oft als Frage, mit Produktnamen und ohne
# Rechtsbegriffe. Die Hälfte aus Sicht eines Softwarehauses, das ein KI-Produkt
# verkauft, die Hälfte aus Sicht eines Anwenders. 28 davon sind "minimal" - ein
# Prüfer, der alles für Hochrisiko erklärt, wäre genauso wertlos wie einer, der
# nichts erkennt.
#
# Die Soll-Einstufung ist aus dem Verordnungstext bestimmt, nicht aus dem, was
# der Prüfer gerade liefert. Das Feld "stelle" nennt die Fundstelle, auf die
# sich das Soll stützt - wer das Soll ändern will, muss dort nachlesen.
#
# GEMESSENER STAND
#   nur Wortlisten                       55 %
#   mit Zweckkatalog, erste Fassung      86 %
#   nach Abarbeiten der 14 Fehlschläge   98 %
#   nach der Rollentrennung in Artikel 50 und dem zweiten Weg zu Absatz 4
#                                       100 %  (04.10.2026)
#
# Die Grenze in tests/test_zwecke.py liegt bei 95 und nicht bei 100: eine
# Grenze, die beim ersten neuen Zwecksatz bricht, wird hochgesetzt statt
# behoben. Fällt die Quote unter 95, ist etwas zurückgefallen.
