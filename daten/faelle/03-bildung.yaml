gebiet: Allgemeine und berufliche Bildung
hinweis: >
  Die Fälle sind Beispiele zum Lernen, keine Rechtsberatung. Ob eine Einstufung
  im Einzelfall trägt, hängt von Umständen ab, die hier nicht alle stehen
  können. Wo es darauf ankommt, ist es im Fall vermerkt.
faelle:
  - kennung: pruefungsbewertung-freitext
    titel: Automatische Bewertung von Freitextantworten in einer Klausur
    lage: >
      Eine Berufsakademie lässt die Freitextantworten ihrer
      Abschlussklausuren von einem KI-System bewerten. Das System vergibt
      Punkte je Antwort und schlägt eine Note vor. Die Prüferin sieht die
      Vorschläge und korrigiert stichprobenweise rund jede zehnte Arbeit; die
      übrigen Noten übernimmt sie.
    rolle: betreiber
    einstufung: hochrisiko_anhang_iii
    begruendung: >
      Anhang III Nummer 3 Buchstabe b nennt KI-Systeme, die für die Bewertung
      von Lernergebnissen verwendet werden sollen. Die Notenvergabe in einer
      Abschlussklausur ist genau das. Die Ausnahme nach Artikel 6 Absatz 3
      greift nicht: Die Bewertung ist keine eng gefasste Verfahrensaufgabe und
      beeinflusst das Ergebnis wesentlich, zumal neun von zehn Noten
      unverändert übernommen werden.
    rechtsgrundlage: [KI-VO/anh-III/nr-3, KI-VO/art-6/abs-2, KI-VO/art-6/abs-3, KI-VO/art-26/abs-1, KI-VO/art-26/abs-2, KI-VO/art-26/abs-11, KI-VO/art-4]
    pflichten:
      - Prüflinge darüber informieren, dass ein Hochrisiko-KI-System an der Bewertung mitwirkt.
      - Die menschliche Aufsicht so ausgestalten, dass Noten nicht nur stichprobenweise, sondern belastbar überprüft werden können.
      - Ein Verfahren bereitstellen, mit dem Prüflinge die Bewertung beanstanden und eine Prüfung durch einen Menschen erhalten.
      - Das System nach der Betriebsanleitung des Anbieters verwenden und seine Treffsicherheit laufend beobachten.
      - Für die Prüfer ausreichende Schulung im Umgang mit dem System sicherstellen.
    lernhinweis: >
      Eine Stichprobe ist eine Qualitätskontrolle, aber keine menschliche
      Aufsicht über die Einzelentscheidung. Wer bei neun von zehn Arbeiten die
      Note ungesehen übernimmt, hat für diese neun keine eigene Bewertung
      vorgenommen. Menschliche Aufsicht im Sinne der Verordnung heißt, dass
      die aufsichtführende Person den Einzelfall prüfen kann, dafür Zeit und
      Zugang hat und das Ergebnis ändern darf — nicht, dass sie irgendwo im
      Verfahren vorkommt.
    stolperstein: >
      Die Hochschule hält sich für sicher, weil formal die Prüferin die Note
      erteilt. Wer die Klausur nie gelesen hat, erteilt die Note aber nicht,
      sondern gibt sie weiter.
    verwandte_faelle: [notenmuster-abweichung, zulassung-studiengang, rechtschreibhilfe-verwaltung]

  - kennung: zulassung-studiengang
    titel: Vorauswahl der Bewerber für einen zulassungsbeschränkten Studiengang
    lage: >
      Eine Fachhochschule hat für einen Studiengang mehr Bewerber als Plätze.
      Ein KI-System wertet Zeugnisse, Motivationsschreiben und
      Praktikumsnachweise aus und erstellt eine Rangliste. Die
      Auswahlkommission lädt die oberen 60 Bewerber zum Gespräch ein.
    rolle: betreiber
    einstufung: hochrisiko_anhang_iii
    begruendung: >
      Anhang III Nummer 3 Buchstabe a nennt KI-Systeme zur Feststellung des
      Zugangs oder der Zulassung oder zur Zuweisung von Menschen zu
      Bildungseinrichtungen. Eine Rangliste, die den Kreis der Eingeladenen
      bestimmt, wirkt bei der Zulassung mit. Da das System einzelne Bewerber
      anhand ihrer Unterlagen bewertet und einordnet, nimmt es ein Profiling
      vor; damit ist die Ausnahme nach Artikel 6 Absatz 3 nach deren
      letztem Satz ausgeschlossen.
    rechtsgrundlage: [KI-VO/anh-III/nr-3, KI-VO/art-6/abs-2, KI-VO/art-6/abs-3, KI-VO/art-26/abs-2, KI-VO/art-26/abs-11, KI-VO/art-27/abs-1, DSGVO/art-22]
    pflichten:
      - Als öffentliche Einrichtung vor der Inbetriebnahme eine Abschätzung der Auswirkungen auf die Grundrechte durchführen.
      - Bewerber über die Mitwirkung des Systems an der Zulassung informieren.
      - Die Rangkriterien offenlegen können und auf unzulässige Benachteiligung prüfen.
      - Der Auswahlkommission ermöglichen, von der Rangliste abzuweichen, und solche Abweichungen festhalten.
    lernhinweis: >
      Eine Rangliste wirkt neutraler als eine Entscheidung, ist aber eine, weil
      sie die Grenze zieht. Für die Einstufung zählt die Wirkung im Verfahren,
      nicht die Form der Ausgabe. Zugleich zeigt der Fall, dass öffentliche
      Einrichtungen bei Systemen aus Anhang III zusätzlich die Abschätzung der
      Auswirkungen auf die Grundrechte schulden — unabhängig davon, welcher
      Bereich des Anhangs betroffen ist.
    stolperstein: >
      Die Hochschule sieht in der Rangliste eine vorbereitende Aufgabe nach
      Artikel 6 Absatz 3 Buchstabe d. Der letzte Satz dieses Absatzes schließt
      die Ausnahme bei Profiling aber ausdrücklich aus, und eine Bewertung
      einzelner Bewerber ist Profiling.
    verwandte_faelle: [pruefungsbewertung-freitext, bewerbungsfilter-sprachmodell, lernstandserhebung-schule]

  - kennung: pruefungsaufsicht-kamera
    titel: Kameraaufsicht bei einer Fernprüfung
    lage: >
      Eine Weiterbildungseinrichtung lässt Abschlussprüfungen zu Hause am
      eigenen Rechner schreiben. Ein KI-System überwacht dabei das Kamerabild
      und meldet dem Prüfungsamt, wenn der Blick wiederholt vom Bildschirm
      abweicht, eine zweite Person im Bild ist oder Geräusche auf Absprachen
      hindeuten. Gemeldete Fälle werden als Täuschungsversuch geprüft.
    rolle: betreiber
    einstufung: hochrisiko_anhang_iii
    begruendung: >
      Anhang III Nummer 3 Buchstabe d nennt KI-Systeme zur Überwachung und
      Erkennung von verbotenem Verhalten von Prüflingen bei Prüfungen. Das
      System tut genau das. Wichtig ist die Grenze zum Verbot: Würde das
      System aus dem Kamerabild auf Gefühlslagen wie Nervosität oder Stress
      schließen, wäre es nach Artikel 5 Absatz 1 Buchstabe f verboten, weil
      die Ableitung von Emotionen in Bildungseinrichtungen untersagt ist.
      Die Beobachtung von Blickrichtung und Anwesenheit weiterer Personen
      bleibt davor, ist aber nahe an dieser Grenze.
    rechtsgrundlage: [KI-VO/anh-III/nr-3, KI-VO/art-6/abs-2, KI-VO/art-5/abs-1-f, KI-VO/art-26/abs-2, KI-VO/art-26/abs-11, DSGVO/art-35, DSGVO/art-5]
    pflichten:
      - Vertraglich und technisch ausschließen, dass das System Emotionen oder Gefühlszustände auswertet.
      - Prüflinge vor der Prüfung über den Einsatz und die ausgewerteten Merkmale informieren.
      - Jede Meldung von einem Menschen prüfen lassen, bevor von einem Täuschungsversuch ausgegangen wird.
      - Eine Datenschutz-Folgenabschätzung prüfen; die Beobachtung in der Wohnung ist ein schwerer Eingriff.
      - Eine Rückfallmöglichkeit anbieten für Prüflinge, bei denen die Technik nicht zuverlässig funktioniert.
    lernhinweis: >
      Zwischen hohem Risiko und Verbot liegt bei Emotionen nur ein kleiner
      Schritt. Dasselbe Kamerabild ist erlaubt auszuwerten, wenn es um
      Blickrichtung und Anwesenheit geht, und verboten, wenn daraus auf
      Gefühle geschlossen wird — und zwar am Arbeitsplatz wie in
      Bildungseinrichtungen. Wer solche Systeme einkauft, muss sich die
      ausgewerteten Merkmale im Einzelnen nennen lassen, denn der Unterschied
      steckt nicht im Produktnamen, sondern in den Merkmalen.
    stolperstein: >
      Der Anbieter bewirbt eine Erkennung von Auffälligkeiten, die
      unausgesprochen Anzeichen von Nervosität einbezieht. Damit rutscht der
      Einsatz in Bildungseinrichtungen ins Verbot, ohne dass die Einrichtung
      das bemerkt.
    verwandte_faelle: [emotionserkennung-callcenter, mitarbeiterueberwachung-tastatur, pruefungsbewertung-freitext]

  - kennung: lernstandserhebung-schule
    titel: Lernstandserhebung, die den Förderweg bestimmt
    lage: >
      Ein Schulträger setzt eine Lernplattform ein, die Übungsaufgaben
      auswertet. Ein KI-System schätzt daraus das Leistungsniveau jedes
      Schülers in Mathematik und empfiehlt eine von drei Förderschienen. Die
      Schulleitung weist die Schüler anhand der Empfehlung den Schienen zu.
    rolle: betreiber
    einstufung: hochrisiko_anhang_iii
    begruendung: >
      Anhang III Nummer 3 Buchstabe c nennt KI-Systeme zur Bewertung des
      angemessenen Bildungsniveaus, das eine Person erhalten wird oder zu dem
      sie Zugang erhält. Die Zuweisung zu Förderschienen ist eine solche
      Bewertung. Hinzu kommt Buchstabe b, weil das System Lernergebnisse
      bewertet und damit den Lernprozess steuert. Die Ausnahme nach Artikel 6
      Absatz 3 greift nicht, weil das System einzelne Schüler einordnet und
      die Zuweisung der Empfehlung folgt.
    rechtsgrundlage: [KI-VO/anh-III/nr-3, KI-VO/art-6/abs-2, KI-VO/art-6/abs-3, KI-VO/art-26/abs-2, KI-VO/art-26/abs-11, KI-VO/art-27/abs-1, DSGVO/art-22]
    pflichten:
      - Als öffentliche Einrichtung eine Abschätzung der Auswirkungen auf die Grundrechte durchführen.
      - Eltern und Schüler über die Mitwirkung des Systems an der Zuweisung informieren.
      - Lehrkräften ermöglichen, von der Empfehlung abzuweichen, und dies nicht begründungspflichtig erschweren.
      - Die Empfehlungen daraufhin auswerten, ob bestimmte Gruppen regelmäßig in der unteren Schiene landen.
    lernhinweis: >
      Eine Empfehlung an eine Lehrkraft und eine Weichenstellung im
      Bildungsweg sind oft dasselbe. Bei Minderjährigen wiegt eine solche
      Festlegung besonders schwer, weil sie den weiteren Weg lange prägt und
      sich kaum korrigieren lässt. Für eigene Fälle ist die Frage hilfreich:
      Wie leicht kann der Betroffene das Ergebnis später noch umkehren? Je
      schwerer, desto weniger trägt das Argument, es sei ja nur ein Vorschlag.
    stolperstein: >
      Die Schule hält die Erhebung für eine neutrale Messung. Was gemessen
      wird, hängt aber von den Aufgaben und ihrer Gewichtung ab, und eine
      Zuweisung nach dieser Messung ist eine Entscheidung über den
      Bildungsweg.
    verwandte_faelle: [weiterbildungsempfehlung-beschaeftigte, zulassung-studiengang, notenmuster-abweichung]
