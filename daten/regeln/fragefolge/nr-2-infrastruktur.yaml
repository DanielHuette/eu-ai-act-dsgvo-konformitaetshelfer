bereich: "KI-VO/anh-III/nr-2"
titel: Kritische Infrastruktur
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitt 3.2"
punkte:
  - fundstelle: "KI-VO/anh-III/nr-2"
    hauptfrage: "Wird Ihr KI-System bei der Verwaltung oder beim Betrieb von kritischer digitaler Infrastruktur, von Straßenverkehr oder bei der Versorgung mit Wasser, Gas, Wärme oder Strom eingesetzt?"
    folgefragen:
      - frage: "Wird Ihr System in einer Anlage, einem Gerät, einem Netz oder einem Teil davon eingesetzt, das für einen dieser Dienste gebraucht wird: Betrieb eines Internet-Knotenpunktes (Übergabestelle, an der Netze Datenverkehr austauschen), Betrieb des Dienstes, der Internet-Namen in Adressen auflöst (Domain-Name-System), Verwaltung einer Registrierungsstelle für Namen der obersten Ebene (zum Beispiel .de oder .eu), Bereitstellung von Rechenleistung und Speicher über das Netz (Cloud-Dienste), Betrieb eines Rechenzentrums, Betrieb eines Netzes zur Auslieferung von Inhalten (Content Delivery Network), Bereitstellung von Vertrauensdiensten (zum Beispiel elektronische Signaturen), Bereitstellung öffentlich zugänglicher elektronischer Kommunikationsdienste oder Betrieb öffentlicher elektronischer Kommunikationsnetze?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(193)"
      - frage: "Wird Ihr System für die Lenkung und Steuerung des Straßenverkehrs eingesetzt, also für Planung, Steuerung und Verwaltung des Straßennetzes, oder für Dienste intelligenter Verkehrssysteme (Verkehrstechnik, die Fahrzeuge, Straße und Leitstelle miteinander verbindet)?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(195)"
      - frage: "Wird Ihr System bei der Versorgung mit Trinkwasser, bei der Verteilung von Trinkwasser oder beim Sammeln, Behandeln und Beseitigen von Abwasser eingesetzt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(197)"
      - frage: "Wird Ihr System bei der Lieferung, Verteilung, Fernleitung oder Speicherung von Gas, beim Betrieb einer Anlage für verflüssigtes Erdgas, bei der Gewinnung oder beim Einkauf von Erdgas oder bei der Raffination und Behandlung von Erdgas eingesetzt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(199)"
      - frage: "Wird Ihr System bei der Bereitstellung von Fernwärme oder Fernkälte eingesetzt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(201)"
      - frage: "Wird Ihr System bei der Lieferung von Strom, beim Betrieb, bei der Instandhaltung oder beim Ausbau eines Stromverteilnetzes oder eines Stromübertragungsnetzes, bei der Stromerzeugung, beim Dienst eines benannten Strommarktbetreibers, bei der Laststeuerung durch Nachfrageanpassung, beim Zusammenfassen von Strommengen (Aggregation) oder bei der Energiespeicherung eingesetzt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(203)"
      - frage: "Haben Sie alle sechs vorstehenden Fragen mit Nein beantwortet?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(188)"
    erfasst:
      - text: "Nummer 2 des Anhangs III nennt sechs Fälle: KI-Systeme, die als Sicherheitsbauteil bei der Verwaltung und beim Betrieb von kritischer digitaler Infrastruktur, von Straßenverkehr oder bei der Versorgung mit Wasser, Gas, Wärme oder Strom eingesetzt werden sollen."
        beleg: "(178)"
      - text: "Gemeint ist ein Einsatz in einer Anlage, einem Gebäude, einem Gerät, einem Netz oder einem System oder in einem Teil davon, der für die Erbringung der genannten wesentlichen Dienste notwendig ist."
        beleg: "(193)"
    nicht_erfasst:
      - text: "Straßenverkehr meint Straßen an der Oberfläche; Wasserwege gehören nicht dazu."
        beleg: "(195)"
      - text: "Verkehrslenkung und der Betrieb intelligenter Verkehrssysteme sind ausgenommen, soweit sie kein wesentlicher Teil der allgemeinen Tätigkeit öffentlicher Stellen sind."
        beleg: "(195)"
      - text: "Dienste rund um die Wurzel-Namensserver des Internets (root name servers) gehören nicht zur kritischen digitalen Infrastruktur."
        beleg: "(193)"
      - text: "Die Verteilung von Wasser für den menschlichen Gebrauch ist ausgenommen, wenn dieser Dienst kein wesentlicher Teil der allgemeinen Tätigkeit eines Verteilers ist, der auch andere Waren und Güter verteilt."
        beleg: "(197)"
      - text: "Das Sammeln, Beseitigen oder Behandeln von kommunalem, häuslichem oder industriellem Abwasser ist ausgenommen, wenn es kein wesentlicher Teil der allgemeinen Tätigkeit des Unternehmens ist."
        beleg: "(197)"
      - text: "Der Erdölbereich gehört nicht zum Fall Gasversorgung: nicht erfasst sind Betreiber von Erdöl-Fernleitungen, von Anlagen zur Erdölgewinnung, -raffination und -behandlung, von Erdölspeicherung und -fernleitung sowie zentrale Bevorratungsstellen."
        beleg: "(199)"
      - text: "Der Wasserstoffbereich gehört nicht zum Fall Stromversorgung: nicht erfasst sind Betreiber der Wasserstofferzeugung, -speicherung und -fernleitung."
        beleg: "(203)"
      - text: "Fällt ein System nicht unter Nummer 2 des Anhangs III, kann es trotzdem nach Artikel 6 Absatz 1 als hochriskant gelten, wenn es von Harmonisierungsrechtsvorschriften der Union aus Anhang I erfasst wird, zum Beispiel eingebaut in Funkanlagen, Seilbahnen, Luftfahrt oder Schienensysteme. Diese Prüfung ist eine andere und hier nicht abgedeckt."
        beleg: "(179)"
    beispiele: []
  - fundstelle: "KI-VO/anh-III/nr-2"
    hauptfrage: "Wird Ihr KI-System von einer Einrichtung eingesetzt, die ihr Mitgliedstaat förmlich als kritische Einrichtung benannt hat?"
    folgefragen:
      - frage: "Hat ein Mitgliedstaat den Betreiber, der Ihr System einsetzt, nach der Richtlinie über die Widerstandsfähigkeit kritischer Einrichtungen als kritische Einrichtung benannt?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(190)"
    erfasst:
      - text: "Ein KI-System gilt nur dann als Sicherheitsbauteil in kritischer Infrastruktur und damit als hochriskant, wenn es von einer Einrichtung genutzt wird, die ein Mitgliedstaat nach der Richtlinie über die Widerstandsfähigkeit kritischer Einrichtungen als kritische Einrichtung benannt hat."
        beleg: "(190)"
      - text: "Welche Dienste als wesentlich gelten und welchen Arten von Einrichtungen sie zugeordnet sind, legt die Delegierte Verordnung (EU) 2023/2450 fest; Artikel 3 Nummer 62 der KI-Verordnung verweist dafür auf die Richtlinie (EU) 2022/2557."
        beleg: "(189)"
      - text: "Der Betreiber muss seinen Status als benannte kritische Einrichtung einem außenstehenden Anbieter nicht offenlegen. Ein Anbieter kann sein System freiwillig nach den Anforderungen für hochriskante Systeme bauen und für solche Zwecke anbieten, und ein Betreiber kann die Einhaltung der KI-Verordnung im Einkauf, im Vertrag oder in den technischen Vorgaben verlangen, ohne seinen Status zu nennen."
        beleg: "(191)"
    nicht_erfasst:
      - text: "Wird Ihr System von einer Einrichtung genutzt, die kein Mitgliedstaat als kritische Einrichtung benannt hat, fällt es nicht unter Nummer 2 des Anhangs III."
        beleg: "(190)"
    beispiele: []
  - fundstelle: "KI-VO/anh-III/nr-2"
    hauptfrage: "Erfüllt Ihr KI-System selbst eine Schutzaufgabe, das heißt schützt es unmittelbar die körperliche Unversehrtheit der Anlage, indem es Gefahren verringert, verhindert, beherrscht oder in ihren Folgen begrenzt, die sonst zu körperlichen Schäden an Menschen oder zu Sachschäden führen würden?"
    folgefragen:
      - frage: "Überwacht und erkennt Ihr System Lagen, die unmittelbar zu körperlichen Schäden an Menschen oder zu Sachschäden führen können, und schützt es damit unmittelbar die körperliche Unversehrtheit der Anlage, zum Beispiel indem es ungewöhnliches Verhalten im Betrieb der Anlage erkennt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Überwacht und erkennt Ihr System, dass eine Wartung oder Prüfung angesetzt werden muss, deren Ausbleiben unmittelbar die körperliche Unversehrtheit der Anlage gefährden und zu körperlichen Schäden an Menschen oder zu Sachschäden führen würde, zum Beispiel indem es abgenutzte Teile der Anlage erkennt, die ersetzt werden müssen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Verhindert Ihr System körperliche Schäden an Menschen oder Sachschäden, indem es unmittelbar die körperliche Unversehrtheit der Anlage schützt, zum Beispiel indem es den Anlauf des Betriebs verhindert, wenn es ungewöhnliches Verhalten erkennt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Steuert oder begrenzt Ihr System mögliche körperliche Schäden an Menschen oder Sachschäden, indem es unmittelbar die körperliche Unversehrtheit der Anlage schützt, zum Beispiel indem es ein bestimmtes Verhalten oder eine Funktion der Anlage steuert und entsprechend nachregelt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Begrenzt Ihr System die Folgen möglicher körperlicher Schäden an Menschen oder von Sachschäden, indem es unmittelbar die körperliche Unversehrtheit der Anlage schützt, zum Beispiel indem es bei einem gefährlichen Zustand selbst eine Handlung auslöst wie einen sicheren Halt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Steuert oder überwacht Ihr System ein anderes System, das eine Schutzaufgabe erfüllt, zum Beispiel indem es dessen Betrieb über Messfühler in Echtzeit überwacht und dabei selbst die Schutzaufgabe unmittelbar erfüllt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Haben Sie alle sechs vorstehenden Fragen mit Nein beantwortet?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(184)"
      - frage: "Läuft Ihr System im Kern nur unterstützend mit, liefert es Auskünfte, dient es der Organisation oder verbessert es den Betrieb der Anlage, etwa die Leistung, die Wirtschaftlichkeit oder die Kosten, ohne selbst eine unmittelbare Schutzaufgabe zu erfüllen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(181)"
      - frage: "Leitet Ihr System Verkehr oder Daten nur durch, ohne über deren Inhalt oder Ziel zu bestimmen oder zu entscheiden (sogenannte reine Durchleitung)?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(182)"
      - frage: "Liefert Ihr System nur Erkenntnisse und Auswertungen, ohne Änderungen am Betrieb der Anlage unmittelbar auszulösen, die sich auf die Sicherheit auswirken können?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(183)"
      - frage: "Kann die Anlage ohne Ihr System sicher weiterlaufen, weil Ihr System nur eine von mehreren vorsorglichen Maßnahmen ist und für den sicheren Betrieb nicht notwendig ist?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(196)"
      - frage: "Gibt Ihr System sein Ergebnis nur als Warnung, Hinweis oder Empfehlung an einen Menschen weiter, der dann selbst über Maßnahmen entscheidet, und greift es nicht selbst in die Anlage ein?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(206)"
      - frage: "Kann Ihr System ausschließlich erkennen und melden, ohne vorbeugende Maßnahmen zu ergreifen, in den Betrieb einzugreifen, Störungen zu beheben oder Gefahren abzuwenden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(202)"
      - frage: "Soll Ihr System allein Schäden verhindern, die nicht körperlich sind, also nicht gegenständliche Schäden wie seelisches Leid oder die Verletzung von Rechten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(185)"
      - frage: "Soll Ihr System allein Schäden verhindern, die Dritte verursachen, einschließlich solcher, die durch die Nutzung von Vermittlungsdiensten entstehen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(185)"
      - frage: "Dient Ihr System ausschließlich der Abwehr von Angriffen über das Netz, also allein Zwecken der Netz- und Informationssicherheit?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(187)"
      - frage: "Gibt es neben Ihrem System ein zweites System oder eine Rückfallebene, die die körperliche Unversehrtheit der Anlage unmittelbar schützt und den Schaden allein verhindern könnte?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(186)"
    erfasst:
      - text: "Die Einstufung als Sicherheitsbauteil richtet sich vor allem nach der Schutzaufgabe, die das KI-System selbst erfüllt. Bei kritischer Infrastruktur kommt es darauf an, ob das System unmittelbar die körperliche Unversehrtheit der Anlage schützt, indem es Gefahren verringert, verhindert, beherrscht oder in ihren Folgen begrenzt, die sonst zu körperlichen Schäden an Menschen oder zu Sachschäden führen würden. Die Aufgabe des Sicherheitsbauteils ist mit der Erhaltung der körperlichen Unversehrtheit der Anlage untrennbar verbunden."
        beleg: "(180)"
      - text: "Als Sicherheitsbauteil gilt ein System nur, wenn es eine dieser sechs Schutzaufgaben erfüllt: Lagen erkennen, die unmittelbar zu Schaden führen können; den Bedarf an Wartung und Prüfung erkennen, dessen Ausbleiben die Unversehrtheit gefährdet; Schaden verhindern; möglichen Schaden steuern oder begrenzen; die Folgen möglichen Schadens begrenzen; oder ein anderes System steuern beziehungsweise überwachen, das eine Schutzaufgabe erfüllt."
        beleg: "(184)"
      - text: "Hintergrund der Einstufung ist die Gefahr, dass ein Ausfall oder eine Fehlfunktion solcher Systeme Leben und Gesundheit vieler Menschen gefährdet und den gewöhnlichen Ablauf gesellschaftlicher und wirtschaftlicher Tätigkeiten merklich stört."
        beleg: "(178)"
    nicht_erfasst:
      - text: "Nicht erfasst sind Systeme, die bloß unterstützend mitlaufen, Auskünfte geben, der Organisation dienen oder den Betrieb verbessern, etwa Leistung oder Kosten optimieren, und die selbst keine unmittelbare Schutzaufgabe erfüllen."
        beleg: "(181)"
      - text: "Nicht erfasst ist die reine Durchleitung, also das passive Weiterleiten von Verkehr oder Daten ohne Steuerung oder Entscheidung über Inhalt oder Ziel."
        beleg: "(182)"
      - text: "Nicht erfasst sind Systeme, die nur Erkenntnisse liefern und keine Änderung im Betrieb unmittelbar auslösen, die sich auf die Sicherheit auswirkt; dass die Verfügbarkeit von Diensten betroffen sein kann, genügt nicht."
        beleg: "(183)"
      - text: "Nicht als Sicherheitsbauteil gelten Bauteile, die allein Schäden verhindern sollen, die nicht körperlich oder nicht gegenständlich sind, etwa seelisches Leid oder die Verletzung von Rechten."
        beleg: "(185)"
      - text: "Nicht als Sicherheitsbauteil gelten Bauteile, die allein Schäden verhindern sollen, die Dritte verursachen, einschließlich solcher, die durch die Nutzung von Vermittlungsdiensten entstehen."
        beleg: "(185)"
      - text: "Ein System, das ausschließlich Zwecken der Abwehr von Angriffen über das Netz dient, fällt nicht unter Nummer 2 des Anhangs III. Erwägungsgrund 55 der KI-Verordnung unterscheidet klar zwischen einem Sicherheitsbauteil und einem Bauteil für die Netz- und Informationssicherheit; ohne unmittelbare Schutzaufgabe ist ein System kein Sicherheitsbauteil."
        beleg: "(187)"
      - text: "Bei der Prüfung ist zu berücksichtigen, ob es ein zweites System oder eine Rückfallebene gibt, die die körperliche Unversehrtheit der Anlage unmittelbar schützt und den Schaden verhindern könnte."
        beleg: "(186)"
      - text: "Ein System, das nur erkennen und melden kann und weder vorbeugende Maßnahmen ergreifen noch in den Betrieb eingreifen, Störungen beheben oder Gefahren abwenden kann, hat keine Schutzaufgabe."
        beleg: "(202)"
      - text: "Ein System, das nicht selbst auf die Anlage einwirkt, sondern nur die Entscheidungsmöglichkeiten in der Leitstelle erweitert, hat keine unmittelbare Schutzaufgabe."
        beleg: "(206)"
      - text: "Ein System, das nur hilft, Ausfälle zu vermeiden, ist kein Sicherheitsbauteil, wenn die Anlage ohne es weiterlaufen kann, weil es nur eine von mehreren vorsorglichen Maßnahmen und für den sicheren Betrieb nicht notwendig ist."
        beleg: "(196)"
      - text: "Werden die Kernaufgaben der Sicherheit getrennt von Ihrem System erledigt, hat Ihr System keine unmittelbare Schutzaufgabe."
        beleg: "(206)"
    beispiele:
      - lage: "Ein System zur Optimierung des Verkehrsflusses auf Grundlage von Daten, die in Echtzeit gesammelt werden."
        wertung: "kein_hochrisiko"
        begründung: "Es ist eine Auswertungsplattform für Verkehrsdaten. Sie löst Änderungen in der Verkehrssteuerung nicht unmittelbar aus und schützt Sicherheit oder körperliche Unversehrtheit nicht unmittelbar; sie liefert Erkenntnisse. Der Verkehr funktioniert auch ohne sie."
        beleg: "(183)"
      - lage: "Ein Köder-System im Netz (Honeypot), das Angriffe über das Netz in Echtzeit erkennen und unschädlich machen soll."
        wertung: "kein_hochrisiko"
        begründung: "Es dient ausschließlich der Abwehr von Angriffen über das Netz."
        beleg: "(187)"
      - lage: "Eine Technik, die sich mit möglichen Angreifern aktiv einlässt, um neue Angriffsmuster zu lernen."
        wertung: "kein_hochrisiko"
        begründung: "Sie dient ausschließlich der Abwehr von Angriffen über das Netz."
        beleg: "(187)"
      - lage: "Ein System, das unberechtigte Zugriffe erkennen hilft, sodass betroffene Kunden gewarnt werden, bevor ihr Kennwort missbraucht wird."
        wertung: "kein_hochrisiko"
        begründung: "Es dient ausschließlich der Abwehr von Angriffen über das Netz."
        beleg: "(187)"
      - lage: "Ein System, das verdächtige Absenderadressen von Nachrichten erkennt und entwendete Daten ausfindig macht."
        wertung: "kein_hochrisiko"
        begründung: "Es dient ausschließlich der Abwehr von Angriffen über das Netz."
        beleg: "(187)"
      - lage: "Eine Brandmeldeanlage mit KI-Steuerung in einem Rechenzentrum für Rechenleistung aus dem Netz."
        wertung: "hochrisiko"
        begründung: "Sie hat eine unmittelbare Schutzaufgabe: sie verhindert unmittelbaren Schaden an der körperlichen Anlage des Rechenzentrums und an Menschen. Keine der Ausnahmen des Artikels 6 Absatz 3 greift."
        beleg: "(194)"
      - lage: "Systeme, die die Dienstgüte und den Betrieb kritischer digitaler Infrastruktur verbessern sollen: Verwaltung von Störungsmeldungen, Optimierung des Netzes und Anpassung an einzelne Kundenbedürfnisse, KI-gestützte Auskunft aus dem technischen Handbuch zur Netzwartung, Vorhersage der Netzlast."
        wertung: "kein_hochrisiko"
        begründung: "Solche Systeme haben keine unmittelbare Schutzaufgabe."
        beleg: "(194)"
      - lage: "Ein Werkzeug für Übersetzung in Echtzeit im Straßenverkehr."
        wertung: "hochrisiko"
        begründung: "Es ist für die Beschäftigten des Verkehrsbetriebs notwendig, um Sprachbarrieren zwischen Leitstelle und Fahrern sowie zwischen Fahrgästen und Fahrern zu überwinden; es sichert die sprachliche Verständigung und trägt so zur Sicherheit des öffentlichen Verkehrs bei."
        beleg: "(196)"
      - lage: "Ein System, das den Straßenverkehr überwacht und die Ampeln entsprechend nachregelt."
        wertung: "hochrisiko"
        begründung: "Es steuert und begrenzt mögliche körperliche Schäden an Menschen und Sachschäden an Fahrzeugen, Verkehrsteilnehmern und Umgebung, indem es unmittelbar die körperliche Unversehrtheit des Verkehrslenkungssystems schützt; es wirkt unmittelbar auf die Verkehrssicherheit."
        beleg: "(196)"
      - lage: "Ein System, das schwere Gegenstände auf anfälligen Brücken und Kaimauern erkennt."
        wertung: "hochrisiko"
        begründung: "Es hilft, den Einsturz von Brücken und Kaimauern zu verhindern, und schützt damit unmittelbar die körperliche Unversehrtheit der Straßeninfrastruktur. Fällt es aus, wird ein drohender Einsturz nicht rechtzeitig erkannt. Es wird für die Verwaltung der Brücken und Kaimauern nicht gebraucht und ist ein zusätzliches Sicherheitsbauteil, vergleichbar einem Notausschalter."
        beleg: "(196)"
      - lage: "Ein System, das Wasserstandsdaten in Echtzeit mit der Schleusensteuerung für den Straßenverkehr verknüpft, etwa bei Hochwassergefahr."
        wertung: "hochrisiko"
        begründung: "Es überwacht und erkennt Lagen, die unmittelbar zu körperlichen Schäden an Menschen oder zu Sachschäden führen können, und schützt damit unmittelbar die körperliche Unversehrtheit der Straßeninfrastruktur."
        beleg: "(196)"
      - lage: "Ein Steuerungssystem, das über Telekommunikationsnetze mit Verkehrsteilnehmern sprechen kann (intelligentes Verkehrssteuerungssystem). Es erkennt Verkehr, wertet die empfangenen Daten aus und entscheidet auf dieser Grundlage, etwa um bestimmte Verkehrsteilnehmer zu bevorrechtigen oder Verkehrsteilnehmern mitzuteilen, wie lange eine Ampel rot oder grün bleibt."
        wertung: "hochrisiko"
        begründung: "Es verhindert Unfälle, etwa Zusammenstöße kreuzender Verkehrsströme oder Auffahrunfälle im Stau. Eine Fehlfunktion kann Stillstand, die Behinderung von Rettungsdiensten oder mehr Unfälle an belebten Kreuzungen verursachen; solche Ausfälle schaffen unmittelbare Gefahren für die Unversehrtheit der Infrastruktur und für Leben und Gesundheit von Menschen."
        beleg: "(196)"
      - lage: "Ein System für vorausschauende Wartung, das genauere Vorhersagen zur Wartung der Straßeninfrastruktur erlaubt und Teil einer Reihe von Sicherheitsmaßnahmen ist."
        wertung: "kein_hochrisiko"
        begründung: "Es hilft nur, Ausfälle zu vermeiden, und ist kein Sicherheitsbauteil. Eine Fehlfunktion gefährdet die Sicherheit nicht, weil die Anlage ohne es funktioniert; es ist nur eine von mehreren vorsorglichen Maßnahmen und für den sicheren Betrieb nicht notwendig."
        beleg: "(196)"
      - lage: "Ein System, das als Druckfühler in der Überwachung des Wasserdrucks eingesetzt wird."
        wertung: "hochrisiko"
        begründung: "Es erfüllt die Begriffsbestimmung des Sicherheitsbauteils und soll in der Verteilung von Trinkwasser eingesetzt werden, die zum Fall Wasserversorgung gehört."
        beleg: "(198)"
      - lage: "Ein System, das den Überlauf der Abwasseranlage vorhersagt, soweit dieser das Trinkwasser beeinträchtigt."
        wertung: "hochrisiko"
        begründung: "Es erfüllt die Begriffsbestimmung des Sicherheitsbauteils und soll in der Verteilung von Trinkwasser eingesetzt werden, die zum Fall Wasserversorgung gehört."
        beleg: "(198)"
      - lage: "Ein Werkzeug für vorausschauende Wartung zur Überwachung einer Gasfernleitung, das Betriebsdaten auswertet, um den Wartungsbedarf vorherzusagen."
        wertung: "kein_hochrisiko"
        begründung: "Es steuert keine Schutzaufgaben unmittelbar, und die vorhandenen Sicherheitssysteme bleiben unabhängig davon in Betrieb."
        beleg: "(200)"
      - lage: "Selbstfahrende Roboter, die in einem Heizkraftwerk regelmäßige, vorab festgelegte Runden und Kontrollpunkte abfahren."
        wertung: "kein_hochrisiko"
        begründung: "Das System kann nur erkennen. Es kann keine vorbeugenden Maßnahmen ergreifen, nicht in den Betrieb eingreifen, keine Störungen beheben und keine Gefahren abwenden; ihm fehlt die Schutzaufgabe."
        beleg: "(202)"
      - lage: "Ein System zur Überwachung und zum Schutz des äußeren Umfelds einer Stromanlage, etwa Kamerasysteme, Radarsysteme und die Steuerung von Fluggeräten ohne Besatzung."
        wertung: "hochrisiko"
        begründung: "Es wird eingesetzt, um die körperliche Unversehrtheit der Anlage unmittelbar zu schützen."
        beleg: "(206)"
      - lage: "Ein System, das beim Betrieb von Stromnetzen Abweichungen in Datenmustern erkennt, um kritische Funktionen zu überwachen und Entscheidungen dazu zu unterstützen, etwa die Verteilung der Last, die Netzstabilität oder Abschaltverfahren."
        wertung: "hochrisiko"
        begründung: "Dieser Einsatz ist im amtlichen Text als Beispiel innerhalb des Falls Stromversorgung aufgeführt."
        beleg: "(206)"
      - lage: "Ein System zur Optimierung des Stromnetzes durch Vorhersage des Energiebedarfs."
        wertung: "kein_hochrisiko"
        begründung: "Die Kernaufgaben der Sicherheit werden getrennt davon erledigt, sodass das System keine unmittelbare Schutzaufgabe hat."
        beleg: "(206)"
      - lage: "Ein System zur Überwachung der Netz- und Informationssicherheit in Stromnetzen. Es überwacht fortlaufend den Netzverkehr, erkennt ungewöhnliche Muster und meldet mögliche Angriffe an das Sicherheitspersonal; es arbeitet unabhängig von den Betriebssystemen, die den Stromnetzbetrieb körperlich steuern."
        wertung: "kein_hochrisiko"
        begründung: "Es dient ausschließlich der Abwehr von Angriffen über das Netz."
        beleg: "(206)"
      - lage: "Ein System zur Qualitätssicherung beim Einbau von Stromzählern, das Bilder eingebauter Zähler auswertet und dem Beschäftigten Hinweise auf Fehler und Verbesserungen gibt."
        wertung: "kein_hochrisiko"
        begründung: "Es hat keine unmittelbare Schutzaufgabe."
        beleg: "(206)"
      - lage: "Ein System zur Störungserkennung zur vorsorglichen Vermeidung von Ausfällen. Es erkennt Abweichungen, sagt drohende Ausfälle voraus und warnt die Netzleitstelle, die dann vorsorglich Lasten umschalten kann."
        wertung: "kein_hochrisiko"
        begründung: "Es fehlt die unmittelbare Schutzaufgabe: das System ist nur eine von mehreren vorsorglichen Maßnahmen und für den sicheren Betrieb nicht notwendig. Es wirkt nicht selbst, sondern erweitert nur die Entscheidungsmöglichkeiten der Leitstelle. Selbst wenn es einen Ausfall falsch ankündigt, entsteht kein Ausfall."
        beleg: "(206)"
      - lage: "Ein System, das Abweichungen in Daten aus dem Stromnetzbetrieb erkennt und auswertet, dessen Ergebnis die Grundlage für künftige Verbesserungen im Netzbetrieb ist und von einem Menschen geprüft wird."
        wertung: "kein_hochrisiko"
        begründung: "Es dient dazu, den Entscheidungsvorgang anzureichern, und hat keine unmittelbare Schutzaufgabe."
        beleg: "(206)"
      - lage: "Ein System, das als Assistent Empfehlungen gibt und den Energieverbrauch auf Ebene der Fernleitung, der Region oder vor Ort vorhersagt."
        wertung: "kein_hochrisiko"
        begründung: "Es hat keine unmittelbare Schutzaufgabe."
        beleg: "(206)"
      - lage: "Ein von einem Menschen beaufsichtigtes System, das Ungleichgewichte im Stromnetz vorhersagt, etwa im Abstand von 15 Minuten. Die Vorhersagen stützen die Betriebsplanung, wirken aber auch unmittelbar auf Marktteilnehmer; eine Fehlfunktion könnte innere und äußere Beteiligte in die Irre führen und über schlechtere Einsatz- oder Absicherungsentscheidungen die Netzstabilität und damit die Stromversorgung beeinträchtigen."
        wertung: "kein_hochrisiko"
        begründung: "Zwischen dem System und dem möglichen Schaden fehlt der unmittelbare Zusammenhang."
        beleg: "(206)"
  - fundstelle: "KI-VO/anh-III/nr-2"
    hauptfrage: "Wird Ihr KI-System in der Kernenergieerzeugung eingesetzt?"
    folgefragen:
      - frage: "Wird Ihr System als Sicherheitsbauteil in den Strombestandteilen eines Kernkraftwerks eingesetzt, also in den Teilen, die der Stromerzeugung und Stromübertragung dienen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(206)"
      - frage: "Wird Ihr System sonst als Sicherheitsbauteil in der Kernenergieerzeugung oder innerhalb eines Kernkraftwerks eingesetzt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(206)"
    erfasst:
      - text: "Systeme, die als Sicherheitsbauteil in den Strombestandteilen eines Kernkraftwerks eingesetzt werden, können erfasst sein."
        beleg: "(206)"
    nicht_erfasst:
      - text: "Systeme, die als Sicherheitsbauteil in der Kernenergieerzeugung eingesetzt werden, fallen nicht unter Nummer 2 des Anhangs III. Systeme, die innerhalb von Kernkraftwerken betrieben werden, sind vom Fall kritische Infrastruktur nicht erfasst."
        beleg: "(206)"
      - text: "Erwägungsgrund 5 der Richtlinie über die Widerstandsfähigkeit kritischer Einrichtungen grenzt den Energiebereich ab: die Stromerzeugung kann Teile der Stromübertragung von Kernkraftwerken umfassen, nimmt aber die kernspezifischen Bestandteile aus, die von Verträgen und Unionsrecht einschließlich der einschlägigen Rechtsakte zur Kernkraft erfasst sind."
        beleg: "(205)"
