bereich: "KI-VO/anh-III/nr-6-7-8"
titel: Strafverfolgung, Migration, Rechtspflege und demokratische Prozesse
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitte 3.6 bis 3.8"
hinweis_belegstellen: >-
  Die Beispiellisten im amtlichen Text tragen keine eigenen Absatznummern. Sie sind
  hier mit der letzten davorstehenden Absatznummer belegt: Abschnitt 3.6.2 mit (359),
  3.6.3 mit (362), 3.6.4 mit (365), 3.6.5 mit (368), 3.6.6 mit (370), 3.6.7 mit (372),
  3.7.2 mit (390) fuer die erfassten und (392) fuer die nicht erfassten Beispiele,
  3.7.3 mit (396), 3.7.4 mit (400), 3.7.5 mit (403), 3.8.1 mit (423) fuer die
  Beispiele zu Justizbehoerden und 3.8.2 mit (447). Die Abgrenzung, wann jemand im
  Namen einer Behoerde handelt, steht in Abschnitt 2.5 unter den Absaetzen (79) bis
  (81); Absatz (414) des Abschnitts 3.8.1 verweist ausdruecklich darauf.
punkte:
  - fundstelle: "KI-VO/anh-III/nr-6-vorfragen"
    hauptfrage: "Soll Ihr System bei der Verhuetung, Aufklaerung, Aufdeckung oder Verfolgung von Straftaten oder bei der Vollstreckung von Strafen eingesetzt werden, und zwar von einer dafuer zustaendigen Behoerde, von jemandem in deren Auftrag oder von einer Einrichtung der Europaeischen Union, die solche Behoerden unterstuetzt?"
    folgefragen:
      - frage: "Ist die Stelle, die Ihr System einsetzt, eine Behoerde, die nach dem Gesetz Straftaten verhueten, aufklaeren, aufdecken oder verfolgen oder Strafen vollstrecken darf? Dazu zaehlt auch die Abwehr von Gefahren fuer die oeffentliche Sicherheit."
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(340)"
      - frage: "Ist die Stelle keine Behoerde, hat ihr aber das Recht eines Mitgliedstaats hoheitliche Aufgaben und Befugnisse genau fuer diese Zwecke uebertragen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(340)"
      - frage: "Erfuellt die Stelle nach dem Gesetz tatsaechlich Aufgaben der Strafverfolgung und nicht nur Aufgaben der Verwaltung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(341)"
      - frage: "Hat die Stelle sowohl Aufgaben der Strafverfolgung als auch Aufgaben der Verwaltung, und soll Ihr System allein bei den Verwaltungsaufgaben eingesetzt werden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(341)"
      - frage: "Soll Ihr System von einem Gericht oder einer anderen Stelle eingesetzt werden, die in Strafsachen richterliche Aufgaben wahrnimmt oder zum Justizwesen in Strafsachen gehoert? Dann gilt die Stelle gleichzeitig als Justizbehoerde nach Nummer 8 und als Strafverfolgungsbehoerde nach Nummer 6."
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(342)"
      - frage: "Setzt eine Zollbehoerde Ihr System ein, um zollbezogene Straftaten zu verhueten, aufzuklaeren oder aufzudecken?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(343)"
      - frage: "Setzt eine Zollbehoerde Ihr System allein in ihrer verwaltenden Taetigkeit ein, etwa bei der Einfuhr, der Ausfuhr oder der Durchfuhr von Waren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(349)"
      - frage: "Nimmt ein Nachrichtendienst mit Ihrem System Aufgaben der Strafverfolgung wahr, also Verhuetung, Aufklaerung, Aufdeckung oder Verfolgung von Straftaten oder Strafvollstreckung?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(344)"
      - frage: "Ist Ihr System ausschliesslich fuer militaerische Zwecke, fuer die Verteidigung oder fuer die nationale Sicherheit bestimmt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(344)"
      - frage: "Soll Ihr System sowohl von Strafverfolgungsbehoerden als auch von Nachrichtendiensten genutzt werden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(345)"
      - frage: "Soll Ihr System allein von Nachrichtendiensten genutzt werden, die ausschliesslich ausserhalb der Strafverfolgung arbeiten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(345)"
      - frage: "Hat eine Behoerde Ihrem Unternehmen die Durchfuehrung dieser Taetigkeit ganz oder zum Teil uebertragen oder Ihr Unternehmen im Einzelfall um Unterstuetzung gebeten?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(81)"
      - frage: "Handelt Ihr Unternehmen auf eigene Rechnung, also aus eigenem Entschluss, freiwillig oder allein zur Erfuellung einer eigenen gesetzlichen Pflicht?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(81)"
      - frage: "Setzt eine Einrichtung der Europaeischen Union wie Europol, Eurojust oder die Europaeische Staatsanwaltschaft Ihr System zur Unterstuetzung von Strafverfolgungsbehoerden oder in deren Namen ein?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(347)"
      - frage: "Geht es bei Ihrem System allein um Verstoesse, die keine Straftat sind, also um Verwaltungsverstoesse oder Ordnungswidrigkeiten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(350)"
      - frage: "Verarbeitet Ihr System personenbezogene Daten automatisch, um persoenliche Eigenschaften, Verhalten, Aufenthalt oder Bewegungen eines Menschen zu bewerten oder vorauszusagen? Das nennt die Verordnung Profilbildung."
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(353)"
      - frage: "Wertet Ihr System nur Daten auf Gruppenebene aus, ohne dabei personenbezogene Daten zu verarbeiten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(354)"
      - frage: "Wird ein aus Gruppendaten gewonnenes Muster am Ende auf einzelne Menschen angewandt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(354)"
      - frage: "Analysiert oder kartiert Ihr System allein Orte oder geografische Gebiete, ohne einzelne Menschen zu bewerten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(355)"
      - frage: "Kann Ihr System zusaetzlich Gefuehle wie Wut oder Aggressivitaet erkennen? Dann greift Nummer 1 Buchstabe c des Anhangs III und nicht Nummer 6."
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(355)"
    erfasst:
      - text: "Polizei, Staatsanwaltschaften, Bewaehrungs- und Fuehrungsaufsichtsdienste sowie Justizvollzugsanstalten gelten als Strafverfolgungsbehoerden, soweit sie Aufgaben der Strafverfolgung wahrnehmen."
        beleg: "(341)"
      - text: "Gerichte und andere Stellen, die in Strafsachen richterliche Aufgaben wahrnehmen, gelten gleichzeitig als Justizbehoerden nach Nummer 8 und als Strafverfolgungsbehoerden nach Nummer 6."
        beleg: "(342)"
      - text: "Zollbehoerden gelten in den Faellen als Strafverfolgungsbehoerden, in denen sie zollbezogene Straftaten verhueten, aufklaeren und aufdecken."
        beleg: "(343)"
      - text: "Nimmt ein Nachrichtendienst Aufgaben der Strafverfolgung wahr, kann ein dafuer bestimmtes System hochriskant sein."
        beleg: "(344)"
      - text: "Ein System, das sowohl fuer Strafverfolgungsbehoerden als auch fuer Nachrichtendienste bestimmt ist, ist hochriskant; dasselbe gilt fuer ein gemeinsam entwickeltes System, soweit es auch fuer die Strafverfolgung bestimmt ist."
        beleg: "(345)"
      - text: "Europol, Eurojust und die Europaeische Staatsanwaltschaft sind erfasst; Frontex ist erfasst, soweit seine Taetigkeit Strafverfolgung ist."
        beleg: "(347)"
      - text: "Ein privates Unternehmen handelt im Namen einer Behoerde, wenn die Behoerde ihm die Taetigkeit ganz oder zum Teil uebertraegt oder es im Einzelfall um Unterstuetzung dieser Taetigkeit bittet."
        beleg: "(81)"
      - text: "Die Woerter im Namen von sollen verhindern, dass die Einordnung als hochriskant dadurch umgangen wird, dass ein System nur bestimmten privaten Stellen verkauft wird, obwohl die Gefahr fuer die Grundrechte dieselbe ist."
        beleg: "(80)"
      - text: "Fuehrt ein System Profilbildung bei Menschen durch, ist es immer hochriskant; die Ausnahmen des Filters greifen dann nicht."
        beleg: "(353)"
      - text: "Wird ein Gruppenmuster auf einzelne Menschen angewandt, ist das Profilbildung, weil es diese Menschen unmittelbar betrifft und ihre persoenliche Lage beeinflusst."
        beleg: "(354)"
    nicht_erfasst:
      - text: "Ein privates Unternehmen handelt nicht im Namen einer Behoerde, wenn es auf eigene Rechnung handelt, sei es freiwillig oder zur Erfuellung einer eigenen gesetzlichen Pflicht."
        beleg: "(81)"
      - text: "Behoerden mit gemischten Zustaendigkeiten: Nummer 6 gilt nicht allein deshalb, weil die Behoerde auch Befugnisse der Strafverfolgung hat; sie gilt nur, soweit das System bei der Ausuebung dieser Strafverfolgungsaufgaben eingesetzt werden soll."
        beleg: "(341)"
      - text: "Systeme, die eigens fuer Verwaltungstaetigkeiten bestimmt sind, etwa bei Steuer- und Zollbehoerden fuer Zoelle, Tarife oder Pruefungen ohne Strafcharakter."
        beleg: "(348)"
      - text: "Systeme von Zentralstellen fuer Geldwaescheverdachtsmeldungen, die Verwaltungsaufgaben der Informationsauswertung nach dem Geldwaescherecht der Union erfuellen; dasselbe gilt sinngemaess fuer Verwaltungsstellen auf Unionsebene in diesen Bereichen."
        beleg: "(348)"
      - text: "Systeme fuer Zollbehoerden, solange ihr Einsatz auf Verwaltungsverfahren beschraenkt ist, etwa Einfuhr- und Eingangsverfahren, Ausfuhr- und Ausgangsverfahren und Durchfuhrverfahren."
        beleg: "(349)"
      - text: "Verwaltungsverstoesse sind vom Anwendungsbereich der Nummer 6 ausgenommen."
        beleg: "(350)"
      - text: "Auswertung von Daten auf Gruppenebene ohne Verarbeitung personenbezogener Daten ist keine Profilbildung."
        beleg: "(354)"
      - text: "Die Faelle der Nummer 6 Buchstaben a, d und e erfassen nicht die Analyse oder Kartierung von Orten oder geografischen Gebieten."
        beleg: "(355)"
      - text: "Systeme zur Automatisierung von Verwaltungsaufgaben, etwa Verwaltung und Buchhaltung, Aktenverwaltung, Geraeteverwaltung oder die Einsatzplanung von Streifendiensten; sie sind reine Nebentaetigkeiten der Verwaltung."
        beleg: "(372)"
      - text: "Chatbots auf Internetseiten der Polizei, die allgemeine Auskuenfte geben und Nutzer durch die Seite fuehren."
        beleg: "(372)"
      - text: "Automatische Kennzeichenleser, die bestimmte Fahrzeuge erkennen sollen; die Technik ist auf Fahrzeuge und nicht auf Menschen gerichtet."
        beleg: "(372)"
      - text: "Systeme, die pruefen, ob Regeln der Verkehrssicherheit gebrochen werden, etwa Geschwindigkeitsverstoesse, Rotlichtverstoesse, fehlender Helm oder Handynutzung am Steuer."
        beleg: "(372)"
      - text: "Systeme zur Erkennung von Gegenstaenden, etwa Waffen, verdaechtige Pakete, gefaehrliche Gegenstaende oder gestohlene Waren einschliesslich Kulturgut und Kunst."
        beleg: "(372)"
      - text: "Systeme zur Erkennung ungewoehnlichen Verhaltens oder ungewoehnlicher Bewegungen, etwa Rennen, erhobene Arme, Kampfhaltung oder eine Koerperhaltung, die auf eine gehaltene Waffe hindeutet, in Echtzeit oder im Videobild, solange keine Person bestimmt wird."
        beleg: "(372)"
      - text: "Systeme, die Schussgeraeusche in Echtzeit erkennen; sie arbeiten mit Geraeuschen und nicht mit Menschen."
        beleg: "(372)"
      - text: "Systeme von Zollbehoerden zur Bewertung von Warensendungen; Zollbehoerden, die Sendungen pruefen, gelten im Rahmen der Nummer 6 normalerweise nicht als Strafverfolgungsbehoerden, und die Systeme bewerten die Regelkonformitaet von Waren anhand nachpruefbarer Daten statt persoenlicher Eigenschaften oder Verhalten."
        beleg: "(372)"
      - text: "Systeme von Zoll- oder Strafverfolgungsbehoerden, die Daten zu Warenbewegungen und Transporten auswerten, etwa Schiffsrouten, Haeufigkeit und Muster von Sendungen, Auffaelligkeiten bei angemeldeter Ladung oder Transportarten, um den Missbrauch gewerblicher Transportwege fuer geschmuggelte Waren zu erkennen."
        beleg: "(372)"
      - text: "Die Faelle der Nummer 6 und der Nummer 1 erfassen nicht alle Systeme, die zu Zwecken der Strafverfolgung eingesetzt werden; sie betreffen vor allem Systeme, die unmittelbar auf Menschen angewandt werden oder Entscheidungen wesentlich beeinflussen koennen."
        beleg: "(371)"
    beispiele:
      - lage: "Eine Polizeibehoerde setzt ein System ein, das die Gefahrenlage fuer Terrorismus in einem Stadtbezirk mit Regierungsgebaeuden einschaetzt, etwa niedrig, mittel oder erheblich, und sich dabei auf Gefahrenhinweise aus Lageberichten, die Zahl der letzten Vorfaelle und politische Entwicklungen stuetzt."
        wertung: "kein_hochrisiko"
        begruendung: "Es findet keine Profilbildung bei Menschen statt, die Einschaetzung bewertet keine persoenlichen Merkmale einer bestimmten Person, das Ergebnis gilt gemeinsam fuer alle Anwesenden im Bezirk, und niemand wird als moeglicher Taeter oder moegliches Opfer herausgegriffen."
        beleg: "(355)"
      - lage: "Ein System zur Zollrisikosteuerung liefert Zollbeamten Hinweise darauf, wie wahrscheinlich es ist, dass Waren beim Grenzuebertritt rechtliche Anforderungen nicht erfuellen."
        wertung: "kein_hochrisiko"
        begruendung: "Solche Systeme sollen im Regelfall keine Straftaten verhueten, aufklaeren, aufdecken oder verfolgen, sondern moegliche Verstoesse gegen Regeln zu Agrar- und Lebensmittelsicherheit, Pflanzen- und Tiergesundheit, Rechten des geistigen Eigentums, Produktsicherheit, Umwelt und Abfall oder dem Schutz von Kulturgut anzeigen. Werden sie zusaetzlich zur Aufdeckung von Straftaten eingesetzt, sind sie hochriskant, wenn sie unter einen der Faelle der Nummer 6 fallen."
        beleg: "(349)"
      - lage: "Eine Wirtschaftspruefungsgesellschaft setzt ein System zur Erkennung von Geldwaesche ein, um ihre Pflichten aus dem Geldwaescherecht der Europaeischen Union zu erfuellen."
        wertung: "kein_hochrisiko"
        begruendung: "Die Gesellschaft handelt nicht im Namen von Strafverfolgungsbehoerden, sondern auf eigene Rechnung, weshalb das System im Bereich der Strafverfolgung nach Nummer 6 nicht als hochriskant eingeordnet wird."
        beleg: "(81)"
  - fundstelle: "KI-VO/anh-III/nr-6-a"
    hauptfrage: "Soll Ihr System einschaetzen, wie gross die Gefahr ist, dass ein bestimmter Mensch Opfer einer Straftat wird?"
    folgefragen:
      - frage: "Soll Ihr System von einer Strafverfolgungsbehoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union zur Unterstuetzung solcher Behoerden oder in deren Namen eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(356)"
      - frage: "Bewertet Ihr System die Gefahr fuer einen Menschen als moegliches Opfer und nicht die Gefahr fuer einen Gegenstand, einen Ort, ein Ereignis oder eine Organisation?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(356)"
      - frage: "Geht es darum, dass dieser Mensch kuenftig Opfer einer Straftat werden koennte, und nicht um andere Gefahren wie Unfaelle oder Verwaltungsverstoesse?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(356)"
      - frage: "Verarbeitet Ihr System dazu persoenliche Angaben und Angaben zum Umfeld eines Menschen, etwa Vorgeschichte, Behoerdenberichte oder soziale und familiaere Verhaeltnisse, um die Wahrscheinlichkeit einer Opferwerdung auszugeben?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(357)"
    erfasst:
      - text: "Als Opfer gilt hier ein Mensch, bei dem das System darauf schliesst oder feststellt, dass er der Wahrscheinlichkeit oder der Gefahr eines Schadens ausgesetzt ist, auch eines koerperlichen, seelischen oder gefuehlsmaessigen Schadens oder eines wirtschaftlichen Verlusts, der aus einem Verhalten folgen wuerde, das als Straftat gilt."
        beleg: "(358)"
      - text: "Systeme zur Einschaetzung der Gefahr haeuslicher Gewalt, die Opferaussagen, Polizeiberichte, fruehere Vorfaelle, Daten zu Kontakt- und Naeherungsverboten, Unterlagen der Sozialdienste und weitere Daten auswerten, um die Gefahrenstufe fuer ein moegliches Opfer zu bestimmen. Der Einsatz umfasst Profilbildung, der Filter greift daher nicht."
        beleg: "(359)"
      - text: "Ein System zur Gefahreneinschaetzung, das Justizbehoerden in Strafverfahren nutzen, um die Wahrscheinlichkeit schwerer oder wiederholter Gewalt in Paarbeziehungen einzuschaetzen, etwa beim Erlass oder bei der Aufrechterhaltung eines Kontaktverbots. Da die Einschaetzung Profilbildung umfasst, greift der Filter nicht."
        beleg: "(359)"
      - text: "Systeme zur Erkennung der Gefaehrdung durch Menschenhandel, die die Gefahr einschaetzen, dass ein Mensch Opfer von Menschenhandel wird, besonders bei Grenzuebertritt, Arbeitsausbeutung oder Migration oder bei jungen Menschen aus besonders gefaehrdeten Verhaeltnissen. Sie fassen Anhaltspunkte wie Alter, fehlende gueltige Papiere, Reise mit einem nicht verwandten Erwachsenen, Anzeichen von Fremdbestimmung und Verbindungen zu gefaehrdeten Wirtschaftszweigen zu einem Wert zusammen. Der Einsatz umfasst Profilbildung, der Filter greift daher nicht."
        beleg: "(359)"
    nicht_erfasst:
      - text: "Systeme, die die Gefahr einschaetzen, dass es in einer bestimmten Umgebung oder an einem bestimmten Ort zu Straftaten und Opfern kommt; sie bewerten keine Gefahr fuer bestimmte Menschen, ausser weil diese sich in einem gefaehrlichen Gebiet aufhalten."
        beleg: "(359)"
      - text: "Systeme zur Lageerfassung und Gefahreneinschaetzung, die Einsatzkraefte in den ersten Schritten am gemeldeten Tatort unterstuetzen, etwa ueber Roboter oder Drohnen, und Bild- und Umfelddaten auswerten, um bewaffnete Personen, Waffen oder Gefahren der Umgebung zu erkennen. Allein deswegen sind sie nicht hochriskant, weil sie die unmittelbare Umgebung und nicht die Gefahr fuer bestimmte Menschen bewerten."
        beleg: "(359)"
      - text: "Systeme, die Strassenabschnitte oder Zeiten bestimmen, in denen Unfaelle wahrscheinlich sind; die Gefahr muss sich auf Straftaten und nicht auf Unfaelle beziehen, und solche Systeme sind ortsbezogen."
        beleg: "(359)"
      - text: "Videoauswertung zur Vorhersage von Ueberfuellung, Gedraenge oder baulichen Gefahren bei grossen Versammlungen."
        beleg: "(359)"
      - text: "Modelle zur Hochwassergefahr und zur Ausbreitung von Waldbraenden, die Bevoelkerungsgruppen bestimmen sollen, die Opfer von Unfaellen oder Katastrophen werden koennten."
        beleg: "(359)"
    beispiele:
      - lage: "Ein System soll die Gefahr vorhersagen, dass eine bestimmte Person in einem bestimmten Gebiet eine Straftat begeht."
        wertung: "hochrisiko"
        begruendung: "Ein solches System fiele nicht unter Nummer 6 Buchstabe a, sondern unter Nummer 6 Buchstabe d."
        beleg: "(359)"
      - lage: "Ein System zur Lageerfassung am Tatort hat zusaetzlich die Faehigkeit, Menschen an koerperlichen Merkmalen zu erkennen."
        wertung: "hochrisiko"
        begruendung: "Dann kann es unter Nummer 1 des Anhangs III fallen."
        beleg: "(359)"
  - fundstelle: "KI-VO/anh-III/nr-6-b"
    hauptfrage: "Soll Ihr System als Luegendetektor oder als aehnliches Werkzeug eingesetzt werden, also feststellen, ob ein Mensch die Wahrheit sagt?"
    folgefragen:
      - frage: "Misst Ihr System koerperliche Reaktionen wie Herzschlag, Blutdruck, Atmung oder Hautleitfaehigkeit, um zu beurteilen, ob ein Mensch die Wahrheit sagt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(360)"
      - frage: "Untersucht Ihr System Stimmmuster auf Anzeichen von Taeuschung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(361)"
      - frage: "Beobachtet Ihr System Augenbewegungen oder die Weite der Pupille, um auf geistige Anspannung zu schliessen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(361)"
      - frage: "Erfasst Ihr System Hirnaktivitaet, die mit dem Luegen in Verbindung gebracht wird?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(361)"
      - frage: "Deutet Ihr System kleinste Gesichtsbewegungen, Koerpersprache oder Sprechmerkmale, um auf Taeuschung zu schliessen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(361)"
      - frage: "Zieht Ihr System ueberhaupt Schluesse darueber, ob eine Aussage wahr ist?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(362)"
    erfasst:
      - text: "Systeme, die kleinste Gesichtsbewegungen auswerten, um die Glaubhaftigkeit von Antworten bei einer Befragung zu beurteilen, ebenso Systeme, die Augenbewegungen und Pupillenreaktionen messen, waehrend ein Verdaechtiger Fragen beantwortet. Wegen ihrer Rolle bei der Entscheidung und wegen der Profilbildung greifen die Ausnahmen des Filters nicht."
        beleg: "(362)"
      - text: "Luegendetektoren und aehnliche Werkzeuge koennen zusaetzlich Gefuehle erkennen, weil Angst als Anhaltspunkt fuer eine Luege dienen kann; dann kann das System zusaetzlich unter Nummer 1 des Anhangs III fallen."
        beleg: "(362)"
    nicht_erfasst:
      - text: "Systeme, die Muedigkeit oder Belastung von Polizeibeamten ueber tragbare Messgeraete oder Gesichtsauswertung ueberwachen, und zwar aus Gruenden des Arbeitsschutzes und der Arbeitssicherheit."
        beleg: "(362)"
      - text: "Systeme von Strafverfolgungsbehoerden, die Befragungen verschriftlichen und Aenderungen im Tonfall anzeigen, etwa hoehere Stimmlage oder langsameres und schnelleres Sprechen, ohne Schluesse auf die Wahrheit der Aussagen zu ziehen. Zu pruefen bleibt, ob der Einzelfall nicht doch Gefuehlserkennung ist und damit unter Nummer 1 des Anhangs III fiele."
        beleg: "(362)"
      - text: "Systeme, die Unstimmigkeiten darin aufzeigen, wie verschiedene Pruefer von Luegendetektoren aehnliche Faelle beurteilen, und Strafverfolgungsbehoerden auf Widersprueche hinweisen; ein solches System ist selbst kein Luegendetektor, sondern bewertet die Arbeit der Pruefer."
        beleg: "(362)"
      - text: "Luegendetektoren haben einen anderen Zweck als Systeme zur Gefuehlserkennung nach Nummer 1 Buchstabe c: Luegendetektoren sollen auf Taeuschung schliessen und werden bei Strafverfolgung vor allem bei Befragungen genutzt, waehrend Systeme zur Gefuehlserkennung koerperbezogene Anhaltspunkte auswerten, um auf Gefuehlslagen wie Trauer oder Wut zu schliessen, meist ohne unmittelbaren koerperlichen Kontakt."
        beleg: "(362)"
  - fundstelle: "KI-VO/anh-III/nr-6-c"
    hauptfrage: "Soll Ihr System beurteilen, wie verlaesslich ein Beweis in einer laufenden Ermittlung oder Strafverfolgung ist?"
    folgefragen:
      - frage: "Soll Ihr System von einer Strafverfolgungsbehoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union zur Unterstuetzung solcher Behoerden eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(363)"
      - frage: "Geht es um eine laufende Ermittlung oder Strafverfolgung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(363)"
      - frage: "Beurteilt Ihr System, wie vertrauenswuerdig, zutreffend und glaubhaft ein Beweis ist?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(364)"
      - frage: "Prueft Ihr System die Echtheit eines Beweises?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(364)"
      - frage: "Prueft Ihr System, ob Daten unveraendert sind?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(364)"
      - frage: "Beurteilt Ihr System, wie verlaesslich eine Quelle ist?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(364)"
      - frage: "Prueft Ihr System, ob ein Beweis zu anderen vorhandenen Angaben passt oder in sich widerspruchsfrei ist?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(364)"
      - frage: "Arbeitet Ihr System nur mit den gesammelten Angaben, ohne deren Verlaesslichkeit zu beurteilen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(365)"
    erfasst:
      - text: "Loesungen der digitalen Spurensuche fuer Bild-, Ton- und Videoauswertung, mit denen Strafverfolgungsbehoerden erkennen, ob digitale Bilder, Tonaufnahmen oder Videos veraendert oder manipuliert wurden, etwa um die Echtheit von Aufnahmen aus Ueberwachungskameras oder von Mobiltelefonen zu bestaetigen oder um zu pruefen, ob gesammelte Bilder keine Faelschungen sind."
        beleg: "(365)"
      - text: "Systeme, mit denen Strafverfolgungsbehoerden Veraenderungen an Schriftstuecken oder gefaelschte Unterschriften bestimmen und bewerten."
        beleg: "(365)"
      - text: "Systeme zur Bewertung der Echtheit digitaler Beweise aus Mobiltelefonen oder anderen Geraeten, auch durch Auswertung digitaler Spuren wie Standortdaten oder Verlaeufe zur Erstellung und Aenderung von Dateien, und durch Anzeigen von Punkten, die ein Mensch genauer pruefen muss."
        beleg: "(365)"
      - text: "Systeme, die zustaendige Strafverfolgungsbehoerden bei der Beurteilung der Verlaesslichkeit von Beweisen unterstuetzen, auch von Beweisen aus menschlichen Quellen, etwa der Glaubwuerdigkeit von Hinweisgebern oder Zeugen, indem sie die Widerspruchsfreiheit von Aussagen, ihre Uebereinstimmung mit gesicherten Tatsachen und die Richtigkeit frueherer Angaben derselben Quelle auswerten."
        beleg: "(365)"
    nicht_erfasst:
      - text: "Nicht erfasst sind das Sammeln, Ordnen und Strukturieren von Angaben, das Herausziehen und Verknuepfen von Daten, das Gruppieren von Dokumenten, das Nachbauen von Zeitabläufen, das Veranschaulichen, das Verzeichnen von Dokumenten, das Erkennen von Doppelstuecken, jede Form von Suche, auch Suche ueber Schlagwoerter, Aehnlichkeitssuche, Suche ueber Wissensnetze und Suche nach Inhalt und Bedeutung ueber Text, Ton, Bild und Video, ferner Uebersetzung und Verschriftlichung sowie das Strukturieren und Vereinheitlichen von Daten."
        beleg: "(365)"
      - text: "Systeme fuer den Nachbau von Spuren, die Bildverbesserung oder die Datenrettung aus Geraeten; sie beurteilen die Verlaesslichkeit nicht, sondern helfen Sachverstaendigen, Daten aufzubereiten, wiederherzustellen oder herauszuziehen."
        beleg: "(365)"
      - text: "Systeme, die Tatorte kartieren, nachbauen oder anhand gesammelter Daten wie Fotos und Messungen veranschaulichen; sie helfen beim Verstaendnis raeumlicher Zusammenhaenge und des Ablaufs, ohne die Verlaesslichkeit von Beweisen zu beurteilen."
        beleg: "(365)"
      - text: "Systeme, die Muster in Ermittlungen erkennen und Strafverfolgungsbehoerden darauf hinweisen, etwa aehnliche Einbruchsmethoden bei letzten Diebstaehlen oder aehnliche Opferprofile bei letzten Toetungen; sie finden Zusammenhaenge und Muster, beurteilen aber keine Verlaesslichkeit."
        beleg: "(365)"
      - text: "Systeme zur Erkennung von Darstellungen sexuellen Missbrauchs von Kindern im Netz, ohne deren Verlaesslichkeit als Beweis zu beurteilen; ihre Hauptaufgabe ist das Bestimmen, Anzeigen und Filtern von Inhalten, die moeglicherweise rechtswidrig sind."
        beleg: "(365)"
      - text: "Loesungen fuer Strafverfolgungsbehoerden zur Durchsicht von Darstellungen sexuellen Missbrauchs von Kindern im Netz und zu ihrer Einteilung in neues Material, bereits in der Datenbank erfasstes Material und gefaelschte Bilder; sie beurteilen keine Verlaesslichkeit, sondern filtern und sortieren grosse Mengen eingehenden Materials vor. Eine Einordnung als hochriskant unter einem anderen Fall des Anhangs III, etwa Nummer 6 Buchstabe a, bleibt davon unberuehrt."
        beleg: "(365)"
      - text: "Systeme, mit denen Strafverfolgungsbehoerden Anzeigen aus dem Sexgewerbe im Netz auswerten und diejenigen anzeigen, die am wahrscheinlichsten mit Menschenhandel zusammenhaengen; sie beurteilen keine Verlaesslichkeit, sondern bestimmen, zeigen an und filtern moeglicherweise rechtswidrige Inhalte."
        beleg: "(365)"
      - text: "Systeme, die Spuren auf einem Projektil mit Spuren in einer Vergleichsdatenbank abgleichen, um festzustellen, ob eine bestimmte Waffe fuer eine Straftat benutzt wurde; sie beurteilen keine Verlaesslichkeit, sondern sind ein Mittel der Aktenbearbeitung oder der Datenbanksuche ueber den Vergleich von Aehnlichkeiten."
        beleg: "(365)"
    beispiele:
      - lage: "Ein System wird bei der Beweisbewertung eingesetzt, teilt aber nur die zur Echtheitspruefung ausgewaehlten Schriftstuecke, Bilder, Videos oder anderes Material in Gruppen ein, und diese Einteilung wirkt sich auf die Beurteilung der Verlaesslichkeit nicht aus."
        wertung: "kein_hochrisiko"
        begruendung: "Solche Systeme fallen unter die Ausnahme fuer Systeme, die eine eng begrenzte Verfahrensaufgabe erfuellen."
        beleg: "(365)"
      - lage: "Ein System verzeichnet und beschlagwortet im Lauf der Beweisbewertung gesammelte Finanzunterlagen, etwa damit sie mit Kontobewegungen verglichen oder auf das Vorkommen von Namen oder Gegenstaenden geprueft werden koennen."
        wertung: "kein_hochrisiko"
        begruendung: "Solche Systeme fallen unter die Ausnahmen fuer Systeme, die eine eng begrenzte Verfahrensaufgabe oder eine vorbereitende Aufgabe erfuellen."
        beleg: "(365)"
  - fundstelle: "KI-VO/anh-III/nr-6-d"
    hauptfrage: "Soll Ihr System einschaetzen, wie gross die Gefahr ist, dass ein bestimmter Mensch eine Straftat begeht oder erneut begeht?"
    folgefragen:
      - frage: "Soll Ihr System von einer Strafverfolgungsbehoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union zur Unterstuetzung solcher Behoerden eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(366)"
      - frage: "Bezieht sich die Einschaetzung auf einen oder mehrere bestimmte Menschen und nicht auf Orte oder Gebiete?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(366)"
      - frage: "Stuetzt sich Ihr System allein auf Profilbildung, allein auf die Bewertung von Persoenlichkeitsmerkmalen und Eigenschaften oder allein auf frueheres strafbares Verhalten des Menschen oder der Gruppen, zu denen er gehoert?"
        bei_ja: "nicht_erfasst"
        bei_nein: "erfasst"
        beleg: "(367)"
      - frage: "Unterstuetzt Ihr System eine menschliche Beurteilung, die schon auf nachpruefbaren Tatsachen beruht, die unmittelbar mit einer Straftat zusammenhaengen, etwa weil gegen den Menschen bereits ein begruendeter Verdacht besteht?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(368)"
    erfasst:
      - text: "Liegt mindestens einer der drei Faelle vor, ist das System hochriskant, es sei denn, es fiele unter das Verbot des Artikels 5 Absatz 1 Buchstabe d. Die drei Faelle sind nach Erwaegungsgrund 59 nicht kumulativ, sondern Alternativen."
        beleg: "(367)"
      - text: "Ein System, das bei der ersten Bearbeitung festgenommener jugendlicher Verdaechtiger durch die Polizei einen Wert fuer die Wahrscheinlichkeit erneuter Straftaten berechnet, der dann in eine Entscheidung ueber die zu treffenden Massnahmen einfliesst. Das System entscheidet nicht selbst, das Ergebnis wird neben anderen Angaben beruecksichtigt, und die zustaendigen Behoerden entscheiden am Ende. Es stuetzt sich nicht allein auf Profilbildung, weil nachpruefbare Tatsachen mit unmittelbarem Bezug zu einer Straftat vorliegen; die Beurteilung erfolgt nach der Festnahme."
        beleg: "(368)"
      - text: "Ein System, mit dem Bewaehrungshelfer Beurteilungen fuer Entscheidungen ueber Bewaehrung oder bedingte Entlassung unterstuetzen, indem es Vorstrafen, Verhalten und Entwicklung im Vollzug und weitere fallbezogene Angaben der Aufsicht auswertet; nachpruefbare Tatsachen verbinden den Menschen unmittelbar mit einer Straftat, weil er bereits verurteilt ist."
        beleg: "(368)"
      - text: "Ein System, mit dem eine Justizvollzugsanstalt die Wahrscheinlichkeit erneuter Straftaten anhand von Vorstrafen, Gewalt innerhalb der Anstalt oder sozialen und wirtschaftlichen Angaben vorhersagt; nachpruefbare Tatsachen verbinden den Menschen unmittelbar mit einer Straftat, weil er verurteilt oder wegen Verdachts in Haft ist."
        beleg: "(368)"
      - text: "Ein System zur Gefahreneinschaetzung in Strafgerichten, das die Wahrscheinlichkeit von Rueckfall, gewaltsamer Wiederholung oder weiteren schweren Straftaten einschaetzt. Da es Profilbildung umfasst, greifen die Ausnahmen des Filters nicht."
        beleg: "(368)"
    nicht_erfasst:
      - text: "Systeme, die Orte und Zeitraeume wahrscheinlicher Straftaten vorhersagen, etwa die Einbruchsgefahr in einem Stadtviertel, ohne die Vorhersage mit bestimmbaren Menschen zu verbinden; Nummer 6 Buchstabe d betrifft die Gefahreneinschaetzung bei Menschen und nicht raumbezogene Vorhersagen."
        beleg: "(368)"
      - text: "Ausdruecklich ausgenommen sind Systeme, die sich allein auf Profilbildung, allein auf die Bewertung von Persoenlichkeitsmerkmalen und Eigenschaften oder allein auf frueheres strafbares Verhalten von Menschen oder Gruppen stuetzen; die ersten beiden Faelle sind bereits nach Artikel 5 Absatz 1 Buchstabe d verboten."
        beleg: "(367)"
    beispiele:
      - lage: "Ein System prueft, ob in einem Beurteilungsbogen eines Bewaehrungshelfers alle Pflichtfelder gefuellt sind, oder zeigt Widersprueche in den eingegebenen Daten an, etwa nicht zusammenpassende Daten der Tat oder der Haftzeit."
        wertung: "kein_hochrisiko"
        begruendung: "Das System erfuellt eine vorbereitende Aufgabe fuer die Gefahreneinschaetzung und bewertet keine persoenlichen Merkmale; es erfuellt zudem eine eng begrenzte Verfahrensaufgabe, weil es nur Widersprueche anzeigt."
        beleg: "(368)"
      - lage: "Ein System sammelt Vorstrafen, Bewaehrungsberichte und andere Unterlagen und sortiert sie vor, um eine Fallakte fuer menschliche Bearbeiter vorzubereiten."
        wertung: "kein_hochrisiko"
        begruendung: "Das System erfuellt eine vorbereitende Aufgabe fuer die Gefahreneinschaetzung und kommt daher fuer eine Ausnahme in Betracht."
        beleg: "(368)"
  - fundstelle: "KI-VO/anh-III/nr-6-e"
    hauptfrage: "Soll Ihr System bei der Aufdeckung, Ermittlung oder Verfolgung von Straftaten Profile von Menschen bilden, also personenbezogene Daten automatisch auswerten, um persoenliche Eigenschaften oder Verhalten zu bewerten oder vorauszusagen?"
    folgefragen:
      - frage: "Soll Ihr System von einer Strafverfolgungsbehoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union zur Unterstuetzung solcher Behoerden eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(369)"
      - frage: "Geschieht die Profilbildung im Rahmen der Aufdeckung, Ermittlung oder Verfolgung von Straftaten?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(369)"
      - frage: "Hilft Ihr System dabei, moegliche Verdaechtige oder andere Menschen von Interesse zu bestimmen, etwa Opfer?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(370)"
      - frage: "Wertet Ihr System dafuer verschiedene Arten von Daten aus, etwa Angaben zum Ort, Daten aus Registern, Zeugenbeschreibungen oder Verhalten im Netz, und erzeugt daraus Profile oder Hinweise?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(370)"
    erfasst:
      - text: "Systeme, die beim Verschwinden eines Kindes helfen, moegliche Verdaechtige zu bestimmen, indem sie die Nachbarschaft, die dort wohnenden im Register fuer Sexualstraftaeter eingetragenen Menschen, deren Bewegungen und die Art der frueher missbrauchten Kinder auswerten. Der Zweck ist, aus Verhaltensmustern Rueckschluesse auf einzelne Menschen zu ziehen und sie so als moegliche Verdaechtige herauszufiltern. Stuetzt sich die Beurteilung zusaetzlich auf frueheres strafbares Verhalten und andere nachpruefbare Tatsachen, beruht sie nicht allein auf Profilbildung und Bewertung persoenlicher Merkmale, weshalb Nummer 6 Buchstabe e und nicht das Verbot vorhersagender Polizeiarbeit greift."
        beleg: "(370)"
      - text: "Systeme, die helfen, moegliche Verdaechtige anhand von Zeugenbeschreibungen und anderen personenbezogenen Daten zu bestimmen; sie werten personenbezogene Daten aus, um aus Mustern auf Merkmale der Person und andere persoenliche Umstaende zu schliessen und einzelne Menschen als moegliche Verdaechtige herauszugreifen."
        beleg: "(370)"
      - text: "Ein System, das Beitraege im Netz beobachtet, Nutzer nach Stimmungsauswertung, Veroeffentlichungsmustern und Netzwerken einteilt und Hinweise auf eine moegliche extremistische Zugehoerigkeit setzt. Es wertet Kommunikationsmuster, Sprachgebrauch und Verhaltensanzeichen aus, um Menschen als moeglicherweise radikalisiert einzuordnen, und betreibt damit Profilbildung. Eine verbotene soziale Bewertung liegt nicht vor, weil das System auf die gezielte Beobachtung von Radikalisierung in bestimmten Bereichen beschraenkt ist."
        beleg: "(370)"
    nicht_erfasst:
      - text: "Systeme, die Stadtviertel auswerten und ihnen Werte fuer Kriminalitaet zuweisen, also Systeme zur Kartierung vorhergesagter Kriminalitaet, solange sie keine Profile einzelner Menschen im Sinne der Nummer 6 Buchstaben d und e bilden."
        beleg: "(370)"
      - text: "Systeme, die verdaechtige Zahlungsmuster erkennen, die auf Geldwaesche oder Terrorismusfinanzierung hindeuten, auch wenn sich solche Zahlungen persoenlichen Profilen zuordnen lassen."
        beleg: "(370)"
      - text: "Ein System zur Verknuepfung von Straftaten, das Polizeiberichte und Fallakten mit Angaben wie Zeit, Ort, Vorgehensweise, Beschreibungen von Verdaechtigen und Opfern, koerperlichen Merkmalen, Kleidung, Fahrzeugen und sozialen Kennzahlen auswertet, um Muster und Aehnlichkeiten ueber verschiedene Vorfaelle hinweg zu erkennen und sie zu moeglichen Serien desselben Taeters zu verbinden. Die Ergebnisse sind Warnhinweise, Verknuepfungsvermutungen und Vorhersagen wahrscheinlicher kuenftiger Straftaten, die nicht mit einem bestimmten Menschen verbunden sind."
        beleg: "(370)"
    beispiele:
      - lage: "Ein System erkennt verdaechtige Zahlungsmuster und wird zusaetzlich mit personenbezogenen Daten wie Namen oder Kontonummern angereichert, sodass daraus Profile einzelner Menschen entstehen."
        wertung: "hochrisiko"
        begruendung: "Bewertet das System auf diese Weise persoenliche Merkmale, ist es als hochriskant einzuordnen; allein auf Zahlungsdaten bezogen, etwa auf Betraege, Haeufigkeiten, Abstaende und Leitwege, ist es es nicht."
        beleg: "(370)"
  - fundstelle: "KI-VO/anh-III/nr-7-vorfragen"
    hauptfrage: "Soll Ihr System im Bereich Migration, Asyl oder Grenzkontrolle eingesetzt werden, und zwar von einer dafuer zustaendigen Behoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union?"
    folgefragen:
      - frage: "Ist die Stelle, die Ihr System einsetzt, eine nach Unionsrecht oder nach nationalem Recht fuer diesen Bereich bestimmte Behoerde oder eine Einrichtung der Europaeischen Union, die in ihrem Auftrag handelt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(375)"
      - frage: "Soll Ihr System von einer Grenzschutzbehoerde eingesetzt werden, die Kontrollen an den Aussengrenzen und damit verbundene Aufgaben wahrnimmt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Soll Ihr System von einer Auslandsvertretung oder einer zentralen Visumbehoerde eingesetzt werden, die Visumantraege prueft und ueber Visa entscheidet?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Soll Ihr System von einer Asylbehoerde eingesetzt werden, insbesondere von einer Stelle, die Antraege auf internationalen Schutz in erster Instanz prueft?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Soll Ihr System von einer Einwanderungs-, Rueckkehr- oder Abschiebungsbehoerde eingesetzt werden, die Rueckkehrentscheidungen erlaesst und durchsetzt oder Rueckkehr- und Haftverfahren betreibt?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Soll Ihr System von einer Beschwerde- oder Ueberpruefungsstelle eingesetzt werden, auch von einer Widerspruchsstelle der Verwaltung oder einem Gericht, die Rechtsbehelfe oder Beschwerden gegen Asyl-, Visum- oder Aufenthaltsentscheidungen pruefen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Soll Ihr System von einer Einrichtung der Europaeischen Union in diesem Bereich eingesetzt werden, etwa von Frontex, von der Asylagentur der Europaeischen Union oder von der Agentur fuer das Betriebsmanagement von IT-Grosssystemen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(376)"
      - frage: "Hat eine Behoerde Ihrem Unternehmen die Durchfuehrung dieser Taetigkeit ganz oder zum Teil uebertragen oder Ihr Unternehmen im Einzelfall um Unterstuetzung gebeten?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(81)"
      - frage: "Handelt Ihr Unternehmen auf eigene Rechnung, also aus eigenem Entschluss, freiwillig oder allein zur Erfuellung einer eigenen gesetzlichen Pflicht?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(81)"
      - frage: "Verarbeitet Ihr System koerperbezogene Merkmale wie Gesicht, Fingerabdruecke oder Gangbild?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(379)"
      - frage: "Prueft Ihr System allein Reise- oder Ausweispapiere, etwa auf Bildverschmelzung, ungewoehnliche Tinte, kopierte Unterschriften oder die Gueltigkeit des Chips?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(380)"
      - frage: "Prueft Ihr System, ob eine echte lebende Person vor dem Geraet steht, und wird diese Pruefung allein als Schutz gegen Taeuschung bei einem Abgleich der Person mit ihrem eigenen Reisepapier verwendet?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(380)"
      - frage: "Wird dieselbe Faehigkeit darueber hinaus genutzt, um Menschen im Einsatz zu erkennen, zu verfolgen oder zu bestimmen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(380)"
      - frage: "Ist Ihr System ausschliesslich fuer Suche und Rettung, also zur Lebensrettung, bestimmt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(381)"
      - frage: "Ist Ihr System sowohl fuer die Grenzkontrolle als auch fuer Suche und Rettung oder fuer die Sicherheit der Schifffahrt bestimmt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(381)"
    erfasst:
      - text: "Erfasst sind die nach Unionsrecht oder nationalem Recht fuer diesen Bereich bestimmten nationalen Behoerden sowie Einrichtungen der Europaeischen Union, die im Rahmen ihres Auftrags nach diesem Recht handeln."
        beleg: "(375)"
      - text: "Ein privates Unternehmen handelt im Namen einer Behoerde, wenn die Behoerde ihm die Taetigkeit ganz oder zum Teil uebertraegt oder es im Einzelfall um Unterstuetzung dieser Taetigkeit bittet."
        beleg: "(81)"
      - text: "Verarbeitet ein System koerperbezogene Merkmale, wird es zugleich nach Nummer 1 des Anhangs III als hochriskant eingeordnet, wenn es unter Nummer 1 Buchstabe a, b oder c fällt; es unterliegt dann einer Konformitaetsbewertung durch eine dritte Stelle."
        beleg: "(379)"
      - text: "Pruefungen, ob eine echte lebende Person vor dem Geraet steht, die im Ablauf der Erkennung und Bestimmung von Menschen eingesetzt werden, sind keine Papierpruefung und werden im Regelfall nach Nummer 7 Buchstabe d als hochriskant eingeordnet, es sei denn, das System dient der biometrischen Fernidentifizierung, dann greift Nummer 1 Buchstabe a."
        beleg: "(380)"
      - text: "Ist ein System sowohl fuer die Grenzkontrolle als auch fuer Suche und Rettung oder fuer die Sicherheit der Schifffahrt bestimmt, fällt es wegen der beabsichtigten Nutzung zur Grenzkontrolle unter Nummer 7."
        beleg: "(381)"
      - text: "Werkzeuge zur Erkennung von Taeuschung oder Glaubhaftigkeit an der Grenze, etwa ueber kleinste Gesichtsbewegungen oder Stimmbelastung, gelten nicht als biometrische Fernidentifizierung und werden im Regelfall nach Nummer 7 als hochriskant eingeordnet, weil sie die Identitaet nicht ueber einen Datenbankabgleich feststellen."
        beleg: "(386)"
      - text: "Fällt ein System unter eines der Verbote des Artikels 5, ist sein Einsatz verboten; sind nicht alle Voraussetzungen des Verbots erfuellt, ist es als hochriskant einzuordnen, wenn es unter Nummer 1 oder Nummer 7 des Anhangs III fällt."
        beleg: "(382)"
      - text: "Werkzeuge, die kuenftiges strafbares Verhalten von Menschen an der Grenze vorhersagen, koennen unter das Verbot des Artikels 5 Absatz 1 Buchstabe d fallen; sind nicht alle Voraussetzungen erfuellt, kann dasselbe Werkzeug nach Nummer 7 Buchstabe b hochriskant sein, wenn sein Zweck die Einschaetzung eines Migrationsrisikos ist."
        beleg: "(385)"
      - text: "Ein Grenzuebergang gilt nicht als oeffentlich zugaenglicher Ort, weshalb das Verbot der biometrischen Fernidentifizierung in Echtzeit dort nicht greift; der Einsatz wird aber wahrscheinlich nach Nummer 1 oder Nummer 7 des Anhangs III als hochriskant eingeordnet. Die Strasse zu einem Grenzuebergang oder ein Wald in der Naehe ist dagegen im Regelfall ein oeffentlich zugaenglicher Ort, und bei einem Flughafen gilt das fuer die allgemeinen Bereiche, nicht fuer den Bereich der Grenzkontrolle."
        beleg: "(387)"
    nicht_erfasst:
      - text: "Ein privates Unternehmen handelt nicht im Namen einer Behoerde, wenn es auf eigene Rechnung handelt, sei es freiwillig oder zur Erfuellung einer eigenen gesetzlichen Pflicht."
        beleg: "(81)"
      - text: "Systeme zur Pruefung von Reise- oder Ausweispapieren, auch auf Bildverschmelzung, ungewoehnliche Tinten, kopierte Unterschriften oder die Gueltigkeit des Chips und der zugehoerigen Schluesselverwaltung, fallen nicht unter Nummer 7 Buchstabe d."
        beleg: "(380)"
      - text: "In fliessenden Grenzverfahren, in denen Reisende sich selbst zum Abgleich mit ihrem eigenen Reisepapier vorstellen, bleibt die Pruefung auf Taeuschungsversuche Teil dieser Abgleichsfunktion und macht das System allein dadurch nicht hochriskant."
        beleg: "(380)"
      - text: "Systeme, die ausschliesslich fuer Suche und Rettung, also zur Lebensrettung, bestimmt sind, fallen nicht unter den Fall der Grenzkontrolle und sind nach Nummer 7 nicht hochriskant."
        beleg: "(381)"
      - text: "Werkzeuge zur Verhaltensauswertung, etwa zu Stimmbelastung, kleinsten Gesichtsbewegungen oder Blickmustern, sind nicht schon deshalb verboten, weil sie Anspannung oder kulturell gepraegte Ausdrucksformen falsch deuten koennen; solche Fehldeutungen koennen die Beweisbewertung beeinflussen, haben aber nicht zwingend den Zweck oder die Wirkung, das Verhalten eines Menschen zu verzerren."
        beleg: "(383)"
    beispiele:
      - lage: "Ein System bewertet oder ordnet Migranten ueber einen Zeitraum hinweg nach koerperlichen Reaktionen, Verhalten einschliesslich der Taetigkeit im Netz oder anderen persoenlichen Daten, um daraus einen allgemeinen Wert fuer Vertrauenswuerdigkeit oder Gefahr zu bilden, besonders wenn das ueber verschiedene Lebensbereiche hinweg geschieht oder zu Nachteilen fuehrt."
        wertung: "hochrisiko"
        begruendung: "Ein solches System kann eine nach Artikel 5 Absatz 1 Buchstabe c verbotene soziale Bewertung sein; Anbieter und Betreiber muessen sicherstellen, dass der Einsatz nicht darauf hinauslaeuft."
        beleg: "(384)"
  - fundstelle: "KI-VO/anh-III/nr-7-a"
    hauptfrage: "Soll Ihr System im Bereich Migration, Asyl oder Grenzkontrolle als Luegendetektor oder als aehnliches Werkzeug eingesetzt werden?"
    folgefragen:
      - frage: "Wertet Ihr System koerperliche, verhaltensbezogene oder koerpermerkmalbezogene Signale aus, um darauf zu schliessen, dass ein Mensch taeuscht?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(388)"
      - frage: "Soll Ihr System in diesem Bereich von einer Strafverfolgungsbehoerde oder in deren Namen eingesetzt werden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(388)"
      - frage: "Wertet Ihr System Stimmmuster, kleinste Gesichtsbewegungen oder Gesichtsmuskelbewegungen, Blick, Koerperhaltung oder Koerperbewegungen aus, erstellt Waermebilder koerperlicher Reaktionen oder verbindet mehrere dieser Signale in einer Befragungsumgebung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(390)"
      - frage: "Werden diese Signale allein zu anderen Zwecken als zum Schluss auf Taeuschung verwendet, etwa zur Erkennung von Sprache oder Mundart?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(390)"
    erfasst:
      - text: "Die Einordnung als hochriskant gilt auch dann, wenn die zustaendigen Behoerden die endgueltige Entscheidung ueber Einreise, Aufenthalt oder Schutz nicht selbst treffen; auch bei menschlicher Letztentscheidung kann die Ausgabe des Systems die Entscheidung wegen uebermaessigen Vertrauens und der Neigung, der Maschine zu folgen, erheblich beeinflussen."
        beleg: "(389)"
      - text: "Grenzbeamte setzen in der zweiten Kontrolllinie an einem Aussengrenzflughafen ein System ein, das waehrend einer von einem Beamten gefuehrten Befragung die sprachlichen und nichtsprachlichen Reaktionen des Reisenden auswertet und dem Beamten einen ergaenzenden Hinweis zur Glaubhaftigkeit gibt."
        beleg: "(390)"
      - text: "Eine Auslandsvertretung setzt ein System ein, das Stimmmuster und Antworten eines Antragstellers waehrend eines von Konsularbeamten gefuehrten Visumgespraechs auswertet und dem Beamten ergaenzende Hinweise zur Wahrheit der Aussagen gibt."
        beleg: "(390)"
      - text: "Der Filter greift bei solchen Systemen nicht, weil sie bewertende Ausgaben erzeugen, die den Inhalt einer Einzelpruefung unmittelbar beeinflussen, und daher keine eng begrenzte Verfahrensaufgabe, keine vorbereitende und keine nachgelagerte Aufgabe erfuellen."
        beleg: "(391)"
      - text: "Solche Systeme sind nicht nach Artikel 5 Absatz 1 Buchstabe h verboten und auch nicht nach Nummer 1 Buchstabe a des Anhangs III hochriskant, weil sie keine biometrische Fernidentifizierung sind: sie arbeiten mit der taetigen Mitwirkung des Menschen in einem Gespraech von Angesicht zu Angesicht, vergleichen die Identitaet nicht mit vielen Eintraegen einer Vergleichsdatenbank und zielen nicht darauf, die Identitaet festzustellen."
        beleg: "(392)"
    nicht_erfasst:
      - text: "Ein System, das Gespraechston verarbeitet, wie Luegendetektoren es tun, aber nicht auf Taeuschung schliesst, sondern das Gespraech selbsttaetig verschriftlicht oder die Antworten fuer die Akte in eine andere Sprache der Europaeischen Union uebersetzt."
        beleg: "(392)"
      - text: "Ein System, das allein sachliche, nicht nach Bedeutung geordnete Zusammenfassungen von Gespraechen fuer die Akte erstellt, ohne Bewertung der Glaubhaftigkeit und ohne Empfehlungen; es beurteilt keine Taeuschung."
        beleg: "(392)"
      - text: "Solche Systeme sind nicht von sich aus nach Artikel 5 Absatz 1 Buchstabe b verboten, es sei denn, sie sind darauf angelegt oder werden dazu genutzt, das Verhalten schutzbeduerftiger Menschen in erheblich schaedlicher Weise zu verzerren."
        beleg: "(392)"
    beispiele:
      - lage: "Ein System vereinheitlicht Ton- und Bildsignale, etwa durch Rauschminderung, Anpassung der Beleuchtung oder Herausziehen von Gesichtspunkten, damit Sachbearbeiter Aufnahmen leichter durchsehen koennen."
        wertung: "kein_hochrisiko"
        begruendung: "Erzeugt das System keine Schluesse auf Taeuschung und legt es solche auch nicht nahe, kann es unter die Ausnahme fuer Systeme mit vorbereitender Aufgabe fallen."
        beleg: "(392)"
  - fundstelle: "KI-VO/anh-III/nr-7-b"
    hauptfrage: "Soll Ihr System einschaetzen, welche Gefahr von einem Menschen ausgeht, der in einen Mitgliedstaat einreisen will oder eingereist ist, etwa eine Gefahr fuer die Sicherheit, eine Gefahr unerlaubter Migration oder eine Gefahr fuer die Gesundheit?"
    folgefragen:
      - frage: "Soll Ihr System von einer zustaendigen Behoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(393)"
      - frage: "Ist es der Zweck Ihres Systems, fuer einen einzelnen Menschen einen Gefahrenwert, eine Einstufung oder einen Hinweis zu erzeugen, der Entscheidungen ueber Einreise, Aufenthalt, Haft, Rueckkehr oder damit verbundene Massnahmen beeinflussen kann?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(394)"
      - frage: "Fasst Ihr System Daten nur zu einer uebergeordneten Uebersicht zusammen, etwa durch Summieren, Durchschnittsbildung oder Gruppieren, und sind die Ergebnisse keinem bestimmten Menschen zugeordnet?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(394)"
      - frage: "Verarbeitet Ihr System dabei personenbezogene Daten?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(395)"
      - frage: "Verarbeitet Ihr System allein anonymisierte Daten, sodass kein Mensch bestimmt oder bestimmbar ist?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(395)"
      - frage: "Wird ein aus Gruppendaten gewonnener Anhaltspunkt am Ende auf einen namentlich bekannten oder bestimmbaren Reisenden angewandt, um einen Hinweis oder eine Vorsortierung zu erzeugen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(395)"
    erfasst:
      - text: "Gefahrenbewertung bei Einreisekontrollen: ein System, das Vorgeschichte, Reisemuster und Treffer in Fahndungslisten eines Reisenden auswertet und einen Gefahrenwert erzeugt, den Grenzbeamte nutzen, um ueber eine Weiterleitung in die zweite Kontrolllinie zu entscheiden."
        beleg: "(396)"
      - text: "Selbsttaetige Sicherheitshinweise: ein System, das bei der Reisegenehmigung oder Visumbearbeitung personenbezogene Gefahrenhinweise zu Sicherheit, unerlaubter Migration oder Gesundheit berechnet und namentlich bekannte Reisende zu weiteren Pruefungen weiterleitet."
        beleg: "(396)"
      - text: "Visumbewertung: ein System, das Visumantragsteller nach der vorhergesagten Gefahr eines ueberlangen Aufenthalts ordnet und dabei Staatsangehoerigkeit und aehnliche Ersatzmerkmale nutzt, was fuer bestimmte Gruppen zu verschaerften Verfahren fuehrt."
        beleg: "(396)"
      - text: "Hinweise auf Migrationsabsicht aus Suchverhalten: ein System, das aus dem letzten Suchverhalten im Netz eines namentlich bekannten Reisenden auf die Wahrscheinlichkeit unerlaubter Migration schliesst und daraus bei der Einreisekontrolle einen personenbezogenen Hinweis erzeugt."
        beleg: "(396)"
      - text: "Gesundheitsbezogene Hinweise zu einzelnen Menschen: ein System, das anhand koerperbezogener Messwerte und der letzten Reisen beurteilt, ob ein Mensch eine Ansteckungsgefahr darstellt, und ihn fuer weitere medizinische Untersuchungen vormerkt."
        beleg: "(396)"
      - text: "Aus Gegenstaenden und Reisewegen abgeleitete personenbezogene Gefahr: ein System, das Kennzeichenerfassungen und Fahrzeiten verarbeitet, um einen personenbezogenen Hinweis zu erzeugen, dass ein namentlich bekannter Reisender eine erhoehte Gefahr unerlaubter Migration darstellt, weil seine Fahrt zwischen zwei Punkten ungewoehnlich lang war, und ihn zur zweiten Kontrolle weiterleitet. Das gilt auch, wenn ein zweites System oder ein Mensch die endgueltige Beurteilung vornimmt."
        beleg: "(396)"
      - text: "Gruppenbezogene Anhaltspunkte, die auf einzelne Menschen angewandt werden: ein System, das aus zusammengefassten Verlaufsdaten gruppenbezogene Anhaltspunkte bildet, etwa Quoten ueberlangen Aufenthalts nach Reiseweg und Jahreszeit, und diese auf die personenbezogenen Daten namentlich bekannter Reisender anwendet, um personenbezogene Hinweise fuer verschaerfte Kontrollen zu erzeugen."
        beleg: "(396)"
      - text: "Zusammengesetzte Anlagen aus Bausteinen, die einzeln nicht hochriskant sind: ein System, das aus zusammengefassten Verlaufsdaten gruppenbezogene Anhaltspunkte bildet, wird mit einer regelbasierten Einheit ohne kuenstliche Intelligenz verbunden, die diese Anhaltspunkte auf namentlich bekannte Reisende anwendet und personenbezogene Hinweise erzeugt. Einzeln betrachtet ist kein Baustein hochriskant, zusammen mit dem Zweck, die Gefahr durch einen Menschen einzuschaetzen, ist die Gesamtanlage hochriskant und kommt fuer den Filter nicht in Betracht."
        beleg: "(396)"
      - text: "Solche Ausgaben beeinflussen den Inhalt der Beurteilung wesentlich und sind keine Aufgaben, die fuer den Filter in Betracht kommen."
        beleg: "(396)"
    nicht_erfasst:
      - text: "Ein System, das grosse Datenmengen verarbeitet und zusammenfasst, um Entwicklungen und Muster der Migration zu erkennen, Bewegungen vorauszusehen oder moegliche Netzwerke unerlaubter Migration auf zusammengefasster Ebene zu bestimmen, solange aus den zusammengefassten Daten kein Mensch bestimmt oder bestimmbar ist."
        beleg: "(396)"
      - text: "Ein System, das zusammengefasste Daten verarbeitet, etwa Herkunftsland, Merkmale des Reisewegs oder aktuelle Krankheitslage, um eine ankommende Gruppe als gesundheitlich erhoeht gefaehrdet zu kennzeichnen und Massnahmen des Gesundheitsschutzes wie Tests oder Quarantaene auszuloesen, wenn dieselbe Massnahme fuer alle Mitglieder der Gruppe gilt. Werden dagegen einzelne Menschen innerhalb der Gruppe nach ihren eigenen Merkmalen fuer eine andere Behandlung ausgewaehlt, fällt das System unter diesen Fall."
        beleg: "(396)"
      - text: "Ein System, das Kennzeichenerfassungen und Fahrzeiten verarbeitet, um Fahrzeuge mit ungewoehnlich langen Fahrten zu kennzeichnen und das Fahrzeug auf eine allgemeine zweite Spur zur technischen Pruefung zu leiten, ohne damit eine Gefahreneinschaetzung zu Fahrer oder Mitfahrern zu erzeugen oder nahezulegen. Dass Grenzbeamte danach auch die Mitfahrenden pruefen, macht die Ausgabe nicht zu einer personenbezogenen Gefahreneinschaetzung."
        beleg: "(396)"
      - text: "Ein System, das Fahrzeuge an einem Grenzuebergang beobachtet, um gestohlene Fahrzeuge fuer eine zweite Pruefung zu kennzeichnen; es schaetzt keine Gefahr ein, die von einem Menschen ausgeht."
        beleg: "(396)"
      - text: "Ein System, das in abgeschlossenen Gefahrenbeurteilungen die Begriffe vereinheitlicht und Doppeleintraege erkennt, nachdem die menschliche Beurteilung beendet ist; es erzeugt keine personenbezogene Gefahrenausgabe fuer Entscheidungen ueber Einreise oder Aufenthalt."
        beleg: "(396)"
      - text: "Werden zusammengefasste Daten verarbeitet und wird dabei kein Mensch bestimmt oder bestimmbar, liegt keine Profilbildung vor; eine geringe Zusammenfassung oder die Verknuepfbarkeit mit anderen Datenbestaenden kann zusammengefasste Daten jedoch wieder zu personenbezogenen Daten machen."
        beleg: "(395)"
      - text: "Ein System kann den Filter nur nutzen, wenn es eine eng begrenzte Verfahrensaufgabe oder eine rein vorbereitende Aufgabe erfuellt, dabei selbst keine Profilbildung vornimmt und den Inhalt oder das Ergebnis einer einzelnen Gefahrenbeurteilung nicht wesentlich beeinflusst; zusammengesetzte Anlagen werden als Ganzes beurteilt."
        beleg: "(396)"
  - fundstelle: "KI-VO/anh-III/nr-7-c"
    hauptfrage: "Soll Ihr System eine Behoerde dabei unterstuetzen, einen Antrag auf Asyl, Visum oder Aufenthalt oder eine dazugehoerige Beschwerde zu pruefen, also die Frage, ob der Mensch die Voraussetzungen fuer einen Status erfuellt?"
    folgefragen:
      - frage: "Soll Ihr System von einer zustaendigen Behoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(397)"
      - frage: "Geht es um einen Antrag auf Asyl, Visum oder Aufenthalt oder um eine dazugehoerige Beschwerde? Eines davon genuegt."
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(399)"
      - frage: "Betrifft die Beschwerde Punkte, die die inhaltliche Beurteilung des Antrags beeinflussen koennen, etwa Tatsachen, Beweise oder Glaubhaftigkeit, oder die Verfahrensgerechtigkeit, etwa das Recht auf Anhoerung, die Verdolmetschung oder die Begruendung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(398)"
      - frage: "Betrifft die Beschwerde allein die allgemeine Dienstqualitaet, also organisatorische oder ablauftechnische Fragen, die die inhaltliche Beurteilung und die Verfahrensgerechtigkeit nicht beruehren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(398)"
      - frage: "Beeinflussen die Ausgaben Ihres Systems den Inhalt oder das Ergebnis der Statusentscheidung wesentlich, etwa indem sie Beweise bestaetigen oder in Frage stellen, Widersprueche aufzeigen, Punkte nach Bedeutung ordnen oder Merkmale des Status vorab einordnen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(399)"
      - frage: "Gewinnt Ihr System seine Ausgaben aus dem Inhalt eines laufenden Falls, also aus Aussagen, Unterlagen oder Herkunftslandinformationen, und nutzt sie, um Beweise nach Bedeutung zu ordnen, hervorzuheben, zu bestaetigen oder in Frage zu stellen oder um naechste Schritte zu empfehlen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(399)"
      - frage: "Beurteilt Ihr System die Verlaesslichkeit von Beweisen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(399)"
      - frage: "Ist Ihr System ein einziger zusammengefasster Assistent, der die Pruefung der Statusvoraussetzungen steuert?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(400)"
      - frage: "Sind die einzelnen Funktionen Ihres Systems wirklich trennbar und werden sie eigenstaendig in Betrieb genommen, etwa als selbststaendige Werkzeuge?"
        bei_ja: "weiter"
        bei_nein: "erfasst"
        beleg: "(400)"
    erfasst:
      - text: "Die Unterstuetzung ist nicht auf die Entscheidung selbst beschraenkt; erfasst sind auch fruehere Schritte der Pruefung, etwa Schritte, die Gespraechsinhalte, Unterlagen oder Herkunftslandinformationen auswerten und fuer die Entscheidung in der Sache von Bedeutung sind."
        beleg: "(399)"
      - text: "Der Zusatz einschliesslich der damit verbundenen Beurteilung der Verlaesslichkeit von Beweisen bedeutet, dass Pruefungen der Verlaesslichkeit nur Beispiele sind und die Aufzaehlung nicht abschliessend ist."
        beleg: "(399)"
      - text: "Systeme, die die Verlaesslichkeit von Beweisen beurteilen, beeinflussen die Entscheidung im Regelfall wesentlich und sind daher grundsaetzlich hochriskant, etwa bei der Erkennung von Bildverschmelzung in Papieren."
        beleg: "(399)"
      - text: "Ein System zur Beurteilung der Echtheit und Widerspruchsfreiheit von Unterlagen oder der Glaubhaftigkeit persoenlicher Schilderungen, das dem Pruefer Hinweise zur Glaubwuerdigkeit gibt, auf die er sich bei der Statusentscheidung stuetzt."
        beleg: "(400)"
      - text: "Ein System, das rechtmaessig von einem Geraet erlangte Telefondaten auswertet, um Reisewege, Zeitablaeufe oder Kontakte zu bestaetigen, und daraus Hinweise fuer die Statuspruefung erzeugt."
        beleg: "(400)"
      - text: "Ein System zur Erkennung von Bildverschmelzung, abweichenden Tinten, kopierten Unterschriften oder der Gueltigkeit von Chip und Schluesselverwaltung, soweit die Papierpruefung ein Schritt im Pruefverfahren fuer ein Visum, einen Aufenthaltstitel oder internationalen Schutz ist."
        beleg: "(400)"
      - text: "Ein System, das inhaltliche oder fuer die Glaubwuerdigkeit bedeutsame Abweichungen gegenueber frueheren Angaben bestimmt, um die anschliessende Pruefung des Antrags oder der Beschwerde zu unterstuetzen."
        beleg: "(400)"
      - text: "Ein System, das aufgenommene Sprache auswertet, um ein wahrscheinliches Herkunftsland oder eine wahrscheinliche Herkunftsregion anzuzeigen, damit die Behoerde dies in ihrer Begruendung und bei der Auswahl der Herkunftslandinformationen verwendet."
        beleg: "(400)"
      - text: "Bausteine mit geringem Risiko innerhalb eines einzigen Assistenten, der die Pruefung der Statusvoraussetzungen steuert, koennen den Filter nicht nutzen, und ihr Einbau bringt auch das Gesamtsystem nicht unter den Filter."
        beleg: "(400)"
    nicht_erfasst:
      - text: "Ein System, das Antragstellern haeufige Fragen beantwortet, sie zu den richtigen Formularen fuehrt, Termine vergibt oder ueber den Stand des Antrags benachrichtigt; es unterstuetzt die Behoerde nicht bei der Pruefung der Statusvoraussetzungen oder der Beschwerden, sondern erbringt eine Dienstleistung fuer die Antragsteller."
        beleg: "(400)"
      - text: "Nicht erfasst sind Beschwerden ueber die allgemeine Dienstqualitaet, also ueber organisatorische oder ablauftechnische Seiten der Leistungserbringung, die die inhaltliche Beurteilung der Statusvoraussetzungen oder die Verfahrensgerechtigkeit nicht beruehren."
        beleg: "(398)"
    beispiele:
      - lage: "Ein System ordnet eine Fallakte allein nach festgelegten Kategorien zur Ablage und zum Wiederfinden, etwa Ausweispapiere, Gesundheitsunterlagen, Gespraechsnotizen, ohne das Material nach Bedeutung zu ordnen und ohne etwas auszulassen."
        wertung: "kein_hochrisiko"
        begruendung: "Das Anbringen fester, vorgegebener Bezeichnungen zur Ablage und zum Wiederfinden ist eine eng begrenzte Verfahrenshandlung; das System bewertet keine Beweise, setzt keine Rangfolge und beeinflusst die Beurteilung nicht."
        beleg: "(400)"
      - lage: "Ein System prueft Visumantraege auf Vollstaendigkeit und Form und sortiert oder verteilt Akten zur verwaltungsmaessigen Bearbeitung nach oeffentlichen und sachlichen Maßstaeben, wobei es nur technische und nicht auslegende Handlungen vornimmt, den Inhalt nicht bewertet, den Verfahrensweg nicht bestimmt und die Pruefung inhaltlich nicht steuert."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfuellt eine eng begrenzte Verfahrensaufgabe."
        beleg: "(400)"
      - lage: "Ein System zeigt woertliche Unterschiede zwischen aktuellen und frueheren Aussagen an, etwa Unterschiede auf Zeichenebene, ohne eine Bewertung der Glaubwuerdigkeit zu erzeugen und ohne Nachfragen zu empfehlen."
        wertung: "kein_hochrisiko"
        begruendung: "Bewertet das System dagegen die Bedeutung der Unterschiede oder bezeichnet es sie als Zweifel an der Glaubwuerdigkeit, greift die Ausnahme nicht mehr."
        beleg: "(400)"
      - lage: "Ein Vorpruefwerkzeug leitet einen Antragsteller nach strengen, sachlichen Regeln zur Zahlung einer festen Gebuehr, etwa weil ein Abkommen zur Visumerleichterung die Gebuehr fuer Antragsteller aus einem bestimmten Land festlegt."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfuellt eine eng begrenzte Verfahrensaufgabe."
        beleg: "(400)"
      - lage: "Ein System prueft Akten einer Reisegenehmigung oder eines Visums auf Vollstaendigkeit oder Form, etwa Pflichtfelder und das Vorhandensein von Unterlagen, ohne einen Gefahrenwert, einen Hinweis oder eine Vorsortierung von Menschen zu erzeugen."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfuellt eng begrenzte Verfahrensaufgaben und keine vorbereitenden Aufgaben, weil es keine inhaltlichen Teile fuer die Pruefung vorbereitet oder strukturiert."
        beleg: "(400)"
      - lage: "Ein System verschriftlicht Gespraeche, uebersetzt Gespraechsmitschriften oder erstellt sachliche Zusammenfassungen fuer die Akte, ohne zu naechsten Schritten zu raten und ohne Ergebnisse vorzuschlagen."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfuellt eine vorbereitende Aufgabe; geht ein System darueber hinaus, etwa indem es Angaben hinzufuegt, die in den Aussagen nicht enthalten sind, die Glaubwuerdigkeit bewertet oder die Aussagen mit dem Rechtsrahmen verknuepft, greift die Ausnahme nicht."
        beleg: "(400)"
      - lage: "Ein System durchsucht elektronische Geraete in grossem Umfang, um Begleitdaten zum Reiseweg eines Menschen herauszuziehen, und gibt alle Standortdaten sachlich aus, ohne eine Angabe gegenueber einer anderen zu bevorzugen."
        wertung: "kein_hochrisiko"
        begruendung: "Das kann als vorbereitende Aufgabe gelten."
        beleg: "(400)"
      - lage: "Ein System vereinheitlicht Begriffe und verbessert die Sprache in einer Entscheidung, nachdem die menschliche Beurteilung abgeschlossen ist, ohne zusaetzliche Begruendung einzufuehren und ohne das Ergebnis zu aendern."
        wertung: "kein_hochrisiko"
        begruendung: "Es verbessert das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit; ein System, das rechtliche oder tatsaechliche Gruende erschliesst oder formuliert, die nicht ausdruecklich genannt sind, oder das die Glaubwuerdigkeit erneut bewertet, ist davon nicht gedeckt."
        beleg: "(400)"
      - lage: "Ein System wertet abgeschlossene Statusakten aus, um Muster oder Abweichungen in der Entscheidungspraxis fuer die Qualitaetssicherung zu erkennen, ohne Ergebnisse fuer laufende Faelle vorzuschlagen."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfuellt die Ausnahme fuer die nachtraegliche Erkennung von Mustern; dafuer muss das System auf die nachtraegliche Erkennung von Mustern oder Abweichungen angelegt sein."
        beleg: "(400)"
  - fundstelle: "KI-VO/anh-III/nr-7-d"
    hauptfrage: "Soll Ihr System im Bereich Migration, Asyl oder Grenzkontrolle Menschen aufspueren, erkennen oder bestimmen?"
    folgefragen:
      - frage: "Soll Ihr System von einer zustaendigen Behoerde, in deren Namen oder von einer Einrichtung der Europaeischen Union eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(401)"
      - frage: "Ist es der Zweck Ihres Systems, Menschen aufzuspueren, zu erkennen oder zu bestimmen?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(401)"
      - frage: "Beschraenkt sich Ihr System auf die Pruefung von Reisepapieren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(402)"
      - frage: "Prueft Ihr System am Menschen selbst, etwa ob eine echte lebende Person vorhanden ist oder ob ein Taeuschungsversuch vorliegt, und geschieht das im Ablauf der Erkennung oder Bestimmung von Menschen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(402)"
      - frage: "Ist Ihr System ausschliesslich fuer Suche und Rettung bestimmt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(403)"
    erfasst:
      - text: "Ein System mit Gesichtserkennung in Echtzeit fuer Identitaetspruefungen an Grenzuebergaengen, das Bilder aus laufenden Kameras mit koerperbezogenen Vorlagen in angeschlossenen Systemen vergleicht und Treffer zur Identitaet fuer das Handeln der Bediener ausgibt."
        beleg: "(403)"
      - text: "Dienste, die Satellitenbilder mit Ueberwachungstuermen oder unbemannten Fluggeraeten verbinden und die Anwesenheit von Menschen fuer eine grenzpolizeiliche Reaktion gegen die aufgespuerten Menschen anzeigen, etwa um Streifen zu entsenden, Menschen aufzugreifen oder sie der zweiten Kontrolllinie zuzufuehren."
        beleg: "(403)"
      - text: "Ein System zur Seeraumueberwachung, das Menschen fuer die Migrationssteuerung oder fuer grenzpolizeiliche Einsaetze aufspuert und verfolgt, auch zur Veranlassung von Aufgriff oder Anbordgehen; es kommt auf den Zweck und nicht auf den Ort an, also nicht darauf, ob das Fahrzeug in Hoheitsgewaessern, in der Anschlusszone oder auf hoher See arbeitet."
        beleg: "(403)"
      - text: "Ein System, das Messdaten auswertet, um die Anwesenheit oder die Zahl von Menschen in Fahrzeugen festzustellen, auch versteckter Menschen, und Hinweise erzeugt, die eine zweite Kontrolle veranlassen; der Filter greift nicht, weil die Hinweise ein Handeln im Einsatz ausloesen, was weder eine eng begrenzte Verfahrensaufgabe noch eine vorbereitende Aufgabe ist."
        beleg: "(403)"
      - text: "Ein System, das Aufnahme- oder Hafteinrichtungen ueberwacht, bestimmte Menschen aufspuert oder verfolgt und das Personal zum Eingreifen alarmiert."
        beleg: "(403)"
    nicht_erfasst:
      - text: "Ein System, das Menschen in Seenot ausschliesslich zur Abstimmung von Suche und Rettung aufspuert, ohne Bezug zur Migrationssteuerung oder zu grenzpolizeilichen Aufgaben; der Zweck ist die Lebensrettung und nicht die Grenzkontrolle."
        beleg: "(403)"
      - text: "Ein System zur Pruefung von Reise- oder Ausweispapieren, etwa auf die Gueltigkeit von Chip und Schluesselverwaltung, auf Bildverschmelzung oder Auffaelligkeiten der Tinte oder auf kopierte Unterschriften; die Pruefung von Reise- oder Ausweispapieren ist von diesem Fall ausgenommen."
        beleg: "(403)"
      - text: "Ein System in einem Schiff oder einem unbemannten Fahrzeug der Grenzbehoerden, das bestimmungsgemaess und technisch darauf beschraenkt ist, Zusammenstoesse zu vermeiden, also Hindernisse einschliesslich Menschen nur zur Vermeidung von Zusammenstoessen aufspuert und keine Hinweise fuer Aufgriff, Verfolgung, Vorsortierung oder eine andere grenzpolizeiliche Reaktion erzeugt."
        beleg: "(403)"
      - text: "Ein System, das Verlaufsdaten auswertet, um Muster von Papierfaelschungen zu bestimmen und daraus allgemeine Anhaltspunkte oder Personalplanungen abzuleiten, ohne Menschen aufzuspueren."
        beleg: "(403)"
      - text: "Ein System, das die Groesse von Menschenmengen oder die Belegung von Durchgaengen einschaetzt, um Spuren auszugleichen und Wartezeiten zu verkuerzen, sofern es so gestaltet ist, dass es Menschen nicht aufspuert, erkennt oder bestimmt und keine personenbezogenen Hinweise erzeugt."
        beleg: "(403)"
      - text: "Nur Funktionen, die Menschen weder aufspueren noch erkennen noch bestimmen und die das Handeln im Einsatz nicht beeinflussen, koennen die Ausnahmen des Filters nutzen."
        beleg: "(403)"
    beispiele:
      - lage: "Ein System ueberwacht Aufnahme- oder Hafteinrichtungen, schaetzt aber nur Auffaelligkeiten der Gesamtlage ein, etwa einen Andrang oder einen ploetzlichen Laermanstieg, ohne Menschen aufzuspueren oder zu verfolgen und ohne personenbezogene Hinweise."
        wertung: "kein_hochrisiko"
        begruendung: "Das System faellt nicht unter diesen Fall."
        beleg: "(403)"
      - lage: "Ein System erkennt Muster von Papierfaelschungen, und diese Muster werden spaeter auf namentlich bekannte Menschen angewandt, um sie vorzusortieren."
        wertung: "hochrisiko"
        begruendung: "Dann fällt das System unter diesen Fall, weil es eine Gefahreneinschaetzung auf Personenebene vornimmt."
        beleg: "(403)"
      - lage: "Ein System stabilisiert, entrauscht oder verbessert Videobilder, ohne Menschen aufzuspueren, zu erkennen oder zu bestimmen und ohne Hinweise fuer ein Handeln im Einsatz zu erzeugen."
        wertung: "kein_hochrisiko"
        begruendung: "Es fällt unter die Ausnahme fuer Systeme mit vorbereitender Aufgabe."
        beleg: "(403)"
  - fundstelle: "KI-VO/anh-III/nr-8-a"
    hauptfrage: "Soll Ihr System ein Gericht oder eine Stelle der aussergerichtlichen Streitbeilegung dabei unterstuetzen, Tatsachen und Recht zu ermitteln und auszulegen oder das Recht auf einen bestimmten Sachverhalt anzuwenden?"
    folgefragen:
      - frage: "Soll Ihr System von einer Justizbehoerde oder in deren Namen eingesetzt werden?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(407)"
      - frage: "Soll Ihr System ein Gericht oder einen Richter unterstuetzen, etwa ein Amtsgericht, ein Landgericht, ein Obergericht, ein oberstes Gericht, ein Verfassungsgericht oder ein besonderes Gericht?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(410)"
      - frage: "Soll Ihr System allein von der Gerichtsverwaltung eingesetzt werden, also von Einrichtungen, die die Justiz verwalten, steuern und unterstuetzen, statt Faelle zu entscheiden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(411)"
      - frage: "Soll Ihr System von einer Stelle eingesetzt werden, die zwar entscheidet, aber einer Justizbehoerde nicht gleichsteht, etwa von einer Datenschutzbehoerde oder einer Wettbewerbsbehoerde, die als Verwaltungsstelle handelt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(411)"
      - frage: "Uebt die Stelle in dem fraglichen Fall richterliche Aufgaben aus und nicht Aufgaben der Verwaltung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(412)"
      - frage: "Hat ein Gericht einen Dritten beauftragt, angewiesen oder bestellt, eine bestimmte Aufgabe nach seinen Weisungen und unter seiner Verantwortung zu erledigen, und setzt dieser Dritte dafuer Ihr System ein?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(414)"
      - frage: "Ist der Sachverstaendige von einer Partei und nicht vom Gericht beauftragt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(415)"
      - frage: "Soll Ihr System von Parteien oder ihren Rechtsvertretern genutzt werden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(416)"
      - frage: "Unterstuetzt Ihr System beim Ermitteln und Auslegen von Tatsachen und Recht? Eines von beidem genuegt."
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(417)"
      - frage: "Unterstuetzt Ihr System beim Anwenden des Rechts auf einen bestimmten Sachverhalt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(417)"
      - frage: "Beschraenkt sich Ihr System auf das blosse Abrufen von Angaben, also auf Ordnen von Dokumenten, Abrufen von Rechtstexten oder Rechtsprechung oder Suche ueber Schlagwoerter?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(421)"
      - frage: "Geht Ihr System darueber hinaus und legt einen Sinn fest, loest eine Unklarheit auf oder zieht rechtliche Schluesse aus den gefundenen Quellen, etwa indem es anhand des Sachverhalts passende Vorentscheidungen vorschlaegt, die wesentlichen rechtlichen Punkte bestimmt und zusammenfasst oder aus mehreren Quellen eine rechtliche Begruendung erschliesst?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(422)"
      - frage: "Ist Ihr System allein fuer reine Nebentaetigkeiten der Verwaltung bestimmt, die die Rechtspflege im Einzelfall nicht beruehren, etwa fuer das Anonymisieren oder Pseudonymisieren von Entscheidungen, Dokumenten oder Daten, fuer die Verstaendigung zwischen Mitarbeitern oder fuer Verwaltungsaufgaben?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(419)"
      - frage: "Soll Ihr System von einer Stelle der aussergerichtlichen Streitbeilegung genutzt werden, also bei einer Streitentscheidung ausserhalb des Gerichts mit Hilfe einer unparteiischen Stelle, etwa Schiedsverfahren, Mediation, Schlichtung, Ombudsstellen oder Beschwerdeausschuesse?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(426)"
      - frage: "Hat das Ergebnis dieses Verfahrens Rechtswirkungen fuer die Parteien?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(430)"
      - frage: "Fuehrt Ihr System Profilbildung durch?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(420)"
    erfasst:
      - text: "Zwei Voraussetzungen muessen zusammen erfuellt sein: das System muss fuer die Nutzung durch eine Justizbehoerde oder in deren Namen bestimmt sein, und sein Zweck muss darin liegen, die Justizbehoerde beim Ermitteln und Auslegen von Tatsachen und Recht und beim Anwenden des Rechts auf einen bestimmten Sachverhalt zu unterstuetzen."
        beleg: "(407)"
      - text: "Eine Justizbehoerde ist nach der Rechtsprechung des Gerichtshofs eine durch Gesetz errichtete, unabhaengige Stelle, die in der Rechtspflege verbindlich entscheiden darf, typischerweise ein Gericht; Notare gehoeren nicht dazu."
        beleg: "(412)"
      - text: "Der Begriff Justizbehoerde ist weiter als Richter und kann auch andere Stellen umfassen, die richterliche Aufgaben ausueben oder Teil des Justizwesens sind."
        beleg: "(409)"
      - text: "Staatsanwaelte fallen im Regelfall unter Nummer 6; ob sie zugleich Justizbehoerde nach Nummer 8 Buchstabe a sind, haengt von ihrer Unabhaengigkeit nach dem geltenden Recht und von dem Zweck ab, zu dem das System bei ihnen eingesetzt werden soll."
        beleg: "(413)"
      - text: "Beauftragt ein Gericht einen Dritten, also bestellt oder weist es ihn an, eine Auswertung von Fallmaterial unter seiner Verantwortung, Weisung oder Uebertragung durchzufuehren, und nutzt dieser Dritte dafuer ein System, gilt das als Nutzung im Namen des Gerichts."
        beleg: "(414)"
      - text: "Gerichtlich bestellte Sachverstaendige, etwa technische Sachverstaendige, Forensiker, Psychologen oder Sozialdienste, koennen im Namen eines Gerichts handeln, wenn sie vom Gericht angeforderte Berichte erstellen, die das Gericht in seiner Entscheidungstaetigkeit unterstuetzen sollen. Entscheidend ist nicht, dass der Bericht im Verfahren verwendet werden kann, sondern dass die Aufgabe im Rahmen des gerichtlichen Auftrags, auf Weisung des Gerichts und unter seiner Verfahrensaufsicht erledigt wird."
        beleg: "(415)"
      - text: "Die beiden Taetigkeiten sind Alternativen: es genuegt, dass das System beim Ermitteln und Auslegen von Tatsachen und Recht oder beim Anwenden des Rechts auf einen bestimmten Sachverhalt unterstuetzt; die Umstaende der Nutzung durch das Gericht sind fuer die Einordnung nicht entscheidend, und das System muss diese Aufgaben nicht selbst erfuellen, sondern nur dabei unterstuetzen."
        beleg: "(418)"
      - text: "Das Anwenden des Rechts auf einen bestimmten Sachverhalt ist weit zu verstehen und umfasst sowohl die Unterstuetzung bei der vollstaendigen rechtlichen Beurteilung eines Falls als auch bei der Beurteilung einzelner Bestandteile."
        beleg: "(423)"
      - text: "Ein System, das die tatsaechlichen Umstaende des Falls und die eingegangenen Schriftsaetze auswertet, das anwendbare Recht und die Rechtsprechung bestimmt und dann Entwuerfe gerichtlicher Entscheidungen oder Teile davon erzeugt, besonders die Begruendung und den Entscheidungssatz."
        beleg: "(423)"
      - text: "Ein System, das Entscheidungsentwuerfe in Bagatellsachen oder Mahnbescheide erzeugt, gestuetzt auf strukturierte Falldaten und rechtliche Vorlagen; wegen der Naehe zur Entscheidung und der Auswirkung auf sie kommt keine Ausnahme des Filters in Betracht."
        beleg: "(423)"
      - text: "Ein System, das Richter bei gleichen oder aehnlichen Faellen unterstuetzt, indem es erstens die wesentlichen Tatsachen aus der Klage herauszieht und nach wiederkehrenden Sachverhaltsmustern gruppiert, zweitens eine Datenbank frueherer Entscheidungen durchsucht, um aehnliche Faelle und Begruendungsmuster zu finden, und drittens Vorschlaege und zugehoerige Textbausteine fuer die Entscheidung erstellt. Das System ist in seiner Gesamtanlage zu beurteilen, deren gemeinsame Ausgaben das Ergebnis der Einzelentscheidung wesentlich beeinflussen koennen, und nicht in einzelnen Bausteinen. Ein System, das allein den ersten Schritt erfuellt, waere eine vorbereitende Aufgabe und kaeme fuer den Filter in Betracht."
        beleg: "(423)"
      - text: "Ein System, das die vorgetragenen Tatsachen des Falls oder ihre Zusammenfassung auswertet, dann Richtern hilft, einschlaegige Gesetze und Vorentscheidungen zu bestimmen, und vorschlaegt, wie diese auf den Sachverhalt anzuwenden sind; wegen seines Einflusses auf die Entscheidung kommt keine Ausnahme des Filters in Betracht."
        beleg: "(423)"
      - text: "Bei aussergerichtlicher Streitbeilegung muessen zwei Voraussetzungen erfuellt sein: das System muss fuer eine Stelle der aussergerichtlichen Streitbeilegung bestimmt sein, deren Verfahrensergebnis Rechtswirkungen fuer die Parteien hat, und sein Zweck muss darin liegen, diese Stelle beim Ermitteln und Auslegen von Tatsachen und Recht und beim Anwenden des Rechts auf einen bestimmten Sachverhalt zu unterstuetzen."
        beleg: "(425)"
      - text: "Zu den Stellen der aussergerichtlichen Streitbeilegung zaehlen unter anderem Schiedsstellen des Handels und Stellen fuer Investitionsstreitigkeiten, Mediationsstellen fuer Zivil- und Handelssachen, Stellen der Streitbeilegung im Arbeitsrecht, Gleichbehandlungsstellen, die in Diskriminierungsfaellen aussergerichtliche Loesungen anbieten, und Berufsaufsichts- oder Disziplinarstellen, etwa im Gesundheitswesen, in den Rechtsberufen oder im Ingenieurwesen."
        beleg: "(429)"
      - text: "Schiedssprueche haben im Regelfall bindende und endgueltige Wirkung fuer die Parteien, aehnlich einem Gerichtsurteil, und sind nach nationalem Recht durchsetzbar; ob ein Verfahren Rechtswirkungen hat, haengt vom nationalen Recht ab und ist im Einzelfall zu pruefen."
        beleg: "(431)"
      - text: "Fuer Rechtswirkungen genuegt es, dass die Bindung fuer eine der Parteien gilt, etwa allein fuer den Unternehmer."
        beleg: "(432)"
      - text: "Hat das Ergebnis des Verfahrens Rechtswirkungen fuer die Parteien, ist ein System hochriskant, dessen Zweck darin liegt, die Stelle beim Ermitteln und Auslegen von Tatsachen und Recht oder beim Anwenden des Rechts auf einen bestimmten Sachverhalt zu unterstuetzen; die Beispiele der Justizbehoerden lassen sich darauf uebertragen."
        beleg: "(434)"
    nicht_erfasst:
      - text: "Nicht erfasst ist die Gerichtsverwaltung, also Einrichtungen oder Stellen, die fuer Verwaltung, Steuerung und Unterstuetzung der Justiz zustaendig sind statt fuer das Entscheiden der Faelle."
        beleg: "(411)"
      - text: "Nicht erfasst sind Stellen mit entscheidungsaehnlichen Aufgaben, die einer Justizbehoerde nicht gleichstehen, etwa Datenschutzbehoerden oder Wettbewerbsbehoerden, die als Verwaltungsstellen handeln; ihre Entscheidungen bleiben gerichtlich nachpruefbar, und in diesem Fall kann Nummer 8 Buchstabe a wieder von Bedeutung sein."
        beleg: "(411)"
      - text: "Uebt eine Stelle Verwaltungsbefugnisse aus, ohne zugleich in einem bestimmten Fall zu entscheiden, uebt sie keine richterliche Aufgabe aus."
        beleg: "(412)"
      - text: "Von einer Partei beauftragte Sachverstaendige handeln nicht im Namen eines Gerichts, weil sie von einer Partei und nicht vom Gericht angewiesen werden."
        beleg: "(415)"
      - text: "Systeme fuer Parteien und ihre Rechtsvertreter fallen nicht unter Nummer 8 Buchstabe a, weil diese nicht im Namen eines Gerichts handeln; daher fallen auch Systeme nicht darunter, mit denen Anwaelte die Einreichung von Verfahrensschriftstuecken erleichtern."
        beleg: "(416)"
      - text: "Die Unterstuetzung fehlt, wenn die Aufgabe keinen hinreichend unmittelbaren Zusammenhang mit der richterlichen Begruendung oder Entscheidung hat; reine Nebentaetigkeiten der Verwaltung, die die Rechtspflege im Einzelfall nicht beruehren, etwa Anonymisieren oder Pseudonymisieren von Entscheidungen, Dokumenten oder Daten, Verstaendigung zwischen Mitarbeitern und Verwaltungsaufgaben, sind nicht erfasst."
        beleg: "(419)"
      - text: "Das blosse Abrufen von Angaben ist nicht erfasst; Systeme, die als erweiterte Suchwerkzeuge dienen, fallen im Allgemeinen nicht unter Nummer 8 Buchstabe a, ebenso Systeme, die nur Dokumente ordnen, Rechtstexte oder Rechtsprechung abrufen oder nach Schlagwoertern suchen, weil sie den Zugang zu Rechtsquellen erleichtern, ohne selbst rechtlich zu begruenden oder auszulegen."
        beleg: "(421)"
      - text: "Ein System zur Umwandlung von Sprache in Text, mit dem ein Gericht Tonaufnahmen von Verhandlungen verschriftlicht, die dann Teil der Akte werden, auch mit selbsttaetiger Sprechertrennung, Zeichensetzung und Anpassung des Fachwortschatzes. Dass Aufnahmen oder Mitschriften spaeter Teil des Beweisstoffs werden und Fehler Grundrechte beruehren koennen, macht das System nicht zu einer Unterstuetzung beim Ermitteln und Auslegen von Tatsachen und Recht. Das gilt auch, wenn ein solches System spaeter als technische Hilfe beim Durchsuchen der Mitschrift dient, etwa fuer die Frage, wann ein Thema besprochen wurde. Anders kann es sein, wenn die Mitschriften von einem System weiterverarbeitet werden, um die wesentlichen Argumente zusammenzufassen oder auszuwaehlen oder um ihre Bedeutung fuer die Entscheidung weiter zu bewerten, auch wenn daraus Empfehlungen an Richter werden."
        beleg: "(423)"
      - text: "Chatbots auf Internetseiten von Gerichten, die Besuchern beim Finden von Auskuenften helfen und ueber Verfahrensschritte, erforderliche Unterlagen, Fristen und moegliche Rechtsbehelfe informieren."
        beleg: "(423)"
      - text: "Ein System, das Justizbehoerden beim Erstellen von Pressemitteilungen oder rechtlichen Zusammenfassungen zu Faellen von oeffentlichem Interesse unterstuetzt und die Fachsprache eines Urteils in verstaendliche Zusammenfassungen uebertraegt; das ist eine Nebentaetigkeit der Verwaltung, die die Rechtspflege im Einzelfall nicht beruehrt."
        beleg: "(423)"
      - text: "Ein System, das Faelle unter Beruecksichtigung von Fachgebiet, Arbeitsbelastung oder Urlaubsplanung auf Richter verteilt; die Beurteilung kann anders ausfallen, wenn das System zugleich rechtliche Beurteilungen zu Verfahrensvoraussetzungen eines bestimmten Falls vornimmt, etwa ob oeffentlich verhandelt wird, ob das Gericht zustaendig ist oder ob ein Einzelrichter oder eine Kammer entscheidet."
        beleg: "(423)"
      - text: "Ein System, das ein Gericht bei der Verwaltung und Durchsuchung grosser Mengen von Beweismaterial unterstuetzt, indem es erstens einen Zeitablauf bestimmter im Beweismaterial belegter Ereignisse bereitstellt und zweitens Inhalte im Beweismaterial durchsucht und Verweise darauf angibt; es unterstuetzt beim Ordnen und Zugaenglichmachen des Tatsachenstoffs, ohne ihn auszuwerten, zu bewerten oder Schluesse daraus zu ziehen."
        beleg: "(423)"
      - text: "Systeme fuer reine Nebentaetigkeiten der Verwaltung, die die Entscheidung einzelner Faelle nicht beruehren, etwa Anonymisieren oder Pseudonymisieren von Entscheidungen, Dokumenten oder Daten, interne Verstaendigung zwischen Mitarbeitern, Suche nach Zustelladressen und Versand von Dokumenten, Pruefung der Zahlung von Gerichtskosten, Bearbeitung elektronischer Unterschriften, Pruefung von Vollmachten und aehnliche Verwaltungsaufgaben."
        beleg: "(423)"
      - text: "Ist das Ergebnis eines Verfahrens der aussergerichtlichen Streitbeilegung eine freiwillige Vereinbarung oder eine unverbindliche Empfehlung, fällt ein dafuer bestimmtes System nicht unter Nummer 8 Buchstabe a, weil das Verfahren keine Rechtswirkungen fuer die Parteien erzeugt."
        beleg: "(430)"
      - text: "Bei Mediation und Schlichtung ist das Ergebnis im Regelfall eine freiwillige Vereinbarung ohne bindende Rechtskraft; die Mediationsrichtlinie erlaubt den Parteien jedoch zu vereinbaren, dass ihre Vereinbarung durch ein Gericht oder eine zustaendige Stelle fuer vollstreckbar erklaert wird und damit dieselbe Wirkung wie ein Urteil erhaelt."
        beleg: "(431)"
    beispiele:
      - lage: "Ein System wertet den Inhalt einer bei Gericht eingegangenen Klage oder eines Antrags sowie Muster frueherer Rechtsprechung aus, um die Fallart vorab einzuordnen, etwa Vertragsrecht oder Erbsache."
        wertung: "kein_hochrisiko"
        begruendung: "Grundsaetzlich kann das als Unterstuetzung beim Ermitteln und Auslegen von Tatsachen und Recht gelten, doch kommen die Ausnahmen fuer eine eng begrenzte Verfahrensaufgabe und fuer eine vorbereitende Aufgabe in Betracht. Gibt das System zusaetzlich Empfehlungen zur Zulaessigkeit des Falls, abgesehen von rein technischen Pruefungen, greifen die Ausnahmen nicht mehr, auch wenn Gerichtsmitarbeiter das spaeter pruefen."
        beleg: "(423)"
      - lage: "Ein System wertet Daten aus, um anhand des Akteninhalts Begleitangaben herauszuziehen, etwa die Verfahrensrollen aus der Klage, also Parteien, Rechtsvertreter, Zeugen und Sachverstaendige, um Bueroarbeiten wie Ladungen zu unterstuetzen."
        wertung: "kein_hochrisiko"
        begruendung: "Im Regelfall gilt das nicht als Unterstuetzung beim Ermitteln und Auslegen von Tatsachen und Recht; selbst wenn einzelne Funktionen dazu fuehren wuerden, greift jedenfalls die Ausnahme fuer eine eng begrenzte Verfahrensaufgabe."
        beleg: "(423)"
      - lage: "Ein System ist in eine oeffentliche Datenbank der nationalen Rechtsprechung eingebunden, die von der Oeffentlichkeit und von Gerichtsmitarbeitern genutzt wird, und erlaubt die Suche nach Entscheidungen mit herkoemmlichen Mitteln, erstellt Zusammenfassungen veroeffentlichter Entscheidungen und von Suchergebnissen und erlaubt die Suche in natuerlicher Sprache."
        wertung: "kein_hochrisiko"
        begruendung: "Das System unterstuetzt zwar beim Ermitteln und Auslegen des Rechts, erfuellt dabei aber nur eng begrenzte Verfahrensaufgaben."
        beleg: "(423)"
      - lage: "Ein System liest Korrektur oder verbessert den Stil von Entscheidungen oder Urteilen, die Richter verfasst haben, ohne den Inhalt zu aendern."
        wertung: "kein_hochrisiko"
        begruendung: "Es ist zweifelhaft, ob darin ueberhaupt eine Unterstuetzung beim Anwenden des Rechts liegt, weil der Grad der Unterstuetzung sehr gering erscheint; jedenfalls greift die Ausnahme fuer Systeme, die das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit verbessern."
        beleg: "(423)"
      - lage: "Ein System wird genutzt, nachdem der Richter die Entscheidung entworfen hat, und vergleicht den Entwurf mit der Fallakte, um Tatsachenfragen oder Punkte zu bestimmen, die der Entwurf offenbar nicht behandelt."
        wertung: "kein_hochrisiko"
        begruendung: "Dabei kann eine Auslegung des Tatsachenstoffs vorkommen; nimmt das System aber nur eine Vollstaendigkeitspruefung vor, bewertet es keine Glaubwuerdigkeit, bestimmt es nicht, was geschehen ist, schlaegt es keine Antwort auf eine Tatsachenfrage vor und beeinflusst es die richterliche Feststellung der Tatsachen nicht wesentlich, so verbessert es das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit."
        beleg: "(423)"
  - fundstelle: "KI-VO/anh-III/nr-8-b"
    hauptfrage: "Soll Ihr System das Ergebnis einer Wahl oder einer Volksabstimmung beeinflussen oder das Wahlverhalten von Menschen bei der Stimmabgabe beeinflussen?"
    folgefragen:
      - frage: "Ist es der Zweck Ihres Systems, auf die Entscheidung der Waehler oder auf die Wahlbeteiligung einzuwirken?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(437)"
      - frage: "Sind Menschen den Ausgaben Ihres Systems unmittelbar ausgesetzt, bekommen sie also selbst zu sehen oder zu hoeren, was das System erzeugt?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(436)"
      - frage: "Dient Ihr System allein dazu, eine politische Kampagne verwaltungsmaessig oder ablauftechnisch zu organisieren, zu verbessern oder zu ordnen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(445)"
      - frage: "Beeinflusst Ihr System das Wahlergebnis nur ungewollt und nebenbei, etwa weil es als allgemeines System zur Inhalteempfehlung unter anderem auch politische Inhalte empfiehlt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(437)"
      - frage: "Soll Ihr System darauf einwirken, wie Menschen ihre Stimme abgeben, also welche Partei oder welchen Bewerber sie unterstuetzen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(440)"
      - frage: "Soll Ihr System darauf einwirken, ob Menschen ueberhaupt an der Wahl oder Abstimmung teilnehmen, einschliesslich der Stimmenthaltung durch Nichtwaehlen oder durch Abgabe eines leeren oder ungueltigen Stimmzettels?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(440)"
      - frage: "Ist Ihr System fuer den Einsatz im Zusammenhang mit einer Wahl oder einer Volksabstimmung auf europaeischer, nationaler, regionaler oder oertlicher Ebene entwickelt?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(442)"
    erfasst:
      - text: "Zwei Voraussetzungen muessen erfuellt sein: der Zweck des Systems muss darin liegen, das Ergebnis einer Wahl oder Volksabstimmung oder das Wahlverhalten von Menschen bei der Stimmabgabe zu beeinflussen, und Menschen muessen den Ausgaben des Systems unmittelbar ausgesetzt sein."
        beleg: "(436)"
      - text: "Das System muss eigens darauf angelegt sein, auf die Entscheidung der Waehlerschaft oder auf die Wahlbeteiligung einzuwirken; es kommt auf diesen Zweck an und nicht darauf, dass das System nebenbei dazu in der Lage waere."
        beleg: "(437)"
      - text: "Erfasst sind sowohl die gemeinsame Beeinflussung, also das Ergebnis der Wahl oder Abstimmung als Ganzes, als auch die Beeinflussung einzelner Waehler."
        beleg: "(438)"
      - text: "Das Beeinflussen des Ergebnisses kann ueber die Stimmabgabe hinausgehen und andere Abschnitte des Wahlvorgangs betreffen, etwa das Neuziehen von Wahlkreisgrenzen."
        beleg: "(439)"
      - text: "Es ist nicht erforderlich, dass das Wahlverhalten tatsaechlich beeinflusst wird; es genuegt, dass das System fuer diesen Zweck bestimmt ist, auch wenn es mit diesem Zweck beworben wird. Das tatsaechliche Ergebnis nach dem Einsatz ist unerheblich."
        beleg: "(441)"
      - text: "Die Einordnung haengt nicht davon ab, wer das System bereitstellt, in Betrieb nimmt oder nutzt; entscheidend ist der vom Anbieter festgelegte Zweck. Alle Anbieter solcher Systeme muessen sie als hochriskant einordnen."
        beleg: "(443)"
      - text: "Als Nutzer kommen vor allem politische Parteien, politische Stiftungen, Kampagnenorganisationen und Bewerber in Betracht, ausserdem Dritte wie Interessengruppen; Medien fallen in vielen Faellen nicht darunter, was aber nicht immer gilt, etwa wenn sie einer Kampagnenorganisation oder Partei verbunden sind oder von einer Partei betrieben werden oder wenn sie Anwendungen zur Wahlempfehlung anbieten."
        beleg: "(444)"
      - text: "Ein System, das die Zielgruppenauswahl und die Ausspielung politischer Werbung innerhalb der Grenzen der Verordnung ueber politische Werbung verbessert, einschliesslich besonderer Systeme zur Inhalteempfehlung; es soll das Wahlergebnis beeinflussen, indem es die politischen Ansichten moeglicher Waehler beeinflusst. In vielen Faellen enthalten solche Systeme Profilbildung, sodass der Filter nicht greift."
        beleg: "(447)"
      - text: "Ein Chatbot oder eine virtuelle Sprecherfigur, die fuer politische Akteure entwickelt wurde, um mit Menschen im Gespraech zu verkehren und den politischen Dialog mit Waehlern nachzubilden, damit diese einen Bewerber oder eine Politik unterstuetzen; der Zweck umfasst das Einwirken auf politische Ansichten und damit am Ende auf die Entscheidung der Waehlerschaft."
        beleg: "(447)"
      - text: "Eine Anwendung zur Wahlempfehlung, die anhand der Ansichten eines einzelnen Waehlers Parteien oder Bewerber empfiehlt, also Fragen zu politischen Vorlieben, Werten oder Streitfragen stellt und die Antworten mit den Standpunkten der Parteien oder Bewerber vergleicht und den naechstliegenden Treffer anzeigt; sie erzeugt persoenliche Empfehlungen, die Vorlieben zu bestimmten Parteien oder Bewerbern lenken und die Wahrnehmung politischer Naehe praegen koennen."
        beleg: "(447)"
    nicht_erfasst:
      - text: "Nicht erfasst sind Systeme, deren Ausgaben Menschen nicht unmittelbar ausgesetzt sind, etwa Werkzeuge, mit denen politische Kampagnen verwaltungsmaessig oder ablauftechnisch organisiert, verbessert oder geordnet werden; das schliesst im Allgemeinen Systeme aus, mit denen Parteien oder Bewerber ihre innere Arbeit wirtschaftlicher machen."
        beleg: "(445)"
      - text: "Systeme mit nicht beabsichtigtem Einfluss auf das Wahlergebnis oder das Wahlverhalten, etwa allgemeine Systeme zur Inhalteempfehlung, die unter anderem auch politische Inhalte empfehlen und damit tatsaechlich politische Meinungen beeinflussen koennen."
        beleg: "(437)"
      - text: "Allgemein verwendbare Systeme mit ausreichenden Vorkehrungen gegen eine Nutzung zur Beeinflussung von Wahlvorgaengen, etwa ein Chatbot, der auf die Frage nach Wahlempfehlungen klar antwortet, dass er keine geben kann, oder der allein sachliche und informierende Inhalte zu Wahlen bietet, also Angaben zum Wahlvorgang nach Art, Zeit und Ort, zur Anmeldung, zum rechtlichen und behoerdlichen Rahmen, sachliche Angaben zu Parteien und Bewerbern wie Verweise auf deren amtliche Internetseiten und allgemeine staatsbuergerliche Bildung zu demokratischen Vorgaengen."
        beleg: "(437)"
      - text: "Systeme, die die Verwaltung von Kampagnenpersonal einschliesslich Freiwilliger verbessern, Systeme, die Veranstaltungen planen, Parteimitglieder dazu einteilen oder Themenschwerpunkte auswaehlen; sie sind durch den zweiten Satz der Nummer 8 Buchstabe b von der Einordnung als hochriskant ausgenommen."
        beleg: "(447)"
      - text: "Systeme, die frueher gefuehrte Spenderdatenbanken einer Partei auswerten, um die Wahrscheinlichkeit von Beitraegen fuer die laufende oder kuenftige Kampagne vorherzusagen; sie sind durch den zweiten Satz der Nummer 8 Buchstabe b ausgenommen."
        beleg: "(447)"
      - text: "Systeme zum Erzeugen von Inhalten politischer Werbung, etwa Systeme, die Wahlsprueche und Mitteilungen entwerfen, die eine Partei prueft und verbreitet, ohne dass das System sie selbst weiterverbreitet; sie helfen bei der Vorbereitung von Kampagnenmaterial und sind nicht darauf gerichtet, das Wahlergebnis zu beeinflussen."
        beleg: "(447)"
      - text: "Systeme, die anhand der Angaben auf dem Internetauftritt eines Parlaments beobachten, wie gewaehlte Mandatstraeger Gesetzesvorlagen oder Aenderungsantraege einbringen; diese Beobachtung dient vor allem der Unterrichtung und hat nicht den unmittelbaren Zweck, das Wahlergebnis zu beeinflussen."
        beleg: "(447)"
      - text: "Systeme von Meinungsforschungsstellen, die Angaben sachlich und offen sammeln, auswerten und darstellen, sofern ihre einzige Aufgabe darin liegt, die Oeffentlichkeit oder Beteiligte zu unterrichten, ohne auf Wahlvorgaenge einwirken zu wollen."
        beleg: "(447)"
      - text: "Systeme, mit denen wissenschaftliche Einrichtungen das Wahlverhalten zu Forschungszwecken nachbilden; sie sind nicht darauf gerichtet, das Wahlergebnis zu beeinflussen, und waeren ohnehin wahrscheinlich nach Artikel 2 Absatz 6 ausgenommen."
        beleg: "(447)"
      - text: "Systeme zum selbsttaetigen Zaehlen von Stimmzetteln; wird ein System allein zum maschinellen Erkennen und Zusammenzaehlen von Stimmzetteln genutzt, etwa durch Einlesen und Texterkennung, ist es eine technische Hilfe und nicht hochriskant, weil sein Zweck nicht dem der Nummer 8 Buchstabe b entspricht."
        beleg: "(447)"
      - text: "Ein Chatbot, der im Namen von Wahlbehoerden Waehler unterrichtet und politisch neutral arbeitet, etwa mit Angaben dazu, wann die Wahl stattfindet, wo gewaehlt werden kann und zu welchen Zeiten."
        beleg: "(447)"
      - text: "Politische Beeinflussung ist eine rechtmaessige Taetigkeit und Teil des Wahlgeschehens, soweit sie geltendem Recht der Union und der Mitgliedstaaten entspricht; die Einordnung als hochriskant will die Entwicklung und Nutzung solcher Systeme nicht einschraenken, sondern sichere und vertrauenswuerdige Entwicklung und Nutzung gewaehrleisten."
        beleg: "(446)"
    beispiele:
      - lage: "Ein System prueft den Ton bereits von Menschen geschriebener Kampagnentexte, hebt moeglicherweise unklare oder nachteilige Formulierungen hervor, zeigt Widersprueche zu bestehenden Parteimaterialien auf oder schlaegt Umformulierungen vor, die die von der Partei betonten Haltungen oder Werte besser vermitteln."
        wertung: "kein_hochrisiko"
        begruendung: "Man koennte darin eine Beeinflussung des Wahlergebnisses durch Einwirken auf die Entscheidung der Waehlerschaft sehen, doch kommt die Ausnahme in Betracht, weil das System lediglich das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit verbessert."
        beleg: "(447)"
