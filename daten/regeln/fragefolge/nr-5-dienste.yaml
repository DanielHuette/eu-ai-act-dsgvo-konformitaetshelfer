bereich: "KI-VO/anh-III/nr-5"
titel: Zugang zu grundlegenden privaten und öffentlichen Diensten
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitt 3.5"
hinweis_belegstellen: "Die amtlichen Absätze sind durchnummeriert und werden so zitiert, etwa (283). Die Beispiellisten im amtlichen Text tragen keine eigene Nummer; sie werden mit der letzten davorstehenden Absatznummer zitiert, etwa (nach 293)."
punkte:
  - fundstelle: "KI-VO/anh-III/nr-5-a"
    hauptfrage: "Soll Ihr System von einer Behörde oder in deren Auftrag eingesetzt werden, um zu prüfen, ob einzelne Menschen Anspruch auf staatliche Unterstützungsleistungen haben, oder um solche Leistungen zu gewähren, zu kürzen, zu entziehen oder zurückzufordern?"
    folgefragen:
      - frage: "Wird Ihr System von einer Behörde selbst oder von einem Dienstleister im Auftrag einer Behörde eingesetzt?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(283)"
      - frage: "Gehört die Stelle, die das System einsetzt, zur staatlichen Verwaltung - oder erfüllt sie Aufgaben im öffentlichen Interesse mit besonderen Befugnissen, die ein gewöhnliches Privatunternehmen nicht hat?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(286)"
      - frage: "Geht es um Leistungen, die Menschen brauchen, um am gesellschaftlichen Leben voll teilzunehmen oder ihren Lebensstandard zu verbessern - etwa Gesundheitsleistungen, Sozialleistungen oder soziale Dienste?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(288)"
      - frage: "Geht es ausschließlich um einen Steuererlass oder eine Steuervergünstigung und nicht um eine Leistung oder einen Dienst als solchen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(289)"
      - frage: "Prüft Ihr System ausschließlich Anträge oder Kostenerstattungen von Firmen und nicht von einzelnen Menschen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Prüft Ihr System, ob ein einzelner Mensch die Leistung bekommen kann - oder in welcher Höhe er sie bekommt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(290)"
      - frage: "Entscheidet oder empfiehlt Ihr System, eine Leistung zu gewähren, abzulehnen, zu kürzen, zu entziehen oder zurückzufordern?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(291)"
      - frage: "Legt Ihr System eine Reihenfolge oder Dringlichkeit fest, wer eine knappe Leistung zuerst oder überhaupt bekommt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Markiert Ihr System Anträge wegen Unstimmigkeiten, Fehlern oder Betrugshinweisen, damit ein Mensch sie genauer prüft?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Beantwortet Ihr System rechtliche Fragen eines Sachbearbeiters, die auf den einzelnen Fall zugeschnitten sind und auf die sich dessen Entscheidung stützt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Bewertet Ihr System die Zahlungsfähigkeit eines Menschen, um damit dessen Anspruch auf eine staatliche Unterstützungsleistung zu prüfen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(296)"
      - frage: "Teilt Ihr System lediglich mit, welche Stelle oder welche Person den Antrag weiter bearbeiten soll, ohne den Anspruch selbst zu bewerten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Benennt Ihr System nur Menschen mit Vorsorgebedarf, ohne deren Anspruch zu prüfen, und wird das Ergebnis auch nicht genutzt, um Zugang zu priorisieren oder auszuschließen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
      - frage: "Schlägt Ihr System nur passende Hilfsangebote vor und füllt Anträge vor, ohne einen Anspruch zu bewerten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 293)"
    erfasst:
      - text: "Einsatz durch eine Behörde oder in ihrem Auftrag, um den Anspruch einzelner Menschen auf grundlegende öffentliche Unterstützungsleistungen und -dienste einschließlich Gesundheitsleistungen zu prüfen."
        beleg: "(283)"
      - text: "Einsatz durch eine Behörde oder in ihrem Auftrag, um solche Leistungen zu gewähren, zu kürzen, zu entziehen oder zurückzufordern."
        beleg: "(283)"
      - text: "Auch die Ablehnung einer Leistung gehört dazu, obwohl sie in Nummer 5 Buchstabe a nicht ausdrücklich genannt ist."
        beleg: "(291)"
      - text: "Behörden sind Stellen der öffentlichen Verwaltung oder Vollziehung auf jeder Ebene, ebenso durch den Staat gegründete juristische Personen des öffentlichen Rechts, ferner Stellen privaten oder öffentlichen Rechts, die Dienste im öffentlichen Interesse erbringen und dafür mit besonderen Befugnissen ausgestattet sind, sowie Einrichtungen und Agenturen der Europäischen Union."
        beleg: "(286)"
      - text: "Grundlegende öffentliche Unterstützungsleistungen sind Leistungen, für die Menschen sich bewerben oder die sie erhalten und die notwendig sind, um voll an der Gesellschaft teilzunehmen oder den Lebensstandard zu verbessern."
        beleg: "(288)"
      - text: "Dazu zählen Gesundheitsleistungen einschließlich Langzeitpflege."
        beleg: "(288)"
      - text: "Dazu zählen Leistungen der sozialen Sicherheit: Krankengeld, Mutterschafts- und entsprechende Vaterschaftsleistungen, Invaliditätsleistungen, Altersleistungen, Leistungen an Hinterbliebene, Leistungen bei Arbeitsunfall und Berufskrankheit, Sterbegeld, Leistungen bei Arbeitslosigkeit, Vorruhestandsleistungen, Familienleistungen, Leistungen bei Pflegebedarf, Mindesteinkommensleistungen, Wohngeld sowie Leistungen für den Zugang zu Wasser, Energie und digitaler Kommunikation."
        beleg: "(288)"
      - text: "Dazu zählen soziale Dienste: Sozialhilfedienste, Arbeits- und Weiterbildungsdienste, Wohnhilfe und Sozialwohnungen, Kinderbetreuung."
        beleg: "(288)"
      - text: "Die Anspruchsprüfung umfasst auch die Höhe der Leistung und kann vor oder nach einer vorläufigen Entscheidung erfolgen."
        beleg: "(290)"
      - text: "Ein System, das ausschließlich den Anspruch prüft, ist auch dann erfasst, wenn es über das Gewähren oder Ablehnen nicht entscheidet."
        beleg: "(292)"
      - text: "Ein System, das ausschließlich gewährt, ablehnt, kürzt, entzieht oder zurückfordert, ist auch dann erfasst, wenn es den Anspruch nicht vorher geprüft hat."
        beleg: "(292)"
      - text: "Auch das Gewähren nach positiver Anspruchsprüfung ist erfasst, und ebenso, wenn die Prüfung falsch war."
        beleg: "(293)"
      - text: "Wird die Zahlungsfähigkeit geprüft, um den Anspruch auf eine öffentliche Unterstützungsleistung zu bewerten, gehört das System zu Nummer 5 Buchstabe a."
        beleg: "(296)"
    nicht_erfasst:
      - text: "Öffentliche Fördermaßnahmen, die selbst keine Leistung oder kein Dienst sind - zum Beispiel ein Steuererlass, auch wenn er Geld bringt."
        beleg: "(289)"
      - text: "Prüfung von Anträgen oder Kostenerstattungen von Firmen, weil keine Anträge einzelner Menschen bewertet werden."
        beleg: "(nach 293)"
      - text: "Reine Zuweisung, welche Stelle oder welcher Mitarbeiter einen Antrag weiter bearbeitet, ohne Bewertung des Anspruchs."
        beleg: "(nach 293)"
      - text: "Benennen von Menschen mit Vorsorgebedarf ohne Anspruchsprüfung, sofern das Ergebnis nicht genutzt wird, um Zugang zu priorisieren, auszuschließen oder sonst zu beeinflussen."
        beleg: "(nach 293)"
      - text: "Zuordnen von Menschen zu passenden öffentlichen Hilfsangeboten mit anonymisierten Daten samt Vorschlag und Vorbefüllen von Anträgen, ohne Anspruchsprüfung."
        beleg: "(nach 293)"
    beispiele:
      - lage: "Ein System entscheidet im Einzelfall über Arbeitslosengeld, prüft wer wie lange und in welcher Höhe Anspruch hat und empfiehlt das dem Sachbearbeiter."
        wertung: "hochrisiko"
        begruendung: "Es prüft den Anspruch und empfiehlt Gewähren oder Ablehnen."
        beleg: "(nach 293)"
      - lage: "Ein System verarbeitet Sozialleistungsanträge, gleicht sie mit externen Datenbanken ab und erzeugt daraus eine Entscheidung über den Anspruch."
        wertung: "hochrisiko"
        begruendung: "Es prüft den Anspruch und erzeugt die Entscheidung darüber."
        beleg: "(nach 293)"
      - lage: "Ein Punktesystem einer Verwaltung sagt aus demografischen, Verhaltens- und Finanzdaten die Wahrscheinlichkeit von Betrug oder dauerhafter Abhängigkeit voraus und wird für Sozialwohnungen oder Arbeitslosengeld genutzt."
        wertung: "hochrisiko"
        begruendung: "Es hilft bei der Anspruchsprüfung und beeinflusst die Entscheidung über den Erhalt wesentlich."
        beleg: "(nach 293)"
      - lage: "Ein System bewertet Bewerbungen um Sozialwohnungen nach Einkommen, Haushaltsgröße, Alter, Erwerbsstatus und Wohnort und bildet daraus Dringlichkeit und Reihenfolge."
        wertung: "hochrisiko"
        begruendung: "Es wirkt sich unmittelbar auf den Zugang zu grundlegenden Wohnleistungen aus."
        beleg: "(nach 293)"
      - lage: "Ein System verteilt begrenzte Stunden häuslicher Pflege unter anspruchsberechtigten Menschen und legt die Reihenfolge fest."
        wertung: "hochrisiko"
        begruendung: "Es beeinflusst den Zugang zu grundlegenden Pflegeleistungen wesentlich."
        beleg: "(nach 293)"
      - lage: "Ein System durchsucht Anträge auf Krankengeld nach Unstimmigkeiten und Betrugshinweisen und markiert einzelne zur Prüfung durch einen Sachbearbeiter."
        wertung: "hochrisiko"
        begruendung: "Die Markierung entscheidet über genauere Prüfung, Verzögerung, Aussetzung oder möglicherweise Ablehnung und wirkt damit auf den Zugang."
        beleg: "(nach 293)"
      - lage: "Ein Chatbot beantwortet rechtliche Fragen eines Sachbearbeiters, zugeschnitten auf den einzelnen Pflegeleistungsfall; der Sachbearbeiter entscheidet weiter selbst."
        wertung: "hochrisiko"
        begruendung: "Die Entscheidung über den Anspruch wird durch die rechtlichen Antworten wesentlich beeinflusst."
        beleg: "(nach 293)"
      - lage: "Ein System bewertet Anträge auf Gesundheitsleistungen vor und bestimmt damit, ob eine externe Stelle sie vertieft prüft; die Weiterleitung spricht ein Sachbearbeiter aus."
        wertung: "hochrisiko"
        begruendung: "Die Vorbewertung ist der entscheidende Schritt für die weitere Prüfung und damit für den Zugang zu Gesundheitsleistungen."
        beleg: "(nach 293)"
      - lage: "Ein System einer Behörde lädt Menschen auf Grundlage von Bevölkerungsgruppen zur Vorsorgeuntersuchung ein, etwa zur Mammographie, und prüft dabei auch den Anspruch darauf."
        wertung: "hochrisiko"
        begruendung: "Es prüft den Anspruch auf eine Gesundheitsleistung, auch wenn das über eine Einladung von sich aus geschieht."
        beleg: "(nach 293)"
      - lage: "Ein System benennt Menschen mit Bedarf an Vorsorge, prüft aber keinen Anspruch, und sein Ergebnis wird nicht zur Priorisierung oder zum Ausschluss genutzt."
        wertung: "kein_hochrisiko"
        begruendung: "Es bestimmt keinen Anspruch der benannten Menschen."
        beleg: "(nach 293)"
      - lage: "Ein System teilt nur mit, welche Stelle einen Antrag auf grundlegende Unterstützungsleistungen weiter bearbeiten soll."
        wertung: "kein_hochrisiko"
        begruendung: "Es empfiehlt nur den Bearbeiter, ohne den Anspruch zu bewerten."
        beleg: "(nach 293)"
      - lage: "Ein System prüft Kostenerstattungsanträge von Firmen, nicht von einzelnen Menschen."
        wertung: "kein_hochrisiko"
        begruendung: "Es bewertet keine Anträge einzelner Menschen."
        beleg: "(nach 293)"
      - lage: "Ein Chatbot beantwortet Sachfragen eines Sachbearbeiters zum Antrag auf Gesundheitsleistungen, etwa das Alter der Person, und gibt vorhandene Angaben nur geordnet wieder; der Sachbearbeiter muss sie prüfen."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, ist aber als enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstaben a und d ausgenommen."
        beleg: "(nach 293)"
      - lage: "Ein System fasst Arztberichte zusammen, die Grundlage der Entscheidung über Gesundheitsleistungen sind; der Sachbearbeiter muss die Berichte selbst durchsehen."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, ist aber als enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstaben a und d ausgenommen."
        beleg: "(nach 293)"
      - lage: "Ein System übersetzt fremdsprachige Anträge auf öffentliche Unterstützungsdienste."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, doch die Übersetzung ist ein unvermeidlicher, aber für die Anspruchsprüfung nicht entscheidender Schritt und nach Artikel 6 Absatz 3 Buchstaben a und d ausgenommen."
        beleg: "(nach 293)"
      - lage: "Ein System wandelt das Gespräch zwischen Sachbearbeiter und Antragsteller in Text um und fasst es zusammen; der Sachbearbeiter ist dabei und kann die Zusammenfassung prüfen."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, doch das Ergebnis ist nur unterstützend und nicht entscheidend und nach Artikel 6 Absatz 3 Buchstaben a und d ausgenommen."
        beleg: "(nach 293)"

  - fundstelle: "KI-VO/anh-III/nr-5-b"
    hauptfrage: "Soll Ihr System bewerten, ob ein einzelner Mensch seine Zahlungen leisten kann und will, oder dafür einen Punktwert bilden?"
    folgefragen:
      # Entscheidend ist nicht, WER bewertet wird, sondern WELCHE Daten
      # verwendet werden. Absatz (73) nimmt den Punktwert fuer den Inhaber
      # eines Kleinbetriebs ausdruecklich aus, wenn das System nur Betriebs-
      # und Firmendaten verwendet - obwohl der Inhaber eine natuerliche
      # Person ist. Ohne diese Frage wurde genau dieser amtliche Fall als
      # hochriskant ausgegeben.
      - frage: "Verwendet Ihr System ausschliesslich Betriebs- und Firmendaten - Bilanzen, Jahresabschluesse, Umsaetze - und nicht die persoenlichen Finanzen eines Menschen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(73)"
      - frage: "Bewertet Ihr System die Fähigkeit und Bereitschaft eines einzelnen Menschen, für Leistungen zu zahlen oder einen Kredit zurückzuzahlen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(296)"
      - frage: "Bildet Ihr System eine Zahl, eine Rangfolge oder ein Etikett, das die Zahlungsfähigkeit eines einzelnen Menschen abbildet?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(297)"
      - frage: "Bewertet Ihr System ausschließlich Firmen und keine einzelnen Menschen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(298)"
      - frage: "Ist die Aufdeckung von Finanzbetrug der Hauptzweck Ihres Systems, der allen anderen Zwecken vorgeht - etwa weil es vor allem Muster und Auffälligkeiten erkennt und nicht die Rückzahlungsfähigkeit beurteilt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(307)"
      - frage: "Dient Ihr System der Bekämpfung von Geldwäsche oder Terrorismusfinanzierung und ist es zugleich funktional verbunden dafür gedacht, die Zahlungsfähigkeit zu bewerten oder einen Punktwert zu bilden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(309)"
      - frage: "Berechnet Ihr System ausschließlich Preise oder Zinssätze, ohne selbst die Zahlungsfähigkeit zu bewerten oder einen Punktwert zu bilden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(300)"
      - frage: "Vereint Ihr System beides in einem durchgehenden Vorgang - die Bewertung der Zahlungsfähigkeit und die Preisbildung für den Kredit?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(300)"
      - frage: "Soll das Ergebnis darüber mitentscheiden, ob ein Mensch an Geldmittel oder an grundlegende Dienste wie Wohnen, Strom oder Telekommunikation kommt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(297)"
      - frage: "Geht es um einen Bankkontozugang, um Zahlungsdienste, um Kredite und Darlehen, um die Erhöhung einer Kreditlinie oder eines Kartenlimits, um eine Hypothek oder um öffentliche Finanzdienste?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(302)"
      - frage: "Geht es ausschließlich um Aktien und Wertpapiere, um Wertpapierkredite, um komplexe Finanzinstrumente, um Premium-Kreditkarten oder um Sonderdarlehen wie Urlaubs- und Reisekredite?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(304)"
      - frage: "Soll Ihr System sowohl für grundlegende als auch für nicht grundlegende private Dienste eingesetzt werden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(305)"
      - frage: "Wird Ihr Punktwert an Dritte weitergegeben, die damit über Kredit, Hypothek, Wohnung, Gesundheitsversorgung oder Telekommunikation entscheiden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Überwacht Ihr System ausschließlich bereits vergebene Kredite für innerbetriebliche Aufsichtszwecke, also um Risiken zu verfolgen und früh Zahlungsschwierigkeiten zu erkennen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Bewertet Ihr System ausschließlich die Sicherheit für einen Kredit, also deren Eigenschaften, Risiken oder Verkäuflichkeit?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Hilft Ihr System den Antragstellern ausschließlich beim Verstehen und Ausfüllen des Kreditantrags, ohne Teil der eigentlichen Bewertung zu sein?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Bearbeitet Ihr System ausschließlich Beschwerden nach einer Entscheidung über Kredit, Lebens- oder Krankenversicherung, ohne dabei selbst die Zahlungsfähigkeit zu bewerten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Teilt Ihr System Kunden nur ein, um zu informieren, Eignung von Produkten zu prüfen oder Werbung zuzuschneiden, ohne an der Bewertung der Zahlungsfähigkeit mitzuwirken?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 309)"
      - frage: "Berechnet Ihr System ausschließlich die Eigenmittelanforderungen der Bank oder des Versicherers nach dem auf internen Beurteilungen beruhenden Ansatz, ohne auch für die Bewertung der Zahlungsfähigkeit oder für Punktwerte einzelner Menschen gedacht zu sein?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(323)"
    erfasst:
      - text: "Systeme, die die Zahlungsfähigkeit einzelner Menschen bewerten, also ihre Fähigkeit und Bereitschaft, vertragliche Zahlungspflichten für erbrachte Leistungen oder einen gewährten Kredit zu erfüllen."
        beleg: "(296)"
      - text: "Systeme, die einen Punktwert bilden, also die Zahlungsfähigkeit eines Menschen abbilden; die Form kann eine Zahl, eine Rangfolge oder ein Etikett sein."
        beleg: "(297)"
      - text: "Einer der beiden Zwecke genügt; das System muss keinen Preis und keinen Zinssatz berechnen."
        beleg: "(299)"
      - text: "Wird ein Punktwert gebildet, um Zugang zu Geldmitteln oder zu grundlegenden Diensten wie Wohnen, Strom und Telekommunikation zu bestimmen, ist das System unabhängig von weiteren Zwecken erfasst; die Prüfung der Anforderungen beschränkt sich dann auf diesen Zweck."
        beleg: "(297)"
      - text: "Grundlegende Finanzdienste sind nur solche, die den folgenden gleich oder ähnlich sind: Bereitstellung eines Bankkontos, Zahlungsdienste einschließlich eines Kredits als Nebenleistung zur Abwicklung wie eine vorübergehende Überziehung, Angebot von Darlehen und Krediten, Angebot der Erhöhung einer Kreditlinie oder eines Kreditkartenlimits, Angebot einer Hypothek sowie öffentliche Finanzdienste."
        beleg: "(302)"
      - text: "Öffentliche Finanzdienste mit Kreditbestandteil gelten ebenfalls als grundlegende private Dienste - etwa geförderte zinsgünstige oder zinsfreie Darlehen für Ersterwerber von Wohneigentum oder für Sanierungen, Darlehen für von Ausschluss bedrohte Gruppen, Studienförderung und soziale Kleinstkredite, Garantien und rückzahlbare Vorschüsse."
        beleg: "(303)"
      - text: "Ist das System für grundlegende und für nicht grundlegende private Dienste gedacht, ist es erfasst; der Anbieter muss gegenüber der Marktaufsicht belegen, dass es ausschließlich für nicht grundlegende Dienste gedacht ist."
        beleg: "(305)"
      - text: "Ein System, das die Bewertung der Zahlungsfähigkeit und die Kreditpreisbildung in einem durchgehenden Vorgang vereint, ist erfasst."
        beleg: "(300)"
      - text: "Der Betreiber des Systems muss nicht derselbe sein wie die Stelle, die den Punktwert für ihre Entscheidung verwendet."
        beleg: "(nach 309)"
      - text: "Ein System zur Bekämpfung von Geldwäsche oder Terrorismusfinanzierung ist erfasst, wenn es funktional verbunden und zugleich für die Bewertung der Zahlungsfähigkeit oder für einen Punktwert gedacht ist."
        beleg: "(309)"
      - text: "Ein System, das zugleich für aufsichtsrechtliche Zwecke zur Berechnung der Eigenmittelanforderungen gedacht ist, bleibt erfasst, denn ausgenommen ist allein die Aufdeckung von Finanzbetrug."
        beleg: "(322)"
      - text: "Für die Einstufung kommt es nicht auf den Hauptzweck an; genügt einer der Zwecke dem Anwendungsfall, ist das System erfasst."
        beleg: "(324)"
    nicht_erfasst:
      - text: "Ausnahme Finanzbetrug: Systeme, die zur Aufdeckung von Finanzbetrug eingesetzt werden, gelten nicht als hochriskant - etwa Werkzeuge, die missbrauchte, gefälschte oder veränderte Ausweispapiere wie Personalausweise und Führerscheine oder gefälschte Einkommens- und Kontonachweise erkennen, oder die auffälliges Verhalten und verdächtige Muster in Kreditanträgen finden."
        beleg: "(306)"
      - text: "Ausnahme Finanzbetrug: Sie greift nur, wenn die Betrugsaufdeckung der Hauptzweck ist und allen anderen Zwecken vorgeht - etwa wenn das System überwiegend Muster und Auffälligkeiten erkennt und nicht die Fähigkeit oder Bereitschaft zur Rückzahlung beurteilt."
        beleg: "(307)"
      - text: "Ausnahme Finanzbetrug: Ist das System für die Betrugsaufdeckung gedacht, fällt es aus dem Anwendungsfall heraus, selbst wenn sein Ergebnis anschließend für die Bewertung der Zahlungsfähigkeit oder für den Punktwert genutzt wird."
        beleg: "(308)"
      - text: "Die Ausnahme gilt nicht für Systeme gegen Geldwäsche und Terrorismusfinanzierung, denn diese Tätigkeiten sind in anderem Unionsrecht geregelt und betreffen keinen Finanzbetrug; solche Systeme sind nur insoweit außerhalb, als ihr vorgesehener Zweck die Bewertung der Zahlungsfähigkeit nicht umfasst."
        beleg: "(309)"
      - text: "Der Anwendungsfall erfasst nur die Bewertung der Zahlungsfähigkeit und den Punktwert einzelner Menschen; der Text stellt ausschließlich auf einzelne Menschen ab."
        beleg: "(298)"
      - text: "Reine Preisbildung ist nicht erfasst, auch wenn sie Daten aus einer Bewertung der Zahlungsfähigkeit oder einem Punktwert verwendet."
        beleg: "(300)"
      - text: "Nicht grundlegende Finanzdienste: Erwerb von Aktien und Wertpapieren, Zugang zum Wertpapierkredit, Zugang zu komplexen Finanzinstrumenten, Premium-Kreditkarten und Sonderdarlehen wie Urlaubs- und Reisekredite."
        beleg: "(304)"
      - text: "Kundeneinteilung und zugeschnittene Werbung, solange die Einteilung nicht Teil der Bewertung der Zahlungsfähigkeit ist."
        beleg: "(nach 309)"
      - text: "Feine Kundensegmentierung zum Verständnis von Kundengruppen sowie Preissimulationen, sofern sie von dem System getrennt sind, das die Zahlungsfähigkeit bewertet."
        beleg: "(nach 309)"
      - text: "Unterstützung der Antragsteller beim Verstehen oder Ausfüllen des Kreditantrags, einschließlich Rückmeldungen dazu, wie Angaben die Genehmigungsaussicht beeinflussen, sofern nicht Teil der Bewertung."
        beleg: "(nach 309)"
      - text: "Bearbeitung von Beschwerden nach einer Entscheidung über Darlehen oder über Kranken- und Lebensversicherung, solange darin keine Bewertung der Zahlungsfähigkeit und kein Punktwert liegt."
        beleg: "(nach 309)"
      - text: "Überwachung bereits vergebener Kredite allein für innerbetriebliche Aufsichtszwecke, also Verfolgen der Kreditentwicklung, Einschätzen des Kreditnehmerrisikos und frühes Erkennen von Zahlungsausfall oder finanzieller Not."
        beleg: "(nach 309)"
      - text: "Bewertung der Sicherheit für einen Kredit, solange sich das System allein auf den Sicherungsgegenstand bezieht, etwa Eigenschaften, Risikofaktoren und Verkäuflichkeit."
        beleg: "(nach 309)"
      - text: "Bewertung der Gewährung oder Erhöhung eines Wertpapierkredits für gehebelte Produkte, sofern allein für diesen nicht grundlegenden privaten Dienst gedacht, obwohl damit Zugang zu Geldmitteln bestimmt wird."
        beleg: "(nach 309)"
      - text: "Ein System, das allein die risikogewichteten Forderungsbeträge von Darlehensbeständen einzelner Menschen nach dem auf internen Beurteilungen beruhenden Ansatz berechnet und nicht auch für Punktwerte oder die Bewertung der Zahlungsfähigkeit gedacht ist."
        beleg: "(323)"
      - text: "Nutzt ein Haus für beide Aufgaben verschiedene Systeme, ist das System für die Eigenmittelberechnung nicht erfasst; erfasst ist dann allein das System für den Punktwert. Dasselbe gilt für interne Modelle von Versicherungsunternehmen."
        beleg: "(325)"
    beispiele:
      - lage: "Ein System bildet aus Zahlungsverhalten und Einkommen eine Kennzahl der Zahlungsfähigkeit und unterstützt damit die Entscheidung über einen Verbraucherkredit oder eine Hypothek."
        wertung: "hochrisiko"
        begruendung: "Verbraucherkredit und Hypothek sind grundlegende private Dienste."
        beleg: "(nach 309)"
      - lage: "Eine Auskunftei betreibt ein System, das Punktwerte bildet und an Dritte weitergibt, die damit über Darlehen, Hypothek oder Zugang zu Wohnung, Gesundheitsversorgung und Telekommunikation entscheiden."
        wertung: "hochrisiko"
        begruendung: "Der Betreiber muss nicht derselbe sein wie die entscheidende Stelle."
        beleg: "(nach 309)"
      - lage: "Ein System erkennt vor allem gefälschte Ausweise, Einkommensnachweise und Kontoauszüge in Kreditanträgen; die Betrugsaufdeckung geht allen anderen Zwecken vor."
        wertung: "kein_hochrisiko"
        begruendung: "Die Ausnahme für die Aufdeckung von Finanzbetrug greift, weil die Betrugsaufdeckung der vorrangige Zweck ist."
        beleg: "(307)"
      - lage: "Ein System zur Betrugsaufdeckung liefert ein Ergebnis, das danach in die Bewertung der Zahlungsfähigkeit oder in den Punktwert einfließt."
        wertung: "kein_hochrisiko"
        begruendung: "Es fällt aus dem Anwendungsfall heraus, obwohl sein Ergebnis weiterverwendet wird."
        beleg: "(308)"
      - lage: "Ein System gegen Geldwäsche und Terrorismusfinanzierung ist funktional verbunden und zugleich dafür gedacht, die Zahlungsfähigkeit zu bewerten."
        wertung: "hochrisiko"
        begruendung: "Die Betrugsausnahme gilt hier nicht, und der Zweck der Bewertung der Zahlungsfähigkeit ist mitumfasst."
        beleg: "(309)"
      - lage: "Ein System berechnet allein Zinssätze und Preise und greift dafür auf Daten aus einer Bewertung der Zahlungsfähigkeit zurück."
        wertung: "kein_hochrisiko"
        begruendung: "Reine Preisbildung gehört nicht zum Anwendungsfall."
        beleg: "(300)"
      - lage: "Ein System bewertet die Zahlungsfähigkeit und bildet im selben durchgehenden Vorgang den Kreditpreis."
        wertung: "hochrisiko"
        begruendung: "Beide Funktionen sind in einem System zusammengeführt."
        beleg: "(300)"
      - lage: "Ein Finanzintermediär bewertet mit einem System, ob bestehenden oder künftigen Kunden ein Wertpapierkredit für gehebelte Produkte gewährt oder erhöht wird, und nur das."
        wertung: "kein_hochrisiko"
        begruendung: "Es ist allein für einen nicht grundlegenden privaten Dienst gedacht."
        beleg: "(nach 309)"
      - lage: "Ein System überwacht nach der Kreditvergabe nur noch die Kreditrisiken des Hauses und erkennt früh Zahlungsschwierigkeiten."
        wertung: "kein_hochrisiko"
        begruendung: "Es dient allein innerbetrieblichen Aufsichtszwecken nach der Vergabe."
        beleg: "(nach 309)"
      - lage: "Ein System einer Bank berechnet nur die risikogewichteten Forderungsbeträge von Darlehensbeständen nach dem auf internen Beurteilungen beruhenden Ansatz und ist nicht für Punktwerte oder die Bewertung der Zahlungsfähigkeit gedacht."
        wertung: "kein_hochrisiko"
        begruendung: "Der Zweck des Anwendungsfalls fehlt."
        beleg: "(323)"
      - lage: "Dasselbe System wird sowohl für den Punktwert einzelner Menschen als auch für interne Beurteilungen und Ausfallschätzungen zur Eigenmittelberechnung genutzt."
        wertung: "hochrisiko"
        begruendung: "Es kommt nicht auf den Hauptzweck an; einer der Zwecke erfüllt den Anwendungsfall."
        beleg: "(324)"

  - fundstelle: "KI-VO/anh-III/nr-5-c"
    hauptfrage: "Soll Ihr System bei einer Lebens- oder Krankenversicherung das Risiko einzelner Menschen bewerten oder deren Beitrag festlegen?"
    folgefragen:
      - frage: "Bewertet Ihr System das Risikoprofil eines einzelnen Menschen, um zu bestimmen, ob Versicherungsschutz angeboten, verweigert, widerrufen oder erbracht wird - einschließlich Festlegung oder Änderung von Vertragsbedingungen wie Deckung, Ausschlüssen, Selbstbehalten und Höchstgrenzen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(312)"
      - frage: "Legt Ihr System die Beiträge fest, also die Methoden und Maßstäbe, nach denen die Prämie als Teil der Vertragsbedingungen bestimmt wird?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(313)"
      - frage: "Geht es um eine Lebensversicherung oder um eine Krankenversicherung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(314)"
      - frage: "Geht es ausschließlich um andere Versicherungen, etwa Kraftfahrzeug- oder Hausratversicherung?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(314)"
      - frage: "Geht es ausschließlich um ein versicherungsbasiertes Anlageprodukt im Sinne von Artikel 4 Absatz 2 der Verordnung (EU) Nr. 1286/2014?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(314)"
      - frage: "Geht es um Unfall einschließlich Arbeitsunfall und Berufskrankheit oder um Krankheit, also um die Klassen nach Anhang I Abschnitt A Nummern 1 und 2 der Richtlinie 2009/138/EG, die üblicherweise Behandlungskosten abdecken?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(316)"
      - frage: "Geht es um eine private Pflegeversicherung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(317)"
      - frage: "Geht es um ein persönliches Altersvorsorgeprodukt, das den Lebensstandard im Alter erheblich beeinflussen kann?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(317)"
      - frage: "Geht es um eine Kreditlebensversicherung, die den Kredit beim Tod des Kreditnehmers ablöst?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(318)"
      - frage: "Wird die Versicherung von einem öffentlich-rechtlichen Träger angeboten und deshalb für nicht erfasst gehalten?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(319)"
      - frage: "Handelt es sich um eine private Krankenversicherung in einem Land mit staatlicher Gesundheitsversorgung für alle, die diese Versorgung nur ergänzt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(320)"
      - frage: "Enthält Ihr System neben der Risikobewertung oder Beitragsfestlegung auch eine Funktion zur Betrugsaufdeckung und soll es deshalb nicht erfasst sein?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(321)"
      - frage: "Ist die Betrugsaufdeckung ein eigenständiges System für sich?"
        bei_ja: "nicht_erfasst"
        bei_nein: "erfasst"
        beleg: "(321)"
      - frage: "Bearbeitet Ihr System ausschließlich Leistungsfälle einer Krankenversicherung nach Eintritt des Versicherungsfalls, prüft also die Berechtigung des Anspruchs nach den Vertragsbedingungen oder die Höhe der Zahlung?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 321)"
      - frage: "Dient Ihr System ausschließlich der Produktgestaltung für Lebensversicherungen, ohne im Einzelfall Risiko zu bewerten oder Beiträge festzulegen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 321)"
    erfasst:
      - text: "Systeme zur Risikobewertung und Systeme zur Beitragsfestlegung in Bezug auf einzelne Menschen bei Kranken- und Lebensversicherung; eines von beiden genügt, und das System muss nicht ausschließlich dafür gedacht sein."
        beleg: "(311)"
      - text: "Risikobewertung bedeutet das Bewerten des Risikoprofils eines Menschen, um zu bestimmen, ob Leistungen der Kranken- und Lebensversicherung angeboten, verweigert, widerrufen oder erbracht werden, insbesondere der vollständige oder teilweise Versicherungsschutz einschließlich der Festlegung oder Änderung von Vertragsbedingungen wie Deckung, Ausschlüssen, Selbstbehalten und Höchstgrenzen."
        beleg: "(312)"
      - text: "Beitragsfestlegung bedeutet die Methoden und Maßstäbe, nach denen die Prämie als fester Teil der Vertragsbedingungen bestimmt wird."
        beleg: "(313)"
      - text: "Erfasst sind alle Schritte, die zum Abschluss oder zur Ablehnung einer Police führen, einschließlich Widerruf und Änderung der Vertragsbedingungen; ein Abschluss muss nicht zustande kommen."
        beleg: "(315)"
      - text: "Lebensversicherung umfasst die Versicherungsklassen nach Anhang II der Richtlinie 2009/138/EG."
        beleg: "(316)"
      - text: "Aus den Nichtlebensversicherungsklassen sind die Klassen nach Anhang I Abschnitt A Nummern 1 und 2 der Richtlinie 2009/138/EG erfasst - Unfall einschließlich Arbeitsunfall und Berufskrankheit sowie Krankheit -, weil sie üblicherweise Behandlungskosten abdecken und damit als Krankenversicherung gelten."
        beleg: "(316)"
      - text: "Private Pflegeversicherung gilt als Krankenversicherung und ist erfasst."
        beleg: "(317)"
      - text: "Persönliche Altersvorsorgeprodukte sind erfasst, soweit sie den Lebensstandard im Alter erheblich beeinflussen können."
        beleg: "(317)"
      - text: "Kreditlebensversicherung ist erfasst, weil sie eine Lebensversicherung ist, unabhängig von ihrer Funktion als Zahlungsausfallschutz; die Risikobewertung kann dort die Form einer Bewertung der Zahlungsfähigkeit oder eines Punktwerts annehmen."
        beleg: "(318)"
      - text: "Die Versicherung kann privat oder öffentlich angeboten werden; auch ein System einer öffentlich-rechtlichen Krankenversicherung ist erfasst, sofern es Risiko bewertet oder Beiträge festlegt."
        beleg: "(319)"
      - text: "Private Krankenversicherung ist ein grundlegender privater Dienst, auch wenn das Land eine staatliche Gesundheitsversorgung für alle hat; sie ergänzt diese dann, etwa um weitere Behandlungen oder privaten Zugang."
        beleg: "(320)"
      - text: "Es gibt hier keine Ausnahme für Betrugsaufdeckung; ein System zur Risikobewertung oder Beitragsfestlegung bleibt erfasst, auch wenn es zusätzlich eine Funktion zur Betrugsaufdeckung hat."
        beleg: "(321)"
      - text: "Ein System, das zugleich für aufsichtsrechtliche Zwecke zur Berechnung der Eigenmittelanforderungen gedacht ist, bleibt erfasst."
        beleg: "(322)"
    nicht_erfasst:
      - text: "Andere Versicherungen als Lebens- und Krankenversicherung, etwa Kraftfahrzeug- oder Hausratversicherung."
        beleg: "(314)"
      - text: "Versicherungsbasierte Anlageprodukte im Sinne von Artikel 4 Absatz 2 der Verordnung (EU) Nr. 1286/2014 gelten nicht als Lebens- oder Krankenversicherung."
        beleg: "(314)"
      - text: "Die Klassen der Nichtlebensversicherung nach Anhang I der Richtlinie 2009/138/EG sind nicht erfasst, ausgenommen die Nummern 1 und 2 des Abschnitts A."
        beleg: "(316)"
      - text: "Eine Funktion zur Betrugsaufdeckung fällt nur dann heraus, wenn sie ein eigenständiges System für sich ist; das System zur Risikobewertung und Beitragsfestlegung bleibt dann erfasst."
        beleg: "(321)"
      - text: "Bearbeitung von Leistungsfällen bei Krankenversicherungsprodukten nach Eintritt des Versicherungsfalls, also Prüfung der Berechtigung nach den Vertragsbedingungen oder Bestimmung der Zahlungshöhe, auch wenn das Ergebnis die Nutzung der Versicherung berührt."
        beleg: "(nach 321)"
      - text: "Systeme in der Leistungsfallbearbeitung, die nur die Güte der Bearbeitung und die Genauigkeit verbessern, etwa durch Abgleich der Angaben des Anspruchstellers mit verschiedenen Datenbanken."
        beleg: "(nach 321)"
      - text: "Produktgestaltung für Lebensversicherungen, sofern nicht für Risikobewertung und Beitragsfestlegung im Einzelfall gedacht; dort wird kein Risikoprofil eines Menschen bewertet."
        beleg: "(nach 321)"
    beispiele:
      - lage: "Ein System eines Versicherers prüft Anträge auf Lebensversicherung, verarbeitet Alter, Gesundheitszustand, Familiengeschichte, Lebensgewohnheiten und Beruf und nutzt Sterbetafeln; daraus folgt, ob der Antrag angenommen wird und zu welchen Bedingungen."
        wertung: "hochrisiko"
        begruendung: "Es handelt sich um eine Risikobewertung."
        beleg: "(nach 321)"
      - lage: "Ein System eines Versicherers schätzt die erwarteten Behandlungskosten einer Risikogruppe, rechnet Verwaltungsaufwand und Gewinnspanne hinzu, und daraus wird der Beitrag der Gruppenmitglieder."
        wertung: "hochrisiko"
        begruendung: "Es legt den Beitrag fest."
        beleg: "(nach 321)"
      - lage: "Ein System bearbeitet Leistungsfälle einer Krankenversicherung, prüft die Berechtigung nach den Vertragsbedingungen und bestimmt die Zahlungshöhe."
        wertung: "kein_hochrisiko"
        begruendung: "Leistungsfallbearbeitung ist von Risikobewertung und Beitragsfestlegung zu unterscheiden."
        beleg: "(nach 321)"
      - lage: "Ein System untersucht große Mengen demografischer, verhaltensbezogener und sozioökonomischer Daten, um Bedarfslücken zu finden und neue Lebensversicherungsprodukte samt Preisrahmen zu gestalten, ohne Einzelfälle zu bewerten."
        wertung: "kein_hochrisiko"
        begruendung: "Es wird kein Risikoprofil eines Menschen bewertet; die Produktgestaltung ist eine frühere und eigene Stufe."
        beleg: "(nach 321)"
      - lage: "Ein System bewertet Risiko und Beitrag einer Krankenversicherung und hat zusätzlich eine Funktion zur Betrugsaufdeckung, die kein eigenes System für sich ist."
        wertung: "hochrisiko"
        begruendung: "Für die Lebens- und Krankenversicherung gibt es keine Ausnahme für Betrugsaufdeckung."
        beleg: "(321)"
      - lage: "Ein System einer öffentlich-rechtlichen Krankenversicherung bewertet das Risiko einzelner Menschen und legt Beiträge fest."
        wertung: "hochrisiko"
        begruendung: "Die Versicherung kann privat oder öffentlich angeboten werden."
        beleg: "(319)"

  - fundstelle: "KI-VO/anh-III/nr-5-d"
    hauptfrage: "Soll Ihr System Notrufe von Menschen bewerten oder einstufen, Rettungskräfte losschicken, die Reihenfolge des Losschickens bestimmen oder Patienten im Notfall vorsortieren?"
    folgefragen:
      - frage: "Bewertet oder stuft Ihr System Notrufe von Menschen ein?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(330)"
      - frage: "Schickt Ihr System Rettungskräfte los, also Polizei, Feuerwehr, medizinische Hilfe oder vergleichbare Dienste?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(330)"
      - frage: "Bestimmt Ihr System die Reihenfolge, in der Rettungskräfte losgeschickt werden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(330)"
      - frage: "Setzt Ihr System Systeme zur Vorsortierung von Notfallpatienten in Gang oder bestimmt deren Reihenfolge?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(330)"
      - frage: "Erreichen Sie die Meldungen auch als Textnachricht oder Video und nicht nur als Anruf, und halten Sie Ihr System deshalb für nicht erfasst?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(332)"
      - frage: "Sagt Ihr System Lagen voraus, in denen Rettungskräfte gebraucht werden, und ist es dabei ausdrücklich dafür gedacht, über Zeitpunkt oder Ort des Losschickens zu entscheiden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(336)"
      - frage: "Sagt Ihr System nur allgemein mögliche Katastrophen voraus, ohne über Zeitpunkt oder Ort des Losschickens zu entscheiden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(336)"
      - frage: "Schreibt Ihr System Notrufe nur mit und hebt Schlüsselwörter hervor, ohne den Anruf zu bewerten oder einzustufen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Dient Ihr System ausschließlich der Ausbildung und dem Üben in nachgestellten Lagen, ohne echte Anrufe zu bewerten und ohne wirklich Kräfte loszuschicken oder zu priorisieren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Erkennt Ihr System ausschließlich Patienten anhand körperlicher Merkmale, um sie vor medizinischen Eingriffen sicher zu identifizieren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Steuert Ihr System ausschließlich den Netzverkehr eingehender Notrufe oder meldet fehlende Verbindung?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Schätzt Ihr System ausschließlich die Heilungsdauer für die Belegung von Zimmern und Betten im Krankenhaus?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Plant Ihr System ausschließlich Arzttermine und hat keinen Bezug zu lebensbedrohlichen Notlagen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(nach 336)"
      - frage: "Ist Ihr System ein Medizinprodukt nach Artikel 2 Absatz 1 der Verordnung (EU) 2017/745 oder Funkanlage nach Artikel 2 Absatz 1 Nummer 1 der Funkanlagenrichtlinie?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(331)"
    erfasst:
      - text: "Systeme, die Notrufe von Menschen bewerten und einstufen."
        beleg: "(330)"
      - text: "Systeme, die Rettungskräfte losschicken."
        beleg: "(330)"
      - text: "Systeme, die die Reihenfolge beim Losschicken von Rettungskräften bestimmen."
        beleg: "(330)"
      - text: "Systeme, die Systeme zur Vorsortierung von Notfallpatienten in Gang setzen."
        beleg: "(330)"
      - text: "Systeme, die die Reihenfolge beim Ingangsetzen von Vorsortierungssystemen für Notfallpatienten bestimmen."
        beleg: "(330)"
      - text: "Ein Notruf ist nicht auf Anrufe beschränkt; gemeint ist die Verbindung zwischen einem Endnutzer und der Notrufabfragestelle mit dem Ziel, Hilfe zu erbitten und zu erhalten, also auch Textnachricht und Video."
        beleg: "(332)"
      - text: "Rettungsdienste sind die von einem Mitgliedstaat anerkannten Dienste, die unmittelbar und schnell helfen, wenn Leben, Gesundheit, Sicherheit, Eigentum oder Umwelt unmittelbar bedroht sind; genannt sind Polizei, Feuerwehr und medizinische Hilfe, dazu können Rettungswagendienste, Leitstellen für Lageinformation etwa zum Katastrophenmanagement und zur Vorhersage sowie Organisationen für Suche, Rettung und Evakuierung zählen."
        beleg: "(333)"
      - text: "Vorsortierungssysteme für Notfallpatienten, die keine Medizinprodukte sind, sind nach Artikel 6 Absatz 2 und Nummer 5 Buchstabe d erfasst."
        beleg: "(335)"
      - text: "Systeme, die Lagen vorhersagen, sind nur erfasst, wenn sie ausdrücklich dafür gedacht sind, über Zeitpunkt oder Ort des Losschickens von Rettungskräften zu entscheiden."
        beleg: "(336)"
      - text: "Ist das System zugleich Medizinprodukt nach Artikel 2 Absatz 1 der Verordnung (EU) 2017/745 oder Funkanlage nach Artikel 2 Absatz 1 Nummer 1 der Funkanlagenrichtlinie, fällt es unter Anhang I und ist nach Artikel 6 Absatz 1 hochriskant, wenn dessen Voraussetzungen erfüllt sind; andernfalls nach Artikel 6 Absatz 2 und Anhang III."
        beleg: "(331)"
    nicht_erfasst:
      - text: "Reines Mitschreiben von Notrufen schlechter Qualität oder von Anrufen panischer Menschen samt Hervorheben von Schlüsselwörtern, weil der Anruf dabei nicht bewertet oder eingestuft wird."
        beleg: "(nach 336)"
      - text: "Allgemeine Vorhersage möglicher Katastrophen ohne Bezug zum Losschicken von Rettungskräften, etwa das Erkennen hochwassergefährdeter Gebiete, das Modellieren der Ausbreitung von Waldbränden, das Auswerten sozialer Netzwerke sowie die Beobachtung von Wetter und Erdbebentätigkeit."
        beleg: "(nach 336)"
      - text: "Übungs- und Ausbildungsplattformen mit nachgestellten Lagen samt automatischer Nachbesprechung, weil sie keine echten eingehenden Anrufe bewerten und keine Kräfte losschicken oder priorisieren."
        beleg: "(nach 336)"
      - text: "Sichere Identifizierung von Patienten vor medizinischen Eingriffen anhand körperlicher Merkmale."
        beleg: "(nach 336)"
      - text: "Steuerung des Netzverkehrs eingehender Notrufe oder Meldung fehlender Verbindung, weil davon nicht selbst der Schaden ausgeht, auch wenn die Verfügbarkeit des Dienstes berührt sein kann."
        beleg: "(nach 336)"
      - text: "Schätzung der Heilungsdauer für die Belegung von Zimmern und Betten im Krankenhaus."
        beleg: "(nach 336)"
      - text: "Planung von Arztterminen, weil kein Bezug zu lebensbedrohlichen Notlagen besteht."
        beleg: "(nach 336)"
    beispiele:
      - lage: "Ein System in einer Notrufzentrale stuft Anrufe an die 112 mit Sprachverarbeitung nach Dringlichkeit ein und lenkt die Einsatzkräfte."
        wertung: "hochrisiko"
        begruendung: "Es bewertet und stuft Anrufe ein, bestimmt die Reihenfolge und schickt die Kräfte los."
        beleg: "(nach 336)"
      - lage: "Ein System wertet Notrufe bei der Polizei aus, zieht Schlüsselwörter heraus, bewertet die Dringlichkeit und bestimmt die Reihenfolge der Einsätze."
        wertung: "hochrisiko"
        begruendung: "Es ist unmittelbar an Bewertung, Reihenfolge und Veranlassung der eingehenden Anrufe beteiligt."
        beleg: "(nach 336)"
      - lage: "Ein System hört während des Gesprächs mit, schreibt mit und vergleicht mit früheren Notrufen, um dem Mitarbeiter Anzeichen lebensbedrohlicher Lagen anzuzeigen."
        wertung: "hochrisiko"
        begruendung: "Es bewertet den Anruf und hilft, ihn nach Schwere einzustufen."
        beleg: "(nach 336)"
      - lage: "Ein System erkennt bei wartenden Anrufen in der Warteschlange Art und Schwere der Notlage und weist den Mitarbeiter auf vorzuziehende Anrufe hin; die Entscheidung bleibt beim Menschen."
        wertung: "hochrisiko"
        begruendung: "Es bewertet und stuft Notrufe in lebensbedrohliche und nicht lebensbedrohliche ein."
        beleg: "(nach 336)"
      - lage: "Ein System in einer Notaufnahme sortiert Patienten nach Vorrang, ohne ärztliche Untersuchung oder Diagnose."
        wertung: "hochrisiko"
        begruendung: "Es bestimmt die Reihenfolge beim Ingangsetzen der Vorsortierung von Notfallpatienten."
        beleg: "(nach 336)"
      - lage: "Ein Chatbot löst in einer medizinischen Einrichtung den Notfalldienst aus, ohne ärztliche Untersuchung oder Diagnose."
        wertung: "hochrisiko"
        begruendung: "Es gehört zu den in Nummer 5 Buchstabe d genannten Zwecken."
        beleg: "(nach 336)"
      - lage: "Ein System sagt Wahrscheinlichkeit und Richtung von Waldbränden voraus und löst zugleich das Losschicken der Kräfte aus oder empfiehlt klar die Verteilung des Personals; der Mensch entscheidet weiter."
        wertung: "hochrisiko"
        begruendung: "Es ist ausdrücklich dafür gedacht, Rettungskräfte auszulösen und über Zeitpunkt und Ort des Losschickens zu entscheiden."
        beleg: "(nach 336)"
      - lage: "Ein Chatbot zur Vorsortierung in der seelischen Krise bewertet über Textkontakt Schwere und Dringlichkeit, ohne ärztliche Untersuchung oder Diagnose."
        wertung: "hochrisiko"
        begruendung: "Es steuert die Reaktion und nimmt eine erste Vorsortierung im Notfall vor."
        beleg: "(nach 336)"
      - lage: "Ein System schreibt Notrufe schlechter Qualität mit und hebt Schlüsselwörter hervor, bewertet und stuft den Anruf aber nicht ein."
        wertung: "kein_hochrisiko"
        begruendung: "Es bewertet und stuft den Anruf nicht ein."
        beleg: "(nach 336)"
      - lage: "Ein System erkennt hochwassergefährdete Gebiete, modelliert die Ausbreitung von Waldbränden und beobachtet Wetter und Erdbebentätigkeit, ohne über Zeitpunkt oder Ort des Losschickens zu entscheiden."
        wertung: "kein_hochrisiko"
        begruendung: "Es fehlt der Bezug zum Losschicken von Rettungskräften."
        beleg: "(nach 336)"
      - lage: "Ein System deutet Wetterrisikodaten vor einer wahrscheinlichen Notlage und liefert Vorarbeit für die Verteilung von Mitteln, etwa vorverlegte Feuerwehrkräfte; Fachleute und der zuständige Einsatzleiter prüfen und bestätigen das."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, ist aber als vorbereitende Aufgabe nach Artikel 6 Absatz 3 Buchstabe d ausgenommen."
        beleg: "(nach 336)"
      - lage: "Ein System gibt den Einsatzkräften ein Lagebild der Unfallstelle, etwa Aufenthaltsort und Körpertemperatur von Verletzten, aus Daten von Helfern, Rettungsrobotern, Drohnen und Sensoren, und gibt vorhandene Angaben nur geordnet wieder."
        wertung: "kein_hochrisiko"
        begruendung: "Der Fall gehört in den Anwendungsfall, ist aber als enge Verfahrens- und vorbereitende Aufgabe nach Artikel 6 Absatz 3 Buchstaben a und d ausgenommen."
        beleg: "(nach 336)"
