beispiele:
  - lage: "Maschinen: ein KI-gestütztes Bildverarbeitungssystem erkennt, dass sich ein Mensch in der Zelle eines Roboters befindet, und löst ein sicheres Anhalten oder eine Geschwindigkeitsreduzierung aus. Der Verwendungszweck ist, Verletzungen zu verhindern."
    wertung: "kommt_in_betracht"
    begruendung: "Der Text führt dieses System unter denjenigen auf, die eine Sicherheitsaufgabe erfüllen sollen und daher Sicherheitsbauteile im Sinne des Artikels 3 Nummer 14 sind. Ob hohes Risiko vorliegt, hängt zusätzlich davon ab, dass für das Produkt eine Bewertung durch eine dritte Stelle verlangt ist."
    beleg: "(45)"
  - lage: "Geräte für explosionsgefährdete Bereiche: ein KI-System soll Gaskonzentrationen überwachen und das Abschalten befehlen."
    wertung: "kommt_in_betracht"
    begruendung: "Der Text führt dieses System unter denjenigen auf, die eine Sicherheitsaufgabe erfüllen sollen und daher Sicherheitsbauteile sind."
    beleg: "(45)"
  - lage: "Druckgeräte: ein KI-System soll einen außer Kontrolle geratenden Druckanstieg vorhersagen und Schutzmaßnahmen auslösen, etwa eine Abschaltung über Sicherheitsausrüstung."
    wertung: "kommt_in_betracht"
    begruendung: "Der Text führt dieses System unter denjenigen auf, die eine Sicherheitsaufgabe erfüllen sollen und daher Sicherheitsbauteile sind."
    beleg: "(45)"
  - lage: "Eisenbahn: ein KI-System im Zug soll Geschwindigkeitsgrenzen überwachen und Zusammenstöße und Entgleisungen verhindern."
    wertung: "kommt_in_betracht"
    begruendung: "Der Text führt dieses System unter denjenigen auf, die eine Sicherheitsaufgabe erfüllen sollen und daher Sicherheitsbauteile sind."
    beleg: "(45)"
  - lage: "Aufzüge: ein KI-System steuert die Schließzeit der Türen und erkennt Hindernisse. Der Anbieter hat als Zweck den wirtschaftlichen Betrieb des Aufzugs festgelegt."
    wertung: "kommt_in_betracht"
    begruendung: "Obwohl der Anbieter keine Sicherheitsaufgabe festgelegt hat, kann ein Fehlverhalten des Systems Verletzungen verursachen und so Gesundheit und Sicherheit von Menschen gefährden. Deshalb ist es Sicherheitsbauteil."
    beleg: "(46)"
  - lage: "Fahrzeuge: ein KI-System hält die Fahrspur. Der Anbieter hat als Zweck ein besseres Nutzungserlebnis festgelegt."
    wertung: "kommt_in_betracht"
    begruendung: "Lenkt das System unerwartet und führt dadurch zu einem Zusammenstoß, kann es Verletzungen verursachen und so Gesundheit und Sicherheit von Menschen und Eigentum gefährden. Deshalb ist es Sicherheitsbauteil."
    beleg: "(46)"
  - lage: "Landwirtschaft: ein KI-System bestimmt die Flächen, auf denen Chemikalien ausgebracht werden. Der Anbieter hat als Zweck einen sparsameren Einsatz der Chemikalien festgelegt."
    wertung: "kommt_in_betracht"
    begruendung: "Berücksichtigt das System die Anwesenheit von Personen in der Nähe nicht ausreichend, kann es deren Gesundheit und Sicherheit gefährden. Deshalb ist es Sicherheitsbauteil."
    beleg: "(46)"
  - lage: "Haushaltsgasgerät: ein KI-System soll die Verbrennung wirtschaftlicher machen, und das Gerät ist so gebaut, dass ein Ausfall oder Fehlverhalten des Systems zur Bildung von Kohlenmonoxid, zu einer Explosion oder zu einem Brand führen kann."
    wertung: "kommt_in_betracht"
    begruendung: "Der Verwendungszweck Energieeffizienz ist keine Sicherheitsaufgabe. Das System ist dennoch Sicherheitsbauteil, weil die Folgen seines Ausfalls Gesundheit und Sicherheit von Menschen und Eigentum gefährden können."
    beleg: "(43)"
  - lage: "Ein KI-System verbessert lediglich die Heizzeiten anhand der Gewohnheiten des Haushalts, um Energie zu sparen. Ein Ausfall führt nur zu Unbehagen oder höheren Energiekosten."
    wertung: "kein_hochrisiko"
    begruendung: "Das System erfüllt weder eine Sicherheitsaufgabe noch das Merkmal, dass Ausfall oder Fehlverhalten Gesundheit und Sicherheit gefährden. Es ist daher kein Sicherheitsbauteil."
    beleg: "(43)"
  - lage: "Spielzeug: ein KI-System empfiehlt Musik in einem vernetzten Spielzeug."
    wertung: "kein_hochrisiko"
    begruendung: "Das System erfüllt keine Sicherheitsaufgabe, und seine Fehlfunktion würde Gesundheit, Sicherheit oder Eigentum nicht gefährden. Es fällt daher nicht unter den Begriff des Sicherheitsbauteils."
    beleg: "(47)"
  - lage: "Landwirtschaft: ein KI-System in einer Drohne oder einem Roboter dient Zwecken des Anbaus, etwa der Ertragsvorhersage oder einer besseren Bewässerung."
    wertung: "kein_hochrisiko"
    begruendung: "Das System erfüllt keine Sicherheitsaufgabe, und seine Fehlfunktion würde Gesundheit, Sicherheit oder Eigentum nicht gefährden. Könnte sein Ausfall oder Fehlverhalten im Zusammenhang des Produkts Gesundheit und Sicherheit von Menschen oder Eigentum gefährden, kann es dennoch Sicherheitsbauteil sein, sofern die übrigen Bedingungen des Artikels 6 Absatz 1 erfüllt sind."
    beleg: "(47)"
  - lage: "Ein smartes Thermostat fällt unter die Funkanlagen-Richtlinie. Sein Verwendungszweck ist, durch Erlernen der Haushaltsabläufe und Anpassen der Temperatur Komfort und Energieeffizienz zu steigern."
    wertung: "kein_hochrisiko"
    begruendung: "Das System soll keine Sicherheitsaufgabe erfüllen, und ein Ausfall oder Fehlverhalten führt nur zu Unbehagen oder höheren Energiekosten, ohne Gesundheit und Sicherheit von Menschen oder Eigentum zu gefährden."
    beleg: "(49)"
  - lage: "Ein smartes Thermostat, bei dem ein Verwendungszweck eine Sicherheitsaufgabe ist, oder bei dem ein Ausfall oder Fehlverhalten über bloßes Unbehagen und höhere Energiekosten hinausgeht und Gesundheit und Sicherheit gefährdet."
    wertung: "kommt_in_betracht"
    begruendung: "In dieser Lage ist das KI-System Sicherheitsbauteil."
    beleg: "(49)"
  - lage: "KI-Systeme in vernetzten Haushaltsgeräten wie Thermostaten, Waschmaschinen, Luftreinigern, Kühlschränken und Fernsehgeräten, deren Zweck Komfort, Bequemlichkeit oder Optimierung ist, etwa von Energieverbrauch, Luftgüte, Helligkeit oder Ton."
    wertung: "kein_hochrisiko"
    begruendung: "Die meisten dieser Systeme fallen nicht unter den Begriff des Sicherheitsbauteils, weil ein Ausfall oder Fehlverhalten Gesundheit und Sicherheit voraussichtlich nicht gefährdet, sondern zu Unannehmlichkeit, Unbehagen, falschen Vorschlägen oder schwächerer Leistung führt."
    beleg: "(48)"
  - lage: "Smarte Türschlösser, Thermostate oder Kindersicherungen in Haushaltsgeräten, je nach Bauart des Produkts und je nach den vernünftigerweise vorhersehbaren Verwendungsbedingungen, besonders wenn Kinder und schutzbedürftige Nutzer betroffen sind."
    wertung: "kommt_in_betracht"
    begruendung: "Die Freistellung der Haushaltsgeräte gilt nur, solange das KI-Erzeugnis keine Sicherheitsaufgabe erfüllt und sein Ausfall oder Fehlverhalten Gesundheit und Sicherheit von Menschen oder Eigentum nicht gefährdet. Bei diesen Geräten kann der Fall anders liegen."
    beleg: "(48)"
  - lage: "Spielzeug mit einem KI-System als Sicherheitsbauteil, für das eine Konformitätsbewertung durch eine dritte Stelle verlangt ist, nach Artikel 26 Absatz 2 und Absatz 3 der Spielzeugverordnung (EU) 2025/2509."
    wertung: "hochrisiko"
    begruendung: "Erwägungsgrund 15 der Spielzeugverordnung bestätigt diese Einstufung ausdrücklich. KI-Systeme, die Sicherheitsbauteile von Spielzeug sind oder selbst solche Produkte, sind nach Artikel 6 Absatz 1 hochriskant."
    beleg: "(59)"
  - lage: "Spielzeug mit einem KI-System als Sicherheitsbauteil, bei dem der Hersteller auf die Bewertung durch eine dritte Stelle verzichten darf, weil er harmonisierte Normen anwendet."
    wertung: "hochrisiko"
    begruendung: "Die Wahl des Bewertungsverfahrens durch den Hersteller soll die Einstufung als hochriskantes KI-System nach Artikel 6 Absatz 1 nicht berühren, auch wenn ein Verzicht auf die Bewertung durch eine dritte Stelle bei Anwendung harmonisierter Normen möglich ist."
    beleg: "(59)"
  - lage: "Ein KI-System ist Sicherheitsbauteil eines Produkts nach Anhang I der Maschinenverordnung oder selbst ein solches Produkt, nach Artikel 25 Absatz 2 und Absatz 3 jener Verordnung."
    wertung: "hochrisiko"
    begruendung: "Der Text stuft diese KI-Systeme ebenso wie die der Spielzeugverordnung nach Artikel 6 Absatz 1 als hochriskant ein."
    beleg: "(59)"
  - lage: "Software, die die Maschinenverordnung (EU) 2023/1230 ausdrücklich in die Begriffsbestimmung der Maschinenprodukte einbezieht und die für eine Konformitätsbewertung durch eine dritte Stelle vorgesehen ist."
    wertung: "hochrisiko"
    begruendung: "Solche Software kann selbst ein geregeltes Produkt nach der Maschinenverordnung sein und ist dann nach Artikel 6 Absatz 1 hochriskant, sofern für sie eine Bewertung durch eine dritte Stelle verlangt ist."
    beleg: "(30)"
  - lage: "Ein KI-System wird nachträglich als Aktualisierung der Software, als Zusatzteil oder als Dienst aus der Ferne geliefert."
    wertung: "kommt_in_betracht"
    begruendung: "Artikel 6 Absatz 1 gilt unabhängig davon, ob das KI-System im Produkt eingebaut ist oder eigenständig verkauft oder in Betrieb genommen wird. Eine solche Lieferung kann hochriskant sein, sofern alle Bedingungen jener Vorschrift erfüllt sind."
    beleg: "(22)"
  - lage: "Ein Verbraucher- oder Haushaltsprodukt fällt unter eine der Produktvorschriften aus Anhang I."
    wertung: "kommt_in_betracht"
    begruendung: "Verbraucherprodukte sind nicht vom Anwendungsbereich des Artikels 6 Absatz 1 ausgenommen. Sind alle Bedingungen erfüllt, können gewerbliche wie Verbraucherprodukte hochriskant sein. Dass ein Produkt für den Haushalt bestimmt ist, nimmt es für sich allein nicht aus."
    beleg: "(21)"
  - lage: "Das Risiko des KI-Systems betrifft allein öffentliche Belange jenseits von Gesundheit, Sicherheit und Grundrechten, etwa die Nutzung von Funkfrequenzen oder die elektromagnetische Verträglichkeit."
    wertung: "kein_hochrisiko"
    begruendung: "Für die Einstufung nach Artikel 6 Absatz 1 ist der Begriff des Sicherheitsbauteils so zu verstehen, dass solche Belange ausgenommen sind."
    beleg: "(25)"
  - lage: "Ein Ausfall oder Fehlverhalten des KI-Systems führt nur zu Schaden am Ansehen, zu rein finanziellem Verlust, zu einer geringen Verschlechterung des Dienstes oder zu einer Unannehmlichkeit ohne Sicherheitsgefahr."
    wertung: "kein_hochrisiko"
    begruendung: "Diese Folgen zählen nicht zur Gefährdung von Gesundheit, Sicherheit und Eigentum."
    beleg: "(40)"
  - lage: "Ein Bestandteil soll ausschließlich Zwecken der Cybersicherheit dienen, im Zusammenhang mit Sicherheitsbauteilen in kritischer Infrastruktur."
    wertung: "kein_hochrisiko"
    begruendung: "Erwägungsgrund 55 der KI-Verordnung nimmt Bestandteile, die ausschließlich für Zwecke der Cybersicherheit verwendet werden sollen, ausdrücklich von den Sicherheitsbauteilen aus, dies aber nur im Zusammenhang mit Sicherheitsbauteilen in kritischer Infrastruktur. Außerhalb dieses Zusammenhangs können KI-Bestandteile für die Cybersicherheit Sicherheitsbauteile sein, wenn ihr Ausfall oder Fehlverhalten Gesundheit und Sicherheit von Menschen oder Eigentum gefährden könnte."
    beleg: "(38)"
  - lage: "Das Produkt fällt nicht unter eine der in Anhang I genannten Rechtsvorschriften."
    wertung: "kein_hochrisiko"
    begruendung: "Artikel 6 Absatz 1 erweitert das Produktrecht nicht auf neue oder weitere Produkte, die diesem Recht nicht schon unterliegen, und die Liste der Rechtsvorschriften in Anhang I ist abschließend."
    beleg: "(26)"
  - lage: "Das KI-System ist zwar Ausfall-kritisch, aber die Gefährdung von Menschen oder Eigentum ist nur theoretisch denkbar und tritt im Zusammenhang des Produkts nicht ein."
    wertung: "kein_hochrisiko"
    begruendung: "Die Wahrscheinlichkeit eines Ausfalls oder Fehlverhaltens darf nicht nur eine theoretische Möglichkeit sein, sondern muss im Zusammenhang des Produkts zu einer Gefährdung von Personen oder Eigentum führen."
    beleg: "(39)"
