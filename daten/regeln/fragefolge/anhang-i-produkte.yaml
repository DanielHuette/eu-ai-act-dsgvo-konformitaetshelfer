# Fragefolge zu Artikel 6 Absatz 1 in Verbindung mit Anhang I der KI-Verordnung.
#
# Quelle ist allein der englische Entwurfstext der Leitlinien der Kommission vom
# 19.05.2026, Abschnitt III. Jede Zeile traegt in „beleg" die Absatznummer, wie
# sie im Text in Klammern steht. Fussnoten sind unter der Absatznummer belegt,
# zu der sie gehoeren. Der Kasten mit den Beispielen fuer Sicherheitsfunktionen
# steht im Text ohne eigene Nummer zwischen Absatz (37) und (38) und ist daher
# unter (37) belegt.
#
# „wertung" in den Beispielen kennt drei Werte:
#   hochrisiko        - der Text stuft die Lage als hochriskant ein
#   kein_hochrisiko   - der Text nimmt die Lage aus
#   kommt_in_betracht - der Text sagt: Sicherheitsbauteil liegt vor oder die
#                       Lage ist nicht ausgeschlossen, die zweite Bedingung
#                       (Bewertung durch eine dritte Stelle) ist damit noch
#                       nicht beantwortet
#
# Anhang I zaehlt Rechtsvorschriften auf, nicht einzelne Produkte (23). Welche
# Nummer eine Vorschrift in Anhang I traegt, steht im Leitlinientext nicht;
# darum ist als Fundstelle nur „KI-VO/anh-I" angegeben und die Gattung ueber
# „kennung" unterscheidbar gemacht.

bereich: "KI-VO/anh-I"
titel: Hohes Risiko über das Produktsicherheitsrecht
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang I"

fragen:
  - kennung: "produkt-faellt-unter-anhang-i"
    frage: "Fällt das Produkt, in dem Ihr KI-System steckt oder stecken soll, unter eine der Produktvorschriften, die Anhang I der KI-Verordnung aufzählt?"
    beleg: "(15)"
    erfasst:
      - text: "Anhang I zählt keine einzelnen Produkte auf, sondern Rechtsvorschriften, die die Sicherheit bestimmter Produkte regeln. Es zählt also, ob Ihr Produkt in den sachlichen Geltungsbereich einer dieser Vorschriften fällt."
        beleg: "(23)"
      - text: "Erfasst sind die Vorschriften des Neuen Rechtsrahmens, das ist Abschnitt A von Anhang I, und die übrigen Vorschriften, das ist Abschnitt B."
        beleg: "(15)"
      - text: "Dass ein Produkt für Verbraucher oder für den Haushalt bestimmt ist, nimmt es für sich allein nicht aus."
        beleg: "(23)"
      - text: "Verbraucherprodukte sind nicht vom Anwendungsbereich ausgenommen. Sind alle Bedingungen erfüllt, können gewerbliche wie Verbraucherprodukte hochriskant sein."
        beleg: "(21)"
      - text: "Artikel 6 Absatz 1 gilt für ein KI-System, das als Sicherheitsbauteil eines solchen Produkts verwendet werden soll, und für ein KI-System, das selbst ein solches Produkt ist."
        beleg: "(15)"
    nicht_erfasst:
      - text: "Produkte, die nicht schon ohne die KI-Verordnung unter eine dieser Vorschriften fallen. Artikel 6 Absatz 1 erweitert das Produktrecht nicht auf neue oder weitere Produkte."
        beleg: "(26)"
      - text: "Die Liste der Rechtsvorschriften in Anhang I ist abschließend. Produkte kommen nur hinzu, wenn der Geltungsbereich einer dort genannten Vorschrift geändert wird oder eine neue Vorschrift in Anhang I aufgenommen wird."
        beleg: "(24)"
      - text: "Die KI-Verordnung bestimmt oder ändert das Risikoprofil eines Produkts nicht. Sie baut auf der Risikoeinstufung des Fachrechts auf."
        beleg: "(26)"

  - kennung: "ki-system-ist-selbst-das-produkt"
    frage: "Wird Ihr KI-System eigenständig verkauft, hat es einen eigenen Verwendungszweck und ist es von einer Vorschrift aus Anhang I unmittelbar geregelt?"
    beleg: "(30)"
    erfasst:
      - text: "Für sich stehende KI-Systeme."
        beleg: "(30)"
      - text: "KI-Systeme, die in andere Produkte eingebaut sind."
        beleg: "(30)"
      - text: "Software, die die Maschinenverordnung (EU) 2023/1230 ausdrücklich in die Begriffsbestimmung der Maschinenprodukte einbezieht. Sie ist dann hochriskant, sofern für sie eine Bewertung durch eine dritte Stelle verlangt ist."
        beleg: "(30)"
      - text: "Artikel 6 Absatz 1 unterscheidet zwei Lagen: Ihr KI-System ist selbst das geregelte Produkt, oder es ist Sicherheitsbauteil eines geregelten Produkts."
        beleg: "(29)"

  - kennung: "getrennte-lieferung"
    frage: "Liefern Sie Ihr KI-System getrennt vom Produkt, etwa als Aktualisierung der Software, als Zusatzteil oder als Dienst aus der Ferne?"
    beleg: "(22)"
    erfasst:
      - text: "Artikel 6 Absatz 1 gilt unabhängig davon, ob das KI-System in das Produkt eingebaut ist oder eigenständig verkauft oder in Betrieb genommen wird. Die Art der Lieferung nimmt Ihr System also nicht aus."
        beleg: "(22)"
      - text: "Eine Aktualisierung der Software, ein Zusatzteil oder ein Dienst aus der Ferne kann hochriskant sein, sofern alle Bedingungen erfüllt sind."
        beleg: "(22)"
      - text: "Ein KI-System bleibt Sicherheitsbauteil, auch wenn Sie es zusätzlich getrennt vom Produkt verkaufen. Es ist dann Teil der Sicherheitsbewertung des Produkts nach der einschlägigen Vorschrift."
        beleg: "(31)"

  - kennung: "teil-eines-geregelten-produkts"
    frage: "Ist Ihr KI-System Teil eines Produkts, das unter eine Vorschrift aus Anhang I fällt, oder soll es Teil eines solchen Produkts werden?"
    beleg: "(31)"
    erfasst:
      - text: "Ein KI-System ist Sicherheitsbauteil, wenn es Teil eines geregelten Produkts ist oder sein soll, selbst wenn es auch getrennt von diesem Produkt verkauft wird."
        beleg: "(31)"
      - text: "Nach der Begriffsbestimmung kann Ihr KI-System auch Bauteil eines anderen KI-Systems sein, nicht nur Bauteil eines Produkts."
        beleg: "(32)"

  - kennung: "sicherheitsbauteil"
    frage: "Erfüllt Ihr KI-System eine Sicherheitsaufgabe für das Produkt, oder gefährdet sein Ausfall oder Fehlverhalten Gesundheit und Sicherheit von Menschen oder Sachen?"
    beleg: "(32)"
    erfasst:
      - text: "Die Begriffsbestimmung in Artikel 3 Nummer 14 der KI-Verordnung lautet: ein Bauteil eines Produkts oder eines KI-Systems, das eine Sicherheitsfunktion für dieses Produkt oder KI-System erfüllt, oder dessen Ausfall oder Fehlfunktion die Gesundheit und Sicherheit von Personen oder Eigentum gefährdet."
        beleg: "(32)"
      - text: "Die Bestimmung legt zwei Fälle fest, die als Alternative zueinander stehen. Einer genügt: entweder das System erfüllt eine Sicherheitsaufgabe, oder sein Ausfall beziehungsweise Fehlverhalten würde Gesundheit und Sicherheit gefährden."
        beleg: "(34)"
      - text: "Die Bestimmung gilt eigenständig für die KI-Verordnung und ist von Begriffsbestimmungen in anderen Produktvorschriften unabhängig. Für die Einstufung zählt allein Artikel 3 Nummer 14 der KI-Verordnung, nicht der Begriff des Sicherheitsbauteils in einer der Vorschriften aus Anhang I."
        beleg: "(33)"
      - text: "Ist Ihr KI-System Sicherheitsbauteil eines geregelten Produkts, wird es als Teil der Sicherheitsbewertung des gesamten Produkts bewertet."
        beleg: "(31)"
    nicht_erfasst:
      - text: "KI-Systeme, die in ein geregeltes Produkt eingebaut sind, aber weder eine Sicherheitsaufgabe erfüllen sollen noch bei Ausfall oder Fehlverhalten Gesundheit, Sicherheit oder Eigentum gefährden, sind keine Sicherheitsbauteile."
        beleg: "(47)"
      - text: "Öffentliche Belange, die über Gesundheit, Sicherheit und Grundrechte hinausgehen, bleiben außer Betracht, etwa Risiken aus der Nutzung von Funkfrequenzen oder aus der elektromagnetischen Verträglichkeit."
        beleg: "(25)"
      - text: "Kein Produkt im Anwendungsbereich des Artikels 6 Absatz 1 ist von sich aus hochriskant."
        beleg: "(48)"

  - kennung: "sicherheitsaufgabe"
    frage: "Haben Sie als Anbieter in der Bedienungsanleitung, in den technischen Unterlagen oder in Werbe- und Verkaufsunterlagen festgelegt, dass Ihr KI-System Gefahren für Gesundheit und Sicherheit von Menschen oder Sachen verhindern oder abmildern soll?"
    beleg: "(35)"
    erfasst:
      - text: "Die Sicherheitsaufgabe muss ein Verwendungszweck des Systems sein, und diesen Zweck legen Sie als Anbieter fest. Er ergibt sich aus der Bedienungsanleitung, den technischen Unterlagen und den Werbe- oder Verkaufsunterlagen."
        beleg: "(35)"
      - text: "Eine Sicherheitsaufgabe liegt vor, wenn der von Ihnen festgelegte Verwendungszweck darin besteht, Gefahren für Gesundheit und Sicherheit von Menschen oder Sachen zu verhindern oder abzumildern."
        beleg: "(37)"
      - text: "Vorbeugen: Überwachen und Erkennen von Lagen, die zu körperlichem Schaden an Menschen oder Sachen führen können, etwa ein KI-System, das untypisches Verhalten einer Anlage erkennt."
        beleg: "(37)"
      - text: "Vorbeugen: Überwachen und Erkennen eines Wartungs- oder Prüfbedarfs, wenn unterbliebene Wartung zu körperlichem Schaden führen kann, etwa ein KI-System, das erkennt, ob sicherheitsrelevante Teile abgenutzt sind und ersetzt oder gewartet werden müssen."
        beleg: "(37)"
      - text: "Vorbeugen: Verhindern körperlichen Schadens an Menschen oder Sachen, etwa ein KI-System, das den Start der Anlage unterbindet, wenn es untypisches Verhalten erkennt."
        beleg: "(37)"
      - text: "Vorbeugen: Überwachen eines anderen Systems, das eine Sicherheitsaufgabe erfüllt, etwa ein KI-System, das über Messfühler den laufenden Betrieb eines Sicherheitsbauteils in Echtzeit überwacht."
        beleg: "(37)"
      - text: "Abmildern: Begrenzen oder Steuern körperlichen Schadens an Menschen oder Sachen, etwa ein KI-System, das das Verhalten einer Anlage überwacht und ihre Funktion entsprechend nachstellt."
        beleg: "(37)"
      - text: "Abmildern: Verringern der Folgen eines möglichen körperlichen Schadens, etwa ein KI-System, das bei gefährlichen Zuständen ein sicheres Anhalten auslöst."
        beleg: "(37)"
      - text: "Abmildern: Steuern eines anderen Systems, das eine Sicherheitsaufgabe erfüllt."
        beleg: "(37)"
      - text: "Diese Prüfung richtet sich nach der Absicht. Sie als Anbieter haben sie in der Hand, und Nachweis sind Bedienungsanleitung, technische Unterlagen und Werbematerial."
        beleg: "(44)"
    nicht_erfasst:
      - text: "Dass ein KI-System in ein sicherheitsrechtlich geregeltes Produkt eingebaut ist oder darin arbeitet, macht daraus für sich allein keine Sicherheitsaufgabe."
        beleg: "(35)"
      - text: "Zwecke, die sich auf Effizienzsteigerung, Leistungssteigerung, Komfort, Bequemlichkeit, das Automatisieren von Nutzerentscheidungen oder Qualitätsverbesserung beschränken, sind keine Sicherheitsaufgabe."
        beleg: "(42)"
      - text: "Verbessern der Produktleistung, etwa Wirkungsgrad oder Anpassung an Nutzervorlieben, wenn ein Ausfall nicht unmittelbar zu Gefahren für Gesundheit oder Sicherheit von Menschen oder Sachen führt."
        beleg: "(37)"
      - text: "Verbessern der Wirtschaftlichkeit eines Dienstes oder der Arbeitsweise eines Produkts, etwa KI-Systeme für die Rechnungsprüfung oder für die Bearbeitung von Kundenansprüchen."
        beleg: "(37)"
      - text: "Qualitätskontrolle von Funktionen oder Diensten ohne Sicherheitsbezug, etwa KI-Systeme zur Überwachung der Dienstgüte."
        beleg: "(37)"
      - text: "Alle übrigen Funktionen eines KI-Systems, die Sie als Anbieter nicht dazu bestimmt haben, Sicherheitsrisiken zu verhindern oder abzumildern. Dazu gehören Leistungsoptimierung, Wirtschaftlichkeit eines Dienstes, Automatisierung, Komfort, Bequemlichkeit und Qualitätskontrolle nicht sicherheitsbezogener Gesichtspunkte."
        beleg: "(37)"
      - text: "Öffentliche Belange jenseits von Gesundheit, Sicherheit und Grundrechten, etwa die Nutzung von Funkfrequenzen oder die elektromagnetische Verträglichkeit."
        beleg: "(25)"

  - kennung: "ausfall-gefaehrdet"
    frage: "Kann ein Ausfall oder ein Fehlverhalten Ihres KI-Systems Gesundheit und Sicherheit von Menschen oder Sachen gefährden?"
    beleg: "(38)"
    erfasst:
      - text: "Diese Prüfung fragt nicht nach Ihrer Absicht, sondern nach den Gefahren des Produkts und danach, wie stark Ihr KI-System auf diese Gefahren einwirkt. Erfasst werden KI-Systeme, die gefährliche Vorgänge steuern oder beeinflussen und bei Ausfall oder Fehlverhalten Risiken schaffen oder verstärken können."
        beleg: "(38)"
      - text: "Als Ausfall oder Fehlverhalten gelten falsche Ausgaben, also auch falsch-negative und falsch-positive Ergebnisse."
        beleg: "(39)"
      - text: "Als Ausfall oder Fehlverhalten gilt der Verlust der Funktion oder der Verfügbarkeit."
        beleg: "(39)"
      - text: "Als Ausfall oder Fehlverhalten gelten unstetes Leistungsverhalten und ein Abdriften der Leistung."
        beleg: "(39)"
      - text: "Als Ausfall oder Fehlverhalten gelten Zeit- und Verzögerungsfehler."
        beleg: "(39)"
      - text: "Als Ausfall oder Fehlverhalten gelten Fehlzuordnungen, die zu gefährlichen Steuerentscheidungen führen."
        beleg: "(39)"
      - text: "Die Ursache kann im Produkt selbst liegen, etwa ein Programmierfehler, oder von außen kommen, etwa ein unvorhergesehenes Format der Eingabedaten."
        beleg: "(39)"
      - text: "Gefährdung bedeutet eine Zunahme der Gefahr. Sie liegt zum Beispiel vor, wenn das KI-System das Produkt in einen unsicheren Zustand bringt oder darin hält, eine Schutzreaktion verhindert oder einen gefährlichen Betrieb ermöglicht, den das Recht verhindern will."
        beleg: "(40)"
      - text: "Gesundheitsschaden umfasst unter anderem Krankheit und Verletzung, die vorübergehende oder dauerhafte Beeinträchtigung einer Körperstruktur oder einer Körperfunktion sowie chronische Erkrankung."
        beleg: "(41)"
      - text: "Gesundheitsschaden umfasst auch Schaden an der seelischen Gesundheit, etwa ein seelisches Trauma, das die Fähigkeit zu gewöhnlichen Aufgaben und Tätigkeiten erheblich beeinträchtigt."
        beleg: "(41)"
      - text: "Sachschaden umfasst unter anderem Verlust oder Beschädigung von Eigentum."
        beleg: "(41)"
      - text: "Erfasst sein können auch KI-Bestandteile, die für Zwecke der Cybersicherheit verwendet werden sollen, wenn ihr Ausfall oder Fehlverhalten Gesundheit und Sicherheit von Menschen oder Sachen gefährden könnte."
        beleg: "(38)"
      - text: "Auch ein KI-System, dessen Zweck sich auf Effizienz, Leistung, Komfort, Bequemlichkeit, Automatisierung oder Qualität beschränkt, kann Sicherheitsbauteil sein, wenn die Folge seines Ausfalls oder Fehlverhaltens für die Sicherheit des Produkts von Bedeutung ist."
        beleg: "(42)"
      - text: "Diese Prüfung richtet sich nach Folgen und Risiko. Sie haben sie weniger in der Hand, denn es zählt das Verhalten des Systems und seine Risikolage. Nachweis sind Aufbau des Systems, Fehlerarten und ihre Wirkungen."
        beleg: "(44)"
    nicht_erfasst:
      - text: "Eine bloß theoretische Möglichkeit des Ausfalls genügt nicht. Der Ausfall oder das Fehlverhalten muss im Zusammenhang des Produkts tatsächlich zu einer Gefährdung von Menschen oder Eigentum führen."
        beleg: "(39)"
      - text: "Schaden am Ansehen zählt nicht als Gefährdung von Gesundheit, Sicherheit und Eigentum."
        beleg: "(40)"
      - text: "Ein rein finanzieller Verlust zählt nicht als Gefährdung von Gesundheit, Sicherheit und Eigentum."
        beleg: "(40)"
      - text: "Eine geringe Verschlechterung des Dienstes zählt nicht als Gefährdung von Gesundheit, Sicherheit und Eigentum."
        beleg: "(40)"
      - text: "Eine Unannehmlichkeit, die keine Sicherheitsgefahr mit sich bringt, zählt nicht als Gefährdung von Gesundheit, Sicherheit und Eigentum."
        beleg: "(40)"
      - text: "Bestandteile, die ausschließlich für Zwecke der Cybersicherheit verwendet werden sollen, nimmt Erwägungsgrund 55 der KI-Verordnung ausdrücklich von den Sicherheitsbauteilen aus, dies aber nur im Zusammenhang mit Sicherheitsbauteilen in kritischer Infrastruktur."
        beleg: "(38)"

  - kennung: "nur-komfort-oder-effizienz"
    frage: "Beschränkt sich der von Ihnen festgelegte Verwendungszweck auf Effizienz, Leistungssteigerung, Komfort, Bequemlichkeit, das Automatisieren von Nutzerentscheidungen oder Qualitätsverbesserung?"
    beleg: "(42)"
    erfasst:
      - text: "Ein solcher Zweck ist keine Sicherheitsaufgabe. Die zweite Prüfung bleibt aber zu machen: Ist die Folge eines Ausfalls oder Fehlverhaltens für die Sicherheit des Produkts von Bedeutung, liegt trotzdem ein Sicherheitsbauteil vor."
        beleg: "(42)"
      - text: "Beispiel: Ein KI-System, das die Verbrennung in einem Haushaltsgasgerät wirtschaftlicher machen soll, hat den Zweck Energieeffizienz und damit keine Sicherheitsaufgabe. Ist das Gerät aber so gebaut, dass ein Ausfall oder Fehlverhalten des KI-Systems zur Bildung von Kohlenmonoxid, zu einer Explosion oder zu einem Brand führen kann, ist das KI-System Sicherheitsbauteil."
        beleg: "(43)"
    nicht_erfasst:
      - text: "Ein KI-System, das lediglich Heizzeiten anhand der Gewohnheiten des Haushalts verbessert, um Energie zu sparen, erfüllt weder eine Sicherheitsaufgabe noch das Merkmal der Gefährdung durch Ausfall, wenn ein Ausfall nur zu Unbehagen oder höheren Energiekosten führt. Es ist dann kein Sicherheitsbauteil."
        beleg: "(43)"

  - kennung: "vernetztes-haushaltsgeraet"
    frage: "Ist Ihr Produkt ein vernetztes Haushaltsgerät, etwa ein Thermostat, eine Waschmaschine, ein Luftreiniger, ein Kühlschrank oder ein Fernsehgerät?"
    beleg: "(48)"
    erfasst:
      - text: "Auch bei einem Haushaltsgerät liegt ein Sicherheitsbauteil vor, wenn das KI-System eine Sicherheitsaufgabe erfüllt oder sein Ausfall oder Fehlverhalten Gesundheit und Sicherheit von Menschen oder Eigentum gefährdet. Der Text nennt dafür smarte Türschlösser, Thermostate und Kindersicherungen in Geräten, abhängig von der Bauart des Produkts und den vernünftigerweise vorhersehbaren Verwendungsbedingungen, besonders dort, wo Kinder und schutzbedürftige Nutzer betroffen sind."
        beleg: "(48)"
      - text: "Ein smartes Thermostat ist Sicherheitsbauteil, wenn ein Verwendungszweck eine Sicherheitsaufgabe ist oder wenn ein Ausfall oder Fehlverhalten über bloßes Unbehagen und höhere Energiekosten hinausgeht und Gesundheit und Sicherheit gefährden kann."
        beleg: "(49)"
    nicht_erfasst:
      - text: "Die meisten KI-Systeme in vernetzten Haushaltsgeräten fallen nicht unter den Begriff des Sicherheitsbauteils, weil ihr Verwendungszweck Komfort, Bequemlichkeit oder Optimierung ist, etwa von Energieverbrauch, Luftgüte, Helligkeit oder Ton, und weil ein Ausfall oder Fehlverhalten Gesundheit und Sicherheit voraussichtlich nicht gefährdet, sondern zu Unannehmlichkeit, Unbehagen, falschen Vorschlägen oder schwächerer Leistung führt."
        beleg: "(48)"
      - text: "Ein smartes Thermostat, das unter die Funkanlagen-Richtlinie fällt, ist kein Sicherheitsbauteil, wenn sein Verwendungszweck darin besteht, durch Erlernen der Haushaltsabläufe und Anpassen der Temperatur Komfort und Energieeffizienz zu steigern, und ein Ausfall oder Fehlverhalten nur zu Unbehagen oder höheren Energiekosten führt."
        beleg: "(49)"
      - text: "Viele KI-Systeme für Verbraucher, etwa in intelligenten Haushaltsgeräten, erfüllen eine oder mehrere der zusammen verlangten Bedingungen des Artikels 6 Absatz 1 nicht und sind deshalb nicht hochriskant."
        beleg: "(21)"

  - kennung: "dritte-stelle-verlangt"
    frage: "Verlangt die Produktvorschrift, die für Ihr Produkt gilt, vor dem Verkauf eine Konformitätsbewertung durch eine dritte Stelle, also die Einschaltung einer unabhängigen, staatlich benannten Prüfstelle, im Recht notifizierte Stelle genannt?"
    beleg: "(50)"
    erfasst:
      - text: "Verlangt sein muss diese Bewertung für das Produkt, dessen Sicherheitsbauteil Ihr KI-System ist, oder für Ihr KI-System selbst, wenn dieses das Produkt ist."
        beleg: "(50)"
      - text: "Hintergrund ist, dass die Produktvorschrift das Erzeugnis als von komplexer Bauart oder mit höherem Risiko der Nichtkonformität ansieht und den Schutz öffentlicher Belange über ein Bewertungsverfahren mit dritter Stelle sichert."
        beleg: "(50)"
      - text: "Konformitätsbewertung ist der Vorgang, mit dem der Hersteller nachweist, dass die für ein Produkt festgelegten Anforderungen erfüllt sind."
        beleg: "(51)"
      - text: "Die KI-Verordnung legt die anwendbaren Bewertungsverfahren nicht selbst fest. Sie stützt sich auf die Wahl der Verfahren, die in den Produktvorschriften aus Anhang I getroffen ist."
        beleg: "(52)"

  - kennung: "wo-steht-das-verfahren"
    frage: "Finden Sie in der Produktvorschrift, die für Ihr Produkt gilt, den Abschnitt über das Konformitätsbewertungsverfahren, das Sie vor dem Verkauf oder der Inbetriebnahme einhalten müssen?"
    beleg: "(51)"
    erfasst:
      - text: "Jede in Anhang I genannte Vorschrift enthält Bestimmungen darüber, welche Bewertungsverfahren der Hersteller einhalten muss, bevor er das Produkt verkauft oder in Betrieb nimmt. Dort ist nachzusehen."
        beleg: "(51)"
      - text: "Der Beschluss 768/2008/EG legt für alle Vorschriften des Neuen Rechtsrahmens in Anhang I einen einheitlichen Aufbau der Verfahren fest: acht Hauptbausteine, im Recht Module genannt, mit den Buchstaben A bis H, dazu Untervarianten und Verbindungen."
        beleg: "(53)"
      - text: "Bei allen Bausteinen außer Baustein A ist eine notifizierte Stelle zu beteiligen."
        beleg: "(54)"
      - text: "Baustein C verlangt selbst keine notifizierte Stelle, wird aber immer mit Bausteinen verbunden, die eine verlangen."
        beleg: "(54)"
      - text: "Bei den Bausteinen A1 und A2 ist eine notifizierte Stelle oder eine zugelassene betriebseigene Stelle zu beteiligen, aber nur in der Fertigung, nicht im Entwurf."
        beleg: "(54)"
      - text: "Baustein B bringt die notifizierte Stelle in den Entwurf und wird immer von einem Baustein für die Fertigung gefolgt, also von C1, C2, D, E oder F. Das ist das Verfahren aus zwei Bausteinen."
        beleg: "(54)"
      - text: "Bei den Bausteinen D1, E1, F1, G, H und H1 ist die notifizierte Stelle in Entwurf und Fertigung beteiligt."
        beleg: "(54)"
      - text: "Die Schwierigkeit des gewählten Bausteins soll dem Risiko des Produkts, seiner Bauartkomplexität und der Art seiner Fertigung angemessen sein."
        beleg: "(54)"
    nicht_erfasst:
      - text: "Baustein A ist die innerbetriebliche Kontrolle ohne dritte Stelle. Er ist für Produkte geringer Komplexität mit einfachem Entwurf und einfacher Fertigung gedacht, die ein geringes Risiko für öffentliche Belange darstellen."
        beleg: "(55)"
      - text: "Für einen Teil der Produkte lassen die Produktvorschriften Baustein A zu, ohne harmonisierte Normen und ohne Beteiligung einer notifizierten Stelle zwingend zu verlangen. Der Text nennt dafür Artikel 3 Absatz 1 Buchstabe a der Funkanlagen-Richtlinie 2014/53/EU für den Gesichtspunkt der Sicherheit."
        beleg: "(56)"

  - kennung: "baustein-a-nur-mit-normen"
    frage: "Dürfen Sie die innerbetriebliche Kontrolle, also Baustein A, nur dann nutzen, wenn Sie die im Amtsblatt veröffentlichten harmonisierten Normen anwenden, die alle einschlägigen Gesundheits- und Sicherheitsanforderungen abdecken?"
    beleg: "(56)"
    erfasst:
      - text: "Diese Bedingung nennt der Text für die Spielzeugverordnung (EU) 2025/2509, für die Maschinenverordnung und für die Funkanlagenverordnung. Dort ist Baustein A für bestimmte Produkte oder bestimmte Gesichtspunkte nur zulässig, wenn der Hersteller die veröffentlichten harmonisierten Normen anwendet."
        beleg: "(56)"
      - text: "Die zwingende Anwendung solcher Normen als Bedingung für Baustein A stellt sicher, dass diese Produkte angemessen geprüft werden und dass man sich nicht allein auf innerbetriebliche Kontrolle verlässt, wo weitere Absicherungen öffentlicher Belange nötig sind."
        beleg: "(56)"
      - text: "Auch die innerbetriebliche Kontrolle mit zwingender Anwendung veröffentlichter harmonisierter Normen gilt als gleichwertiger Mechanismus und erfüllt damit die zweite Bedingung des Artikels 6 Absatz 1."
        beleg: "(58)"
      - text: "Dass eine Produktvorschrift Ihnen erlaubt, sich als eine der Verfahrensmöglichkeiten auf innerbetriebliche Kontrolle auf Grundlage harmonisierter Normen zu stützen, ändert die Einstufung als hochriskant nicht."
        beleg: "(57)"
      - text: "Die Wahl des Bewertungsverfahrens gibt Ihnen Spielraum beim Nachweis der Konformität, aber kein Ermessen darüber, wie Ihr KI-System nach der KI-Verordnung eingestuft wird."
        beleg: "(57)"
      - text: "Für Spielzeug bestätigt das Erwägungsgrund 15 der Spielzeugverordnung ausdrücklich. KI-Systeme, die Sicherheitsbauteile von Spielzeug im Sinne der Artikel 26 Absatz 2 und Absatz 3 jener Verordnung sind oder selbst solche Produkte, sind nach Artikel 6 Absatz 1 hochriskant."
        beleg: "(59)"
      - text: "Ebenso sind KI-Systeme hochriskant, die Sicherheitsbauteile von Produkten nach Anhang I der Maschinenverordnung im Sinne der Artikel 25 Absatz 2 und Absatz 3 jener Verordnung sind oder selbst solche Produkte."
        beleg: "(59)"

  - kennung: "verstaerkte-kontrolle-vor-dem-verkauf"
    frage: "Unterliegt Ihr Produkt nach seiner Produktvorschrift vor dem Verkauf oder der Inbetriebnahme einer verstärkten behördlichen Kontrolle, weil es öffentliche Belange wie Gesundheit, Sicherheit und Umwelt berühren kann?"
    beleg: "(58)"
    erfasst:
      - text: "Das ist der entscheidende Punkt für die zweite Bedingung. Diese verstärkte Kontrolle wird durch das Erfordernis einer Bewertung durch eine dritte Stelle gesichert oder durch gleichwertige Mechanismen, zu denen die innerbetriebliche Kontrolle mit zwingender Anwendung im Amtsblatt veröffentlichter harmonisierter Normen gehört."
        beleg: "(58)"
      - text: "Der Schutz öffentlicher Belange ist der maßgebliche Gesichtspunkt für die Konformitätsbewertung und für die Auswahl der Verfahrensbausteine durch den Unionsgesetzgeber."
        beleg: "(58)"

  - kennung: "beide-bedingungen-zusammen"
    frage: "Haben Sie beides mit Ja beantwortet, also erstens Sicherheitsbauteil eines Produkts aus Anhang I oder selbst ein solches Produkt, und zweitens Bewertung durch eine dritte Stelle verlangt?"
    beleg: "(27)"
    erfasst:
      - text: "Artikel 6 Absatz 1 stellt zwei Bedingungen auf, die zusammen erfüllt sein müssen. Erstens muss das KI-System als Sicherheitsbauteil eines Produkts verwendet werden sollen oder selbst ein Produkt sein, das unter eine Vorschrift aus Anhang I fällt. Zweitens muss für dieses Produkt oder für das KI-System selbst eine Konformitätsbewertung durch eine dritte Stelle verlangt sein."
        beleg: "(27)"
      - text: "Nur KI-Systeme, die erhebliche Risiken für Gesundheit, Sicherheit oder Grundrechte mit sich bringen, sind hochriskant. Artikel 6 Absatz 1 verknüpft die Einstufung mit dem Risiko, mit der Sicherheitsbedeutung des Systems und mit dem Erfordernis der Bewertung durch eine dritte Stelle."
        beleg: "(20)"
      - text: "Ziel ist ein verhältnismäßiger, gezielter und sicherheitsbezogener Einstufungsmechanismus, der nur KI-Systeme erfasst, die die Sicherheit bereits geregelter Produkte betreffen, und unnötige Lasten für KI-Produkte mit geringem Risiko vermeidet."
        beleg: "(19)"
    nicht_erfasst:
      - text: "Nicht alle KI-Systeme, die Bestandteile geregelter Produkte sind oder selbst geregelte Produkte sind, sind hochriskant. Nur die Teilmenge, die die Kriterien des Artikels 6 Absatz 1 erfüllt, ist es, und nur diese unterliegt den Anforderungen für hochriskante Systeme."
        beleg: "(21)"
      - text: "Die KI-Verordnung stuft kein Produkt im Anwendungsbereich des Artikels 6 Absatz 1 selbsttätig als hochriskant ein."
        beleg: "(48)"

