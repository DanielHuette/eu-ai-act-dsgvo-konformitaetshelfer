bereich: "KI-VO/anh-III/nr-3"
titel: Allgemeine und berufliche Bildung
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitt 3.3"
punkte:
  - fundstelle: "KI-VO/anh-III/nr-3-a"
    hauptfrage: "Entscheidet Ihr System mit darueber, wer in eine Bildungs- oder Ausbildungseinrichtung aufgenommen wird oder wer welchem Kurs, welchem Programm oder welchem Lernweg zugeordnet wird?"
    folgefragen:
      - frage: "Wird Ihr System im Rahmen einer Bildungs- oder Berufsbildungseinrichtung eingesetzt, egal welcher Stufe, also auch fruehkindliche Bildung, Grundschule, weiterfuehrende Schule, Hochschule, Berufsausbildung oder Erwachsenenbildung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(210)"
      - frage: "Richtet sich Ihr System hauptsaechlich an die Fortbildung von Lehrkraeften, Ausbildern oder anderem Lehrpersonal und nicht an Lernende?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(214)"
      - frage: "Legt Ihr System fest, ob eine bestimmte Person sich einschreiben, aufgenommen werden oder in einen bestimmten Kurs, ein bestimmtes Programm oder einen bestimmten Lernweg eingeordnet werden kann?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(217)"
      - frage: "Verarbeitet Ihr System persoenliche Daten einer Person, um daraus auf ihre Eigenschaften zu schliessen oder ihren schulischen oder beruflichen Weg einzuschaetzen oder vorherzusagen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(215)"
      - frage: "Beschraenkt sich Ihr System darauf, Bewerbungsunterlagen zu ordnen, zu durchsuchen, zu uebersetzen oder in eine nutzbare Form zu bringen, ohne die Entscheidung spuerbar zu beeinflussen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(219)"
      - frage: "Wertet Ihr System nur im Nachhinein aus, ob bereits getroffene Aufnahmeentscheidungen stimmig waren, ohne die abgeschlossene menschliche Entscheidung zu ersetzen oder zu beeinflussen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(219)"
      - frage: "Sortiert Ihr System eingehende Bewerbungen nur vor, etwa in Gruppen wie Bachelor oder Master, und markiert doppelte Bewerbungen, ohne selbst ueber die Aufnahme zu entscheiden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(219)"
      - frage: "Beschraenkt sich Ihr System darauf, Interessierte zu informieren, damit sie selbst entscheiden, ob sie sich bewerben, ohne den Zugang zu bestimmen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "erfasst"
        beleg: "(219)"
    erfasst:
      - text: "Zugang, Zulassung oder Zuweisung heisst: es wird bestimmt, ob eine Person sich einschreiben, Zutritt erhalten oder in einen bestimmten Kurs, ein bestimmtes Programm oder einen bestimmten Lernweg eingeordnet werden kann."
        beleg: "(217)"
      - text: "Systeme, die Bewerbungen pruefen, um den Zugang bestimmter Personen zu bestimmten Einrichtungen zu bestimmen, die Auswertung der Bewerbungen uebernehmen oder die Aufnahmeentscheidung unterstuetzen, einschliesslich Platzierung und Zuweisung von Lernenden."
        beleg: "(218)"
      - text: "Systeme, die Arbeitsuchende oder Beschaeftigte mit passenden Angeboten der Berufsbildung zusammenbringen; auch sie bestimmen den Zugang zu Einrichtungen und zu Programmen innerhalb dieser Einrichtungen auf allen Stufen."
        beleg: "(218)"
      - text: "Systeme, die Lernende oder Auszubildende bestimmten Programmen oder Kursen innerhalb einer Einrichtung oder eines ihrer Teilbereiche zuweisen."
        beleg: "(219)"
      - text: "Alle Stufen formaler und nicht formaler Bildung sind gemeint, von fruehkindlicher Bildung ueber Grundschule, weiterfuehrende Schule und Hochschule bis zu Berufsbildung und Erwachsenenbildung."
        beleg: "(210)"
      - text: "Oeffentliche und private Einrichtungen sind gleich behandelt, ohne Begrenzung auf Art oder Alter der Lernenden und ohne Begrenzung auf eine Form des Unterrichts, also auch online oder gemischt."
        beleg: "(211)"
      - text: "Einrichtungen der Erwachsenenbildung und der fortlaufenden Weiterbildung zaehlen mit, auch wenn sie nicht zum formalen Schulsystem gehoeren, etwa wenn sie persoenliche Lernangebote machen und am Ende eine Bescheinigung ausstellen."
        beleg: "(212)"
      - text: "Berufliche Bildung ist in mehreren Bildungssystemen der Union Teil der formalen Bildung."
        beleg: "(213)"
      - text: "Verarbeitet das System persoenliche Daten, um persoenliche Eigenschaften einer Person zu bewerten, so ist es immer als hochriskant einzustufen, auch wenn es die Bedingungen der Ausnahmeregel in Artikel 6 Absatz 3 der Verordnung erfuellen wuerde."
        beleg: "(215)"
      - text: "Die eigenen Zustaendigkeiten der Mitgliedstaaten im Bildungsbereich aendern nichts an der Einstufung eines Systems als hochriskant."
        beleg: "(208)"
    nicht_erfasst:
      - text: "Systeme, die im Umfeld einer Bildungseinrichtung eingesetzt werden, sich aber hauptsaechlich an die Fortbildung von Lehrkraeften und Ausbildungspersonal richten, fallen nicht unter Nummer 3; sie koennen aber unter Nummer 4 des Anhangs III fallen, die Beschaeftigung betrifft."
        beleg: "(214)"
      - text: "Systeme, die die Leistung oder den Fortschritt von Lernenden bewerten, fallen nicht unter Buchstabe a, weil diese Bewertung unabhaengig von Aufnahme und Zuweisung geschehen kann; sie koennen unter Buchstabe b fallen."
        beleg: "(218)"
      - text: "Systeme, deren Ergebnis den Zugang nicht bestimmt, sondern Interessierte nur informiert, damit sie ihre eigene Entscheidung treffen koennen."
        beleg: "(219)"
      - text: "Systeme, die nur allgemeine Auskuenfte und Hinweise geben und keine persoenlichen Empfehlungen aussprechen, die eine Aufnahmeentscheidung spuerbar beeinflussen koennten."
        beleg: "(219)"
      - text: "Systeme, die Bewerbungsunterlagen nur ordnen, durchsuchen, Text und Sprache verarbeiten, uebersetzen und die Daten in eine nutzbare Form bringen, fallen unter die Ausnahme fuer vorbereitende Taetigkeiten in Artikel 6 Absatz 3 Buchstabe d."
        beleg: "(219)"
      - text: "Systeme, die bereits getroffene Aufnahmeentscheidungen im Nachhinein pruefen, um Muster und Abweichungen zu erkennen, und die die abgeschlossene menschliche Bewertung nicht ersetzen oder beeinflussen sollen, fallen unter die Ausnahme in Artikel 6 Absatz 3 Buchstabe c."
        beleg: "(219)"
      - text: "Systeme, die eingehende Bewerbungen nur vorsortieren, Angaben aus freien Texten in eine geordnete Form bringen und doppelte Bewerbungen markieren, ohne ueber die Aufnahme zu entscheiden, fallen unter die Ausnahme fuer eng umgrenzte Verfahrensaufgaben in Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(219)"
    beispiele:
      - lage: "Ein System prueft Bewerbungen, Zeugnisse und Testergebnisse und bestimmt daraus, wer an der Einrichtung aufgenommen werden kann."
        wertung: "hochrisiko"
        begruendung: "Das Ergebnis wirkt sich unmittelbar auf das Recht aus, an dieser Einrichtung zu lernen, sich auszubilden oder sich einzuschreiben, weil die Bewertung und die Empfehlung den Ausgang der Aufnahmeentscheidung bestimmen koennen."
        beleg: "(219)"
      - lage: "Eine Stadt oder eine Region weist Kinder automatisch Schulen zu, anhand von Wohnort, Schulbezirk, freien Plaetzen, Geschwisterkindern und Angaben zu den Eltern."
        wertung: "hochrisiko"
        begruendung: "Weil das System dabei persoenliche Daten bewertet, kann die Ausnahmeregel in Artikel 6 Absatz 3 nicht angewandt werden."
        beleg: "(219)"
      - lage: "Eine Arbeitsagentur laesst Vorbildung, Abschluesse und Testergebnisse von Bewerbern auswerten und ordnet die Personen freien Ausbildungsplaetzen zu."
        wertung: "hochrisiko"
        begruendung: "Das System wendet feste Zugangskriterien und Platzgrenzen an und weist dadurch Personen Ausbildungsplaetze zu; weil es dabei persoenliche Daten bewertet, greift die Ausnahmeregel in Artikel 6 Absatz 3 nicht."
        beleg: "(219)"
      - lage: "Ein System entscheidet anhand von Einkommen, Ausgaben und Familiengroesse, ob eine Person ein Stipendium erhalten kann."
        wertung: "hochrisiko"
        begruendung: "Mit der Entscheidung ueber die Geldhilfe wird der Zugang der Person zu einer Bildungseinrichtung bestimmt."
        beleg: "(219)"
      - lage: "Eine Plattform empfiehlt Schuelerinnen und Schuelern anhand ihrer angegebenen Vorlieben und Interessen Studiengaenge und passende Hochschulen."
        wertung: "kein_hochrisiko"
        begruendung: "Das Ergebnis bestimmt den Zugang nicht, sondern unterstuetzt die Lernenden bei ihrer eigenen Entscheidung, ob sie sich bewerben."
        beleg: "(219)"
      - lage: "Ein Auskunftsassistent einer Hochschule beantwortet Fragen zu Zulassungsvoraussetzungen, Bewerbungsablauf und Studienangebot."
        wertung: "kein_hochrisiko"
        begruendung: "Er entscheidet nicht ueber Aufnahmen und gibt keine persoenlichen Empfehlungen, die eine Aufnahmeentscheidung spuerbar beeinflussen koennten."
        beleg: "(219)"
      - lage: "Ein System unterstuetzt die Bearbeitung von Bewerbungen, indem es Unterlagen ordnet, durchsucht, uebersetzt und die Angaben in eine geordnete Form bringt."
        wertung: "kein_hochrisiko"
        begruendung: "Es erleichtert nur das Ordnen und Durchsehen der Unterlagen und hat keinen bedeutsamen Einfluss auf die Entscheidung; es faellt unter die Ausnahme fuer vorbereitende Taetigkeiten in Artikel 6 Absatz 3 Buchstabe d."
        beleg: "(219)"
      - lage: "Ein System prueft im Nachhinein die Entscheidungen eines Zulassungsausschusses, um die Qualitaet des Verfahrens zu kontrollieren."
        wertung: "kein_hochrisiko"
        begruendung: "Es soll Entscheidungsmuster und Abweichungen erkennen und nicht die abgeschlossene menschliche Bewertung ersetzen oder beeinflussen; es faellt unter die Ausnahme in Artikel 6 Absatz 3 Buchstabe c."
        beleg: "(219)"
      - lage: "Ein System sortiert eingehende Bewerbungen vor dem Verfahren, ordnet sie festen Gruppen zu und markiert doppelte Bewerbungen."
        wertung: "kein_hochrisiko"
        begruendung: "Solange es keine Entscheidung ueber Aufnahme oder Zugang trifft, faellt es unter die Ausnahme fuer eng umgrenzte Verfahrensaufgaben der Datenverarbeitung und Ordnung in Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(219)"
  - fundstelle: "KI-VO/anh-III/nr-3-b"
    hauptfrage: "Bewertet Ihr System, was eine Person gelernt hat, und wirkt sich das auf ihre Note, ihr Zeugnis oder ihren Abschluss aus?"
    folgefragen:
      - frage: "Wird Ihr System im Rahmen einer Bildungs- oder Berufsbildungseinrichtung eingesetzt, egal welcher Stufe?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(210)"
      - frage: "Richtet sich Ihr System hauptsaechlich an die Fortbildung von Lehrkraeften, Ausbildern oder anderem Lehrpersonal und nicht an Lernende?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(214)"
      - frage: "Beurteilt Ihr System Wissen, Koennen, Fertigkeiten oder Kompetenzen einer Person und vergleicht das Ergebnis mit einem festgelegten Massstab?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(220)"
      - frage: "Verarbeitet Ihr System persoenliche Daten einer Person, um daraus auf ihre Eigenschaften zu schliessen oder ihren schulischen oder beruflichen Weg einzuschaetzen oder vorherzusagen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(215)"
      - frage: "Prueft Ihr System nur eine von einer Lehrkraft erstellte Pruefung auf Fehler, unklare Formulierungen oder Widersprueche und schlaegt Aenderungen vor, ohne Inhalt, Schwierigkeit oder Lernziel zu veraendern?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(225)"
      - frage: "Rechnet Ihr System nur aus bereits vergebenen Noten und ihren Gewichtungen einen Durchschnitt aus, den dann die Lehrkraft fuer ihre Bewertung nutzt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(225)"
      - frage: "Vergleicht Ihr System nur die Bewertungsmuster von Lehrkraeften ueber die Zeit und meldet Abweichungen, die danach ein Mensch prueft, ohne dass Noten selbsttaetig geaendert werden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(225)"
      - frage: "Begleitet Ihr System nur das laufende Lernen, etwa mit Uebungen, Rueckmeldung, Hinweisen oder angepasster Schwierigkeit, ohne zu einer abschliessenden Note, Bewertung oder Qualifikation zu fuehren?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(224)"
      - frage: "Fuehrt die Nutzung Ihres Systems zu einem Zeugnis, einer Bescheinigung oder einer anderen Anerkennung, die von den zustaendigen staatlichen Stellen anerkannt wird?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(225)"
      - frage: "Nutzen Lernende Ihr System aus eigenem Antrieb fuer Lernen ausserhalb des Unterrichts, ohne dass die Einrichtung, an der sie eingeschrieben sind, das verlangt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(225)"
      - frage: "Fliesst das Ergebnis Ihres Systems in eine Note, eine Bewertung, ein Zeugnis oder einen Abschluss ein, oder in eine Zwischennote, die bei der Endnote oder beim Bestehen mitzaehlt?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(223)"
    erfasst:
      - text: "Lernergebnisse bewerten heisst: Wissen, Koennen, Angaben, Werte, Fertigkeiten und Kompetenzen beurteilen, die in formalen und in nicht formalen Bildungs- und Berufsbildungszusammenhaengen erworben wurden, und sie mit den geltenden Massstaeben vergleichen."
        beleg: "(220)"
      - text: "Das Ergebnis ist eine Einschaetzung der Leistung gegen vorab festgelegte Lernziele, Standards, Lehrplanziele oder Kompetenzrahmen und kann fuer Noten, Zeugnisse, Qualifikationen, das Erkennen von Luecken oder das selbsttaetige Steuern des weiteren Lernwegs genutzt werden."
        beleg: "(221)"
      - text: "Erfasst ist nur die abschliessende Bewertung, die auf eine Entscheidung ueber den Bildungs- und Berufsweg hinwirkt; dazu zaehlen Systeme, die die Endnote bestimmen, und solche, die Zwischennoten bestimmen, die in die Endbewertung oder in den Leistungsstand einfliessen."
        beleg: "(223)"
      - text: "Eine abschliessende Bewertung ist eine Bewertung, die zu einer Note, einer Beurteilung oder einer Qualifikation fuehrt oder am Ende eines Unterrichtsabschnitts steht, etwa eines Kurses, eines Programms, eines Halbjahres oder eines Schuljahres, und daher den Bildungsweg deutlich beeinflussen kann."
        beleg: "(222)"
      - text: "Systeme, die Lernende aus eigenem Antrieb nutzen, sind dann hochriskant, wenn sie zu einem Zeugnis, einer Bescheinigung oder einer von den zustaendigen staatlichen Stellen anerkannten Form der Anerkennung fuehren, sofern keine Ausnahme nach Artikel 6 Absatz 3 greift."
        beleg: "(225)"
      - text: "Verarbeitet das System persoenliche Daten, um persoenliche Eigenschaften einer Person zu bewerten, so ist es immer als hochriskant einzustufen, auch wenn es die Bedingungen der Ausnahmeregel in Artikel 6 Absatz 3 erfuellen wuerde."
        beleg: "(215)"
    nicht_erfasst:
      - text: "Die begleitende Bewertung ist nicht erfasst: sie laeuft fortlaufend mit, soll die Leistung verbessern und fuehrt nicht zu einer abschliessenden Note, Bewertung oder Qualifikation; sie arbeitet mit Uebungen, Rueckmeldung und Hinweisen."
        beleg: "(222)"
      - text: "Systeme, die im laufenden Unterricht nur Rueckmeldung und Lernunterstuetzung geben, sind nicht hochriskant; dazu zaehlen Systeme, die die Schwierigkeit der Materialien an die Leistung anpassen, Systeme, die persoenliche Rueckmeldung und Anleitung geben, und Systeme, die Beteiligung und Fortschritt verfolgen und Lehrkraeften Hinweise geben."
        beleg: "(224)"
      - text: "Systeme, die Lernende aus eigenem Antrieb fuer nicht formales und beilaeufiges Lernen nutzen, ohne dass ihre Einrichtung das verlangt, sind nicht hochriskant."
        beleg: "(225)"
      - text: "Systeme, die hauptsaechlich der Fortbildung von Lehrkraeften und Ausbildungspersonal dienen, fallen nicht unter Nummer 3; sie koennen unter Nummer 4 des Anhangs III fallen, die Beschaeftigung betrifft."
        beleg: "(214)"
      - text: "Systeme, die eine von einer Lehrkraft erstellte Pruefung nur auf Fehler und unklare Stellen pruefen und Verbesserungen vorschlagen, ohne Inhalt, Schwierigkeit oder Lernziel zu aendern, fallen unter die Ausnahme fuer Systeme, die das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit verbessern, Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(225)"
      - text: "Systeme, die aus vergebenen Noten und deren Gewichtungen nur den Durchschnitt errechnen, fallen unter die Ausnahme fuer eng umgrenzte Verfahrensaufgaben in Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(225)"
      - text: "Systeme, die Bewertungsmuster von Lehrkraeften beobachten und Abweichungen melden, die danach ein Mensch prueft, fallen unter die Ausnahme fuer das Erkennen von Entscheidungsmustern und Abweichungen in Artikel 6 Absatz 3 Buchstabe c, weil sie eine abgeschlossene menschliche Bewertung nicht ersetzen oder beeinflussen sollen."
        beleg: "(225)"
    beispiele:
      - lage: "Ein System bewertet Arbeiten, Tests, Kurztests und Pruefungen der Lernenden, die in die Endbewertung einfliessen, und schlaegt Noten vor."
        wertung: "hochrisiko"
        begruendung: "Es wirkt auf die abschliessende Bewertung der Lernenden ein, indem es die Ergebnisse auswertet und Noten vorschlaegt."
        beleg: "(225)"
      - lage: "Ein persoenlicher Lernassistent gibt fortlaufend Rueckmeldung und erstellt am Ende jeder Einheit einen Bericht mit Noten, Staerken, Schwaechen und Verbesserungsvorschlaegen; die Lehrkraft nutzt den Bericht fuer die Notengebung am Ende des Zeitraums."
        wertung: "hochrisiko"
        begruendung: "Obwohl das System vor allem begleitend Rueckmeldung gibt, wird sein Ergebnis von der Lehrkraft fuer die Notenentscheidung genutzt und wirkt damit auf die abschliessende Bewertung ein."
        beleg: "(225)"
      - lage: "Eine Sprachlern-Anwendung gibt Lernenden sofortige Rueckmeldung und korrigiert erkannte Fehler; sie fuehrt zu keinem Zeugnis, keiner Bescheinigung und keiner anerkannten Form der Anerkennung und wird von Lernenden aus eigenem Antrieb genutzt, ohne dass eine Einrichtung das verlangt."
        wertung: "kein_hochrisiko"
        begruendung: "Sie dient nicht formalem und beilaeufigem Lernen aus eigenem Antrieb und fuehrt zu keiner anerkannten Qualifikation."
        beleg: "(225)"
      - lage: "Ein Lernbegleiter fuer Menschen mit anderer Wahrnehmung oder Verarbeitung, etwa Autismus, Lese-Rechtschreib-Schwierigkeiten oder Aufmerksamkeitsstoerung, baut persoenliche Lernwege, passt Material, Tempo und Darstellung an und bietet Vorlesefunktion, Schriftgroessen, Farbanpassungen, mehr Zeit oder Pausen."
        wertung: "kein_hochrisiko"
        begruendung: "Das Ergebnis dient dem Unterricht der Lehrkraft und der zusaetzlichen Unterstuetzung; es soll keine Noten bestimmen und das Gelernte nicht bewerten."
        beleg: "(225)"
      - lage: "Ein Werkzeug gibt Lernenden Rueckmeldung zu Aussprache oder Lesefluss, analysiert die Sprache und schlaegt Verbesserungen bei Betonung, Rhythmus und Aussprache vor."
        wertung: "kein_hochrisiko"
        begruendung: "Die Rueckmeldung nutzen die Lernenden selbst; Lehrkraefte verwenden sie nicht, um Noten zu bestimmen, die in eine Endbewertung einfliessen, und nicht, um Sprachkenntnisse festzustellen."
        beleg: "(225)"
      - lage: "Ein System prueft eine von einer Lehrkraft erstellte Pruefung auf Grammatikfehler, unklare Formulierungen und Widersprueche zum Bewertungsraster und schlaegt Aenderungen vor."
        wertung: "kein_hochrisiko"
        begruendung: "Es aendert Inhalt, Schwierigkeit und Lernziel nicht, die Lehrkraft bleibt fuer die Pruefung verantwortlich; es faellt unter die Ausnahme fuer das Verbessern des Ergebnisses einer bereits abgeschlossenen menschlichen Taetigkeit, Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(225)"
      - lage: "Ein System errechnet aus den im Schuljahr erzielten Noten und deren Gewichtungen den Durchschnitt, den die Lehrkraft fuer ihre Endbewertung nutzt."
        wertung: "kein_hochrisiko"
        begruendung: "Es fuehrt nur eine einfache Rechnung aus und faellt damit unter die Ausnahme fuer eng umgrenzte Verfahrensaufgaben in Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(225)"
      - lage: "Ein System beobachtet die Bewertungsmuster von Lehrkraeften ueber die Zeit und meldet Abweichungen, die danach ein Mensch prueft und bei Bedarf berichtigt."
        wertung: "kein_hochrisiko"
        begruendung: "Es soll Entscheidungsmuster und Abweichungen davon erkennen, aendert Bewertungen nicht selbsttaetig und soll eine abgeschlossene menschliche Bewertung nicht ersetzen oder beeinflussen; Ausnahme nach Artikel 6 Absatz 3 Buchstabe c."
        beleg: "(225)"
  - fundstelle: "KI-VO/anh-III/nr-3-c"
    hauptfrage: "Schaetzt Ihr System ein, welche Stufe der Bildung fuer eine bestimmte Person die richtige ist, also ob sie aufsteigt oder auf welchem Niveau sie einsteigt?"
    folgefragen:
      - frage: "Wird Ihr System im Rahmen einer Bildungs- oder Berufsbildungseinrichtung eingesetzt, egal welcher Stufe?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(210)"
      - frage: "Richtet sich Ihr System hauptsaechlich an die Fortbildung von Lehrkraeften, Ausbildern oder anderem Lehrpersonal und nicht an Lernende?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(214)"
      - frage: "Schaetzt Ihr System ein, welche Stufe der Bildung eine bestimmte Person erhalten wird oder auf welche Stufe sie Zugang erhalten kann?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(226)"
      - frage: "Betrachtet Ihr System nur allgemeine Entwicklungen und Muster bei Gruppen von Lernenden, ohne ueber die Einstufung oder die Moeglichkeiten einzelner Personen zu befinden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(229)"
      - frage: "Wird Ihr System von einer Bildungs- oder Berufsbildungseinrichtung eingesetzt und nicht allein von Lernenden selbst, um ihnen ihre eigene Entscheidung zu erleichtern?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(229)"
      - frage: "Verarbeitet Ihr System persoenliche Daten einer Person, um daraus auf ihre Eigenschaften zu schliessen oder ihren schulischen oder beruflichen Weg einzuschaetzen oder vorherzusagen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(215)"
      - frage: "Erstellt Ihr System nur Fragen und Themen, mit denen eine Lehrkraft danach selbst prueft, ob eine Person fuer eine Stufe bereit ist, ohne selbst ueber die Stufe zu befinden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(229)"
      - frage: "Wertet Ihr System nur die bereits ausgesprochenen Empfehlungen von Ausbildern aus, um das Vorgehen der Einrichtung kuenftig zu verbessern, ohne ueber die Einstufung einzelner Personen zu befinden?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(229)"
      - frage: "Bestimmt Ihr System die passende Stufe, den passenden Kurs oder das passende Ausbildungsmodul fuer eine Person, oder spricht es dazu eine Empfehlung an Lehrkraefte aus?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(226)"
    erfasst:
      - text: "Erfasst sind Systeme, die einschaetzen, welche Stufe der Bildung eine Person erhalten wird oder auf welche Stufe sie Zugang erhalten kann, im Rahmen von oder innerhalb von Bildungs- und Berufsbildungseinrichtungen aller Stufen."
        beleg: "(226)"
      - text: "Der erste Zweck ist das Bestimmen der Stufe, die eine Person erhalten wird, also der Fortschritt auf einem laufenden Lernweg, etwa der Aufstieg in die naechste Klassenstufe oder der Wechsel in einen Kurs auf hoeherem Niveau."
        beleg: "(226)"
      - text: "Der zweite Zweck ist das Einschaetzen der Stufe, auf die eine Person Zugang erhalten kann, indem Bereitschaft und Voraussetzungen vor dem Eintritt in ein Programm geprueft werden, oft durch Einstufungstests oder Kompetenzpruefungen, um Einstiegsniveau oder Zugangsberechtigung zu bestimmen."
        beleg: "(226)"
      - text: "Erfasst sind auch Systeme, die den aktuellen Wissens- und Koennensstand in einem Fach zugrunde legen und daraus das passende Kurs-, Programm- oder Modulniveau fuer den naechsten Schritt bestimmen, und dabei besondere Bedarfe oder besondere Begabungen beruecksichtigen koennen."
        beleg: "(227)"
      - text: "Erfasst sind auch Systeme, die Faehigkeiten, Wissen und Koennen pruefen, um die passende Stufe zu finden, und die anhand der vorhandenen Kompetenzen und gegebenenfalls der Entwicklungsmoeglichkeiten eine Einstufung empfehlen und bestimmen, ob die Person zur naechsten Stufe aufsteigen kann."
        beleg: "(228)"
      - text: "Dass die letzte Entscheidung bei Lehrkraeften und den verantwortlichen Personen der Einrichtung liegt, die der Empfehlung folgen oder sie verwerfen koennen, aendert nichts an der Einstufung als hochriskant; bei schlechter Gestaltung koennten solche Systeme Lernende falsch einordnen und ihre Moeglichkeiten und ihren weiteren Weg schaedigen."
        beleg: "(229)"
      - text: "Verarbeitet das System persoenliche Daten, um persoenliche Eigenschaften einer Person zu bewerten, so ist es immer als hochriskant einzustufen, auch wenn es die Bedingungen der Ausnahmeregel in Artikel 6 Absatz 3 erfuellen wuerde."
        beleg: "(215)"
    nicht_erfasst:
      - text: "Nicht erfasst sind Systeme, die nicht von einer Bildungseinrichtung eingesetzt werden, sondern Lernenden nur helfen sollen, ihren Bildungsweg selbst zu entscheiden, etwa Empfehlungen zu Kursen, Programmen oder Abschluessen auf Grundlage von Angaben, die die Lernenden selbst machen, wie Interessen und Berufsziele."
        beleg: "(229)"
      - text: "Nicht erfasst sind Systeme, deren Ergebnis nicht fuer Entscheidungen ueber die Einstufung oder die Moeglichkeiten einzelner Lernender genutzt wird, sondern nur ein breiteres Bild der Bildungslandschaft gibt, etwa die Auswertung allgemeiner Entwicklungen nach dem Ende der weiterfuehrenden Schule."
        beleg: "(229)"
      - text: "Systeme, die hauptsaechlich der Fortbildung von Lehrkraeften und Ausbildungspersonal dienen, fallen nicht unter Nummer 3; sie koennen unter Nummer 4 des Anhangs III fallen, die Beschaeftigung betrifft."
        beleg: "(214)"
      - text: "Systeme, die nur Fragen und Themen erstellen, mit denen Lehrkraefte danach selbst die Bereitschaft einer Person fuer eine Stufe pruefen, fallen unter die Ausnahme fuer vorbereitende Taetigkeiten in Artikel 6 Absatz 3 Buchstabe d, weil sie selbst nicht ueber die Stufe befinden."
        beleg: "(229)"
      - text: "Systeme, die die bereits ausgesprochenen Empfehlungen von Ausbildern auswerten und Vorschlaege machen, wie die Einrichtung ihr Vorgehen verbessern kann, fallen unter die Ausnahme fuer das Verbessern des Ergebnisses einer bereits abgeschlossenen menschlichen Taetigkeit in Artikel 6 Absatz 3 Buchstabe b, weil sie keine Entscheidung ueber die Einstufung treffen."
        beleg: "(229)"
    beispiele:
      - lage: "Eine Einrichtung nutzt ein Einstufungswerkzeug, das die Faehigkeiten neuer Lernender prueft und den Lehrkraeften empfiehlt, ob sie in den Anfaenger-, Mittel- oder Fortgeschrittenenkurs gehoeren, oder das darueber befindet, ob eine Person in die Hochschulbildung oder in die Berufsbildung wechselt."
        wertung: "hochrisiko"
        begruendung: "Das System bestimmt die passende Stufe fuer eine bestimmte Person."
        beleg: "(229)"
      - lage: "Eine Berufsbildungseinrichtung prueft mit Einstufungstests und Kompetenzpruefungen Wissen und Koennen in Mathematik, Physik und technischen Grundlagen und bestimmt daraus die Zugangsberechtigung fuer eine bestimmte Stufe oder einen bestimmten Kurs."
        wertung: "hochrisiko"
        begruendung: "Das System schaetzt ein, welche Stufe der Bildung die Person in einem bestimmten Programm erreichen kann."
        beleg: "(229)"
      - lage: "Ein System ordnet Lernende mit besonderem Bildungsbedarf passenden Programmen zu und empfiehlt die geeignete Platzierung samt notwendiger Unterstuetzung, auf Grundlage von Testergebnissen, Rueckmeldungen von Lehrkraeften, psychologischen Berichten und der Krankheitsgeschichte."
        wertung: "hochrisiko"
        begruendung: "Das System bestimmt die Einstufung und das Mass der Unterstuetzung fuer einzelne Personen."
        beleg: "(229)"
      - lage: "Ein System empfiehlt Lernenden selbst, welche Kurse, Programme oder Abschluesse sie im naechsten Jahr anstreben koennten, auf Grundlage ihrer eigenen Angaben zu Interessen und Berufszielen."
        wertung: "kein_hochrisiko"
        begruendung: "Es wird nicht von einer Bildungseinrichtung eingesetzt, sondern hilft den Lernenden nur, ihren Bildungsweg selbst zu entscheiden."
        beleg: "(229)"
      - lage: "Einrichtungen, Politik und Forschung nutzen ein System, das aus verschiedenen Quellen allgemeine Entwicklungen auswertet, welche Bildungsstufen nach der weiterfuehrenden Schule gewaehlt werden."
        wertung: "kein_hochrisiko"
        begruendung: "Das Ergebnis dient nicht Entscheidungen ueber die Einstufung oder die Moeglichkeiten einzelner Lernender, sondern einem breiteren Bild der Bildungslandschaft."
        beleg: "(229)"
      - lage: "Ein System hilft Lehrkraeften, die Pruefung der Bereitschaft einer Person fuer eine Stufe vorzubereiten, indem es aus Vorbildung und Berufserfahrung Fragen und Themen erstellt, die die Lehrkraft dann selbst nutzt."
        wertung: "kein_hochrisiko"
        begruendung: "Das Ergebnis dient der Lehrkraft fuer ihr eigenes Vorgehen und befindet nicht selbst ueber die Stufe; es faellt unter die Ausnahme fuer vorbereitende Taetigkeiten in Artikel 6 Absatz 3 Buchstabe d."
        beleg: "(229)"
      - lage: "Eine Einrichtung wertet mit einem System aus, welche Empfehlungen Ausbilder Auszubildenden fuer weiterfuehrende Kurse gegeben haben, und erhaelt Vorschlaege, wie sie dabei kuenftig vorgehen koennte."
        wertung: "kein_hochrisiko"
        begruendung: "Das Ergebnis verbessert das Vorgehen der Einrichtung, trifft aber keine Entscheidung ueber Einstufung oder Moeglichkeiten der Auszubildenden; Ausnahme nach Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(229)"
  - fundstelle: "KI-VO/anh-III/nr-3-d"
    hauptfrage: "Beobachtet Ihr System Lernende waehrend einer Pruefung und erkennt dabei unerlaubtes Verhalten?"
    folgefragen:
      - frage: "Wird Ihr System im Rahmen einer Bildungs- oder Berufsbildungseinrichtung eingesetzt, egal welcher Stufe?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(210)"
      - frage: "Richtet sich Ihr System hauptsaechlich an die Fortbildung von Lehrkraeften, Ausbildern oder anderem Lehrpersonal und nicht an Lernende?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(214)"
      - frage: "Beobachtet Ihr System Lernende waehrend einer Pruefung, vor Ort oder aus der Ferne, gleichzeitig mitlaufend oder spaeter ausgewertet?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(231)"
      - frage: "Erkennt Ihr System dabei selbst Verhalten, das die Ordnung der Pruefung verletzt, beobachtet es also nicht nur, sondern meldet auch Auffaelligkeiten?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(233)"
      - frage: "Findet die Pruefung in einer beaufsichtigten Lage statt, etwa eine schriftliche oder muendliche Pruefung oder eine andere Pruefung in Echtzeit unter Aufsicht?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(234)"
      - frage: "Fuehrt diese Pruefung zu einer Bewertung oder einer Note der Person?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(234)"
      - frage: "Prueft Ihr System nur fertig abgegebene Hausaufgaben, Aufsaetze oder andere Arbeiten auf Abschreiben oder unerlaubte Zusammenarbeit, also nach der Abgabe und ohne Beobachtung in Echtzeit?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(235)"
      - frage: "Beobachtet Ihr System Verhalten nur ausserhalb von Pruefungen, etwa in der Mensa, auf Gaengen oder in anderen Bereichen ohne Pruefung?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(235)"
      - frage: "Verarbeitet Ihr System persoenliche Daten einer Person, um daraus auf ihre Eigenschaften zu schliessen oder ihren schulischen oder beruflichen Weg einzuschaetzen oder vorherzusagen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(215)"
      - frage: "Bestaetigt oder verwirft Ihr System nur einen Verdacht, den eine Aufsichtsperson zuvor selbst gefasst hat, und entscheidet die Aufsichtsperson danach selbst ueber das weitere Vorgehen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(235)"
      - frage: "Prueft Ihr System nur, ob die anwesende Person die angemeldete Person ist, ohne selbst darueber zu entscheiden, ob sie die Pruefung fortsetzen darf oder ob Folgen eintreten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "erfasst"
        beleg: "(235)"
    erfasst:
      - text: "Erfasst sind Systeme, die unerlaubtes Verhalten von Lernenden waehrend Pruefungen im Rahmen von oder innerhalb von Bildungs- und Berufsbildungseinrichtungen aller Stufen beobachten und erkennen."
        beleg: "(230)"
      - text: "Erfasst sind Pruefungen vor Ort und aus der Ferne oder im Netz, gleichzeitig mitlaufend wie spaeter ausgewertet."
        beleg: "(231)"
      - text: "Unerlaubtes Verhalten ist jede Handlung von Lernenden, die die Ordnung des Pruefungsvorgangs verletzt; dazu zaehlen Abschreiben fremder Texte, unerlaubtes Zusammenwirken und das Verfaelschen von Pruefungsunterlagen."
        beleg: "(232)"
      - text: "Solche Systeme sollen typischerweise Verstoesse gegen die Redlichkeit in Pruefungslagen verhindern und koennen mit Gesichtserkennung, Auswertung des Tastenanschlags, Bildschirmbeobachtung sowie Ton- und Bildaufzeichnung arbeiten."
        beleg: "(232)"
      - text: "Das System muss beides tun: beobachten und erkennen; Beobachten ist dabei meist die Voraussetzung fuer das Erkennen."
        beleg: "(233)"
      - text: "Pruefung heisst hier, dass das unerlaubte Verhalten in einem Vorgang auftreten muss, der zu einer Bewertung oder einer Note fuehrt, also im Rahmen einer abschliessenden Bewertung; entscheidend sind Zeitpunkt und Umstand des Einsatzes, naemlich eine beaufsichtigte Pruefungslage wie eine schriftliche oder muendliche Pruefung oder eine andere Pruefung in Echtzeit unter Aufsicht."
        beleg: "(234)"
      - text: "Verarbeitet das System persoenliche Daten, um persoenliche Eigenschaften einer Person zu bewerten, so ist es immer als hochriskant einzustufen, auch wenn es die Bedingungen der Ausnahmeregel in Artikel 6 Absatz 3 erfuellen wuerde."
        beleg: "(215)"
    nicht_erfasst:
      - text: "Das Pruefen von Hausaufgaben, Aufsaetzen oder anderen Arbeiten auf Abschreiben oder unerlaubte Zusammenarbeit faellt nicht darunter, weil es ueblicherweise in unbeaufsichtigter Umgebung geschieht, erst nach Fertigstellung und Abgabe stattfindet und keine Beobachtung in Echtzeit waehrend der Pruefung umfasst."
        beleg: "(235)"
      - text: "Systeme, die Verhalten ausserhalb von Pruefungen beobachten, etwa in der Mensa, auf Gaengen und in anderen Bereichen ohne Pruefung, und Personal bei moeglichen Vorfaellen wie Schikane oder Belaestigung warnen, fallen nicht darunter; solche Systeme koennen aber unter Nummer 1 des Anhangs III fallen, wenn sie der Begriffsbestimmung eines Systems zur biometrischen Fernidentifizierung entsprechen."
        beleg: "(235)"
      - text: "Systeme, die hauptsaechlich der Fortbildung von Lehrkraeften und Ausbildungspersonal dienen, fallen nicht unter Nummer 3; sie koennen unter Nummer 4 des Anhangs III fallen, die Beschaeftigung betrifft."
        beleg: "(214)"
      - text: "Systeme, mit denen eine Aufsichtsperson einen zuvor selbst gefassten Verdacht bestaetigen oder verwerfen laesst und die einen Bericht an diese Person geben, ueber den sie selbst weiter entscheidet, fallen unter die Ausnahme fuer das Verbessern des Ergebnisses einer bereits abgeschlossenen menschlichen Taetigkeit in Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(235)"
      - text: "Systeme, die waehrend einer Pruefung nur Ausweise oder biometrische Angaben verarbeiten, um festzustellen, ob die anwesende Person die angemeldete Person ist, und die nicht selbst darueber entscheiden, ob die Person fortfahren darf oder ob Folgen eintreten, fallen unter die Ausnahme fuer Verfahrensaufgaben in Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(235)"
    beispiele:
      - lage: "Eine Einrichtung beobachtet mit Gesichtserkennung, Auswertung des Tastenanschlags und Bildschirmbeobachtung Pruefungsteilnehmer in einer Pruefung zur Zertifizierung und erkennt unerlaubtes Verhalten, etwa den Zugriff auf verbotene Unterlagen oder die Verstaendigung mit anderen Personen."
        wertung: "hochrisiko"
        begruendung: "Das System beobachtet und erkennt unerlaubtes Verhalten waehrend einer Pruefung."
        beleg: "(235)"
      - lage: "Eine Bildungseinrichtung wertet mit maschinellem Lernen in Echtzeit das Verhalten der Lernenden aus und erkennt Muster, die auf Taeuschung in Pruefungen im Netz hindeuten."
        wertung: "hochrisiko"
        begruendung: "Das System beobachtet und erkennt unerlaubtes Verhalten waehrend einer Pruefung."
        beleg: "(235)"
      - lage: "Eine Bildungseinrichtung erkennt mit Gesichtserkennung und Gegenstandserkennung unerlaubtes Verhalten in Pruefungen in Praesenz, etwa die Nutzung verbotener Unterlagen oder Geraete."
        wertung: "hochrisiko"
        begruendung: "Das System beobachtet und erkennt unerlaubtes Verhalten waehrend einer Pruefung."
        beleg: "(235)"
      - lage: "Eine Bildungseinrichtung prueft Hausaufgaben und abgegebene Arbeiten gegen eine Sammlung bestehender Texte auf Abschreiben."
        wertung: "kein_hochrisiko"
        begruendung: "Es werden abgegebene Arbeiten geprueft, die in unbeaufsichtigter Umgebung entstanden sind; es gibt keine Beobachtung in Echtzeit waehrend einer Pruefung."
        beleg: "(235)"
      - lage: "Eine Bildungseinrichtung beobachtet Verhalten in Mensa, Gaengen und anderen Bereichen ohne Pruefung und warnt Personal bei moeglichen Vorfaellen wie Schikane oder Belaestigung."
        wertung: "kein_hochrisiko"
        begruendung: "Das System beobachtet kein unerlaubtes Verhalten waehrend Pruefungen, sondern dient der Sicherheit und Ordnung; es kann aber unter Nummer 1 des Anhangs III fallen, wenn es ein System zur biometrischen Fernidentifizierung ist."
        beleg: "(235)"
      - lage: "Eine Aufsichtsperson bemerkt in einer Pruefung im Netz auffaelliges Verhalten und laesst sich den Verdacht von einem System bestaetigen oder verwerfen; das System liefert einen Bericht mit den erkannten Mustern, die Aufsichtsperson entscheidet danach selbst ueber das weitere Vorgehen."
        wertung: "kein_hochrisiko"
        begruendung: "Das System verbessert das Ergebnis einer bereits abgeschlossenen menschlichen Taetigkeit; Ausnahme nach Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(235)"
      - lage: "Ein System verarbeitet waehrend einer Pruefung Ausweise oder biometrische Angaben wie einen Gesichtsabgleich, um festzustellen, ob die anwesende Person die angemeldete Person ist."
        wertung: "kein_hochrisiko"
        begruendung: "Es erleichtert nur die Feststellung der Person und entscheidet nicht selbst, ob die Person fortfahren darf oder ob Folgen eintreten; das entscheidet die Aufsichtsperson; Ausnahme nach Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(235)"
