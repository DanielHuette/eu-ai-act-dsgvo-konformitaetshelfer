bereich: "KI-VO/anh-III/nr-1"
titel: Biometrie
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitt 3.1"
punkte:
  - fundstelle: "KI-VO/anh-III/nr-1-a"
    hauptfrage: "Erkennt Ihr System wieder, wer ein Mensch ist, indem es gemessene Körpermerkmale mit einer Sammlung gespeicherter Körpermerkmale vergleicht, ohne dass die Person dabei bewusst mitmacht?"
    folgefragen:
      - frage: "Verarbeitet Ihr System gemessene Körpermerkmale von Menschen, also Gesicht, Fingerabdruck, Iris, Venenbild, Erbinformation, Geruch, Stimme, Gangart, Handschrift, Tippverhalten, Klickmuster, Blickbewegung, Herzschlag oder Hirnströme?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(122)"
      - frage: "Betreffen diese Körpermerkmale ausschliesslich Verstorbene, Leichen, menschliche Überreste oder Spuren davon?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(123)"
      - frage: "Ist der Zweck des Systems, festzustellen, wer eine Person ist, also ihre Identität zu bestimmen?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(131)"
      - frage: "Vergleicht das System die gemessenen Körpermerkmale der Person mit Körpermerkmalen, die in einer Sammlung gespeichert sind?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(129)"
      - frage: "Ist der einzige Zweck, zu bestätigen, dass die Person diejenige ist, für die sie sich ausgibt, etwa um ihr Zugang zu einem Dienst zu geben, ein Gerät zu entsperren oder sie in Räume zu lassen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(138)"
      - frage: "Müssen die betroffenen Personen bewusst mitmachen, sich also absichtlich vor den Sensor stellen oder ihn absichtlich berühren, damit das System arbeitet?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(140)"
      - frage: "Werden ausschliesslich Aufnahmen eines abgeschlossenen Materialbestands von einem Tatort ausgewertet, ohne Abgleich mit Sammlungen von aussen, so dass keine Identität festgestellt wird?"
        bei_ja: "nicht_erfasst"
        bei_nein: "erfasst"
        beleg: "(144)"
    erfasst:
      - text: "Es genügt, wenn das System eine Person verfolgt, etwa um die Fluchtrichtung eines Verdächtigen zu bestimmen, sofern das Verfolgen auf Körpermerkmalen beruht und ein Vergleich mit einer Sammlung gespeicherter Körpermerkmale stattfindet."
        beleg: "(135)"
      - text: "Die Identität darf vorher schon bekannt oder von einem Menschen geprüft worden sein; auch die erste Feststellung der Identität zählt."
        beleg: "(133)"
      - text: "Die Sammlung kann die Körpermerkmale einer einzigen Person oder vieler Personen enthalten."
        beleg: "(143)"
      - text: "Als Sammlung genügt auch eine Umwandlung von Körpermerkmalen aus Material, das im Internet verfügbar ist; ebenso eine Sammlung eines privaten Unternehmens, etwa eine Stimmensammlung."
        beleg: "(144)"
      - text: "Der Ort spielt keine Rolle: anders als beim Verbot ist diese Nummer nicht auf öffentlich zugängliche Orte beschränkt, auch Aufnahmen einer Kamera auf Privatgrund genügen."
        beleg: "(144)"
      - text: "Auch berührungslos erfasste Merkmale wie Fingerabdruck, Gangart, Stimme, Erbinformation, Tippverhalten und andere Verhaltenssignale können genügen."
        beleg: "(141)"
      - text: "Körperkameras, die etwa eine Demonstration mit hunderten Teilnehmern ungezielt filmen, erfüllen die Bedingung der Erkennung aus der Ferne; dasselbe gilt für den Einsatz im virtuellen Raum."
        beleg: "(142)"
      - text: "Fernerkennung, die nicht der Strafverfolgung dient oder nicht in Echtzeit abläuft, ist nicht verboten, sondern gilt als hochriskant; dasselbe gilt für Fälle, die unter eine Ausnahme vom Verbot fallen."
        beleg: "(126)"
    nicht_erfasst:
      - text: "Körpermerkmale von Verstorbenen, Leichen, menschlichen Überresten oder Spuren davon sind keine Körpermerkmale im Sinne dieser Nummer; ein Abgleich von Erbinformation oder Gesichtsbildern aus Leichenfunden fällt nicht darunter."
        beleg: "(123)"
      - text: "Die Suche nach Gegenständen ohne Körpermerkmale, etwa nach Kennzeichen, bestimmter Kleidung, Waffen oder Hintergrund, fällt nicht darunter."
        beleg: "(124)"
      - text: "Systeme, deren Zweck nicht ist, die Identität einer Person festzustellen, fallen nicht darunter; etwa das Sammeln weiterer Angaben oder das Herstellen von Verbindungen zwischen Straffällen."
        beleg: "(132)"
      - text: "Systeme, die Körpermerkmale nicht mit einer Sammlung gespeicherter Körpermerkmale vergleichen, fallen nicht darunter."
        beleg: "(132)"
      - text: "Wer eine Person ortet, ohne Körpermerkmale zu nutzen oder ohne Abgleich mit einer Sammlung, fällt nicht darunter; etwa Suche nach Aufdrucken auf Kleidung, Kennzeichenerkennung, Auswertung von Fahrscheinentwertungen oder Ortsbestimmung eines Bildes anhand des Hintergrunds."
        beleg: "(134)"
      - text: "Die blosse Bestätigung der behaupteten Identität durch Eins-zu-eins-Abgleich mit Körpermerkmalen, die auf einem Gerät, im Pass oder auf einem Ausweis gespeichert sind, fällt nicht darunter."
        beleg: "(136)"
      - text: "Bestätigung der Identität allein zu dem Zweck, Zugang zu einem Dienst zu erhalten, ein Gerät zu entsperren oder gesicherte Räume zu betreten, fällt nicht darunter."
        beleg: "(138)"
      - text: "Bewusstes Mitmachen schliesst die Erkennung aus der Ferne aus; dass die Personen über den Einsatz nur informiert werden, genügt dafür aber nicht, sie müssen sich aktiv und bewusst vor den Sensor stellen."
        beleg: "(140)"
      - text: "Die Auswertung eines abgeschlossenen Materialbestands vom Tatort ohne Abgleich mit Sammlungen von aussen fällt noch nicht darunter, auch wenn dabei Gesichter verglichen werden."
        beleg: "(144)"
      - text: "Systeme, die Fingerabdrücke nur aufnehmen, etwa über mehrere Lichtwellenlängen aus Haut und Unterhaut, ohne Abgleich mit einer Sammlung, fallen nicht darunter."
        beleg: "(144)"
      - text: "Systeme allein für Netzsicherheit und Datenschutz, etwa zum Unkenntlichmachen personenbezogener Daten, fallen nicht darunter."
        beleg: "(144)"
      - text: "Kameras, die nur feststellen, ob Menschen anwesend sind, etwa Wärmebildkameras zur Sitzplatzbelegung, zur Erkennung von Personen im Gleisbereich oder Drohnen- und Satellitenbilder bei der Suche nach Vermissten, fallen nicht darunter."
        beleg: "(144)"
      - text: "Das Verfolgen einer Person allein anhand von Kleidungsfarbe und Körperumriss, ohne Körpermerkmale zu gewinnen oder abzugleichen, fällt nicht darunter."
        beleg: "(144)"
      - text: "Systeme, die Körpermerkmale nutzen, aber nicht zur Feststellung der Identität, fallen nicht darunter; etwa eine Sprach- und Dialektauswertung, die nur die Herkunftsregion stützen soll."
        beleg: "(144)"
      - text: "Systeme, die beschlagnahmtes Material nur vorsortieren, etwa um festzustellen, ob auf einem Bild ein Kind zu sehen ist, fallen nicht darunter."
        beleg: "(144)"
    beispiele:
      - lage: "Kameras in Wand und Decke eines Stadions; nach einem Vorfall werden die aufgenommenen Gesichtsbilder mit einer Sammlung abgeglichen, um Täter festzustellen, ohne dass die Besucher mitmachen."
        wertung: "hochrisiko"
        begruendung: "Feststellung der Identität durch Abgleich mit einer Sammlung, ohne bewusstes Mitmachen."
        beleg: "(144)"
      - lage: "Gangerkennung, die das gespeicherte Gangbild eines bekannten Flüchtigen mit Videomaterial aus Verkehrsknotenpunkten abgleicht, um ihn weiterzuverfolgen."
        wertung: "hochrisiko"
        begruendung: "Das Verfolgen beruht auf Körpermerkmalen und auf dem Abgleich mit einer Sammlung."
        beleg: "(135)"
      - lage: "Gesichtserkennung am Stadioneingang, die gesperrte Personen bei der Einlasskontrolle erkennt."
        wertung: "kein_hochrisiko"
        begruendung: "Die Bedingung der Erkennung aus der Ferne fehlt, weil die Personen bewusst vor das Gerät treten müssen, um Einlass zu bekommen."
        beleg: "(144)"
      - lage: "Grenzautomat vergleicht das aufgenommene Gesichtsbild eines Reisenden mit dem Bild im Chip seines Passes, um zu bestätigen, dass er der Inhaber des Dokuments ist."
        wertung: "kein_hochrisiko"
        begruendung: "Reine Bestätigung der behaupteten Identität."
        beleg: "(136)"
      - lage: "Derselbe Grenzautomat gleicht die aufgenommenen Körpermerkmale zusätzlich mit einer Sammlung von Straftätern ab."
        wertung: "hochrisiko"
        begruendung: "Neben der Bestätigung tritt ein Abgleich mit einer Sammlung zur Feststellung der Identität."
        beleg: "(136)"
      - lage: "Nach einer Festnahme wird im Polizeigewahrsam ein Lichtbild des Verdächtigen aufgenommen und mit einer Sammlung gespeicherter Körpermerkmale abgeglichen."
        wertung: "kein_hochrisiko"
        begruendung: "Keine Erkennung aus der Ferne, weil der Verdächtige im formellen Verfahren mitmacht."
        beleg: "(140)"
      - lage: "Eine Behörde prüft mit Gesichtserkennung die Identität von Personen gegen eine Liste terrorverdächtiger Personen, um ihnen Einlass in einen abgesperrten Sicherheitsbereich innerhalb eines öffentlichen Platzes zu geben; Hinweise sind sichtbar angebracht und der Sensor verlangt, dass man in einem markierten Feld steht und hineinschaut."
        wertung: "kein_hochrisiko"
        begruendung: "Die Personen machen bewusst mit, deshalb fehlt die Erkennung aus der Ferne."
        beleg: "(140)"
      - lage: "Gesichts- und Stimmerkennung, die ausgewählte Personen in Rundfunkarchiven aufspürt, indem der Inhalt mit einer Sammlung abgeglichen wird, ohne dass die Personen mitmachen."
        wertung: "hochrisiko"
        begruendung: "Feststellung der Identität durch Abgleich mit einer Sammlung ohne Mitmachen der Betroffenen."
        beleg: "(144)"
  - fundstelle: "KI-VO/anh-III/nr-1-b"
    hauptfrage: "Teilt Ihr System Menschen anhand gemessener Körpermerkmale in Gruppen ein und leitet dafür ein geschütztes Merkmal wie ethnische Herkunft, Erbinformation oder Gesundheit aus diesen Körpermerkmalen ab?"
    folgefragen:
      - frage: "Ordnet Ihr System einzelne Menschen anhand ihrer gemessenen Körpermerkmale bestimmten Gruppen zu, also nicht um festzustellen, wer sie sind, sondern um sie einzuordnen?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(166)"
      - frage: "Beruht die Einteilung allein auf Kleidung oder Zubehör wie Schal, Hut, Handschuhe, Uhr oder Kreuz, oder auf Aktivität in sozialen Netzwerken?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(167)"
      - frage: "Ist diese Einteilung nur eine Beigabe zu einer anderen entgeltlichen Leistung und aus sachlichen technischen Gründen zwingend nötig, so dass sie ohne die Hauptleistung gar nicht genutzt werden kann?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(168)"
      - frage: "Leitet Ihr System aus den Körpermerkmalen ein Merkmal ab, das zu den geschützten gehört, also rassische oder ethnische Herkunft, politische Meinung, religiöse oder philosophische Überzeugung, Gewerkschaftszugehörigkeit, Erbinformation, Körpermerkmale zur eindeutigen Erkennung einer Person, Gesundheit, Sexualleben oder sexuelle Orientierung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(169)"
      - frage: "Sind die abgeleiteten Merkmale ausschliesslich Alter oder Geschlecht?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(170)"
      - frage: "Sind die Körpermerkmale die Eingabe des Systems und das geschützte Merkmal das Ergebnis, nach dem die Personen dann eingeteilt werden?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(170)"
    erfasst:
      - text: "Nur Einteilungen nach geschützten Merkmalen werden erfasst; geschützt sind rassische oder ethnische Herkunft, politische Meinung, religiöse oder philosophische Überzeugung, Gewerkschaftszugehörigkeit, Erbinformation, Körpermerkmale zur eindeutigen Erkennung einer Person, Gesundheit sowie Sexualleben oder sexuelle Orientierung."
        beleg: "(169)"
      - text: "Praktisch bleiben vor allem ethnische Herkunft, Erbinformation und Gesundheit, weil die Einteilung nach Rasse, politischer Meinung, Gewerkschaftszugehörigkeit, religiöser oder philosophischer Überzeugung, Sexualleben oder sexueller Orientierung verboten ist."
        beleg: "(169)"
      - text: "Körpermerkmale müssen die Eingabe sein und das geschützte Merkmal das Ergebnis, das aus ihnen abgeleitet wird."
        beleg: "(170)"
      - text: "Die Einteilung kann auf körperlichen Merkmalen wie Gesichtszügen, Gesichtsform oder Hautfarbe beruhen, ebenso auf Erbinformation oder auf Verhalten wie Tippverhalten oder Gangart."
        beleg: "(167)"
      - text: "Einteilungen nach geschützten Merkmalen, die nicht verboten sind, gelten als hochriskant."
        beleg: "(126)"
    nicht_erfasst:
      - text: "Die Einteilung nach Kleidung oder Zubehör wie Schal, Hut, Handschuhe, Uhren oder Kreuze fällt nicht darunter."
        beleg: "(167)"
      - text: "Die Einteilung nach Aktivität in sozialen Netzwerken fällt nicht darunter."
        beleg: "(167)"
      - text: "Eine Funktion, die nur Beigabe zu einer anderen entgeltlichen Leistung und aus sachlichen technischen Gründen zwingend nötig ist, fällt nicht unter den Begriff der Einteilung nach Körpermerkmalen."
        beleg: "(166)"
      - text: "Beigabe heisst: die Funktion ist mit der anderen Leistung untrennbar verbunden, kann aus sachlichen technischen Gründen ohne sie nicht genutzt werden, und ihr Einbau dient nicht dazu, die Vorschriften zu umgehen."
        beleg: "(168)"
      - text: "Systeme, die eine bestimmte Person erkennen oder ihre Identität bestätigen sollen, fallen nicht hierunter, weil es hier nur um das Einordnen in eine Gruppe geht."
        beleg: "(166)"
      - text: "Alter und Geschlecht gelten nicht als geschützte Merkmale; wer nur sie ableitet, fällt nicht darunter."
        beleg: "(170)"
      - text: "Eine Einteilung, die nicht auf Körpermerkmalen beruht, fällt nicht darunter, auch wenn sie geschützte Merkmale berührt."
        beleg: "(170)"
    beispiele:
      - lage: "System teilt Patienten ein: es nimmt das Gangbild auf, leitet daraus Gesundheitsangaben ab und ordnet die Personen Krankheitsstufen zu, um frühe Anzeichen von Krankheiten mit Bewegungsstörungen zu erkennen."
        wertung: "hochrisiko"
        begruendung: "Körpermerkmale als Eingabe, Gesundheit als abgeleitetes geschütztes Merkmal, danach Einteilung."
        beleg: "(170)"
      - lage: "Flughafenkameras nehmen Gangbild und Gesichtsmuster der Reisenden auf, leiten daraus unter anderem die ethnische Herkunft ab und teilen die Reisenden in Gruppen ein, etwa um Sammelprofile zu bilden oder gezielte Massnahmen zu stützen."
        wertung: "hochrisiko"
        begruendung: "Ethnische Herkunft wird aus Körpermerkmalen abgeleitet und zur Einteilung benutzt."
        beleg: "(170)"
      - lage: "Kameras an der Grenze nehmen Gesichtsbilder auf und leiten daraus Alter und Geschlecht einreisender Ausländer ab."
        wertung: "kein_hochrisiko"
        begruendung: "Alter und Geschlecht sind keine geschützten Merkmale."
        beleg: "(170)"
      - lage: "System nimmt das Tippverhalten von Kunden auf, leitet daraus das Geschlecht ab und spielt danach persönlich zugeschnittene Werbung aus."
        wertung: "kein_hochrisiko"
        begruendung: "Es wird nach Körpermerkmalen eingeteilt, das abgeleitete Merkmal Geschlecht ist aber nicht geschützt."
        beleg: "(170)"
      - lage: "System schätzt aus Gesichtszügen oder Tippverhalten das Alter, um Minderjährige von schädlichen Inhalten, von altersbeschränkten Diensten, von Räumen oder von Warenautomaten fernzuhalten."
        wertung: "kein_hochrisiko"
        begruendung: "Abgeleitet wird das Alter, das nicht zu den geschützten Merkmalen gehört."
        beleg: "(170)"
      - lage: "System durchsucht Texte und Bilder, um verbotene oder unangemessene Inhalte zu finden, auch solche, die auf politische Meinungen hindeuten."
        wertung: "kein_hochrisiko"
        begruendung: "Die Einteilung beruht nicht auf Körpermerkmalen."
        beleg: "(170)"
  - fundstelle: "KI-VO/anh-III/nr-1-c"
    hauptfrage: "Stellt Ihr System aus gemessenen Körpermerkmalen Gefühle oder Absichten von Menschen fest oder erschliesst es sie?"
    folgefragen:
      - frage: "Ist der Zweck Ihres Systems, Gefühle oder Absichten von Menschen festzustellen oder zu erschliessen?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(171)"
      - frage: "Beruht diese Feststellung auf gemessenen Körpermerkmalen, etwa Stimme, Gesichtsausdruck, Körperhaltung, Bewegung, Gangart, Tippverhalten oder Herzschlag?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(171)"
      - frage: "Leitet Ihr System die Gefühle allein aus getipptem Text ab, also aus Inhalt, Stimmungsauswertung oder Schreibstil?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(124)"
      - frage: "Geht es ausschliesslich um körperliche Zustände wie Schmerz, Müdigkeit oder Krankheit, etwa um Müdigkeit bei Piloten oder Fahrern zu erkennen und Unfälle zu verhüten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(177)"
      - frage: "Erkennt Ihr System nur offen sichtbare Ausdrücke, Gesten oder Bewegungen, etwa Lächeln, Stirnrunzeln, Hand-, Arm- oder Kopfbewegungen, eine erhobene oder flüsternde Stimme, ohne daraus Gefühle oder Absichten abzuleiten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(177)"
      - frage: "Stellt Ihr System fest, dass eine Person eine bestimmte Haltung zeigt, etwa dass sie wütend wirkt?"
        bei_ja: "erfasst"
        bei_nein: "erfasst"
        beleg: "(176)"
    erfasst:
      - text: "Gefühle und Absichten sind weit zu verstehen; genannt werden Freude, Trauer, Wut, Überraschung, Ekel, Verlegenheit, Erregung, Scham, Verachtung, Zufriedenheit und Belustigung, die Aufzählung ist nicht abschliessend."
        beleg: "(175)"
      - text: "Auch die Feststellung einer Haltung wird erfasst, etwa dass eine Person eine wütende Haltung zeigt; die Vorschrift darf nicht dadurch umgangen werden, dass von Haltungen gesprochen wird."
        beleg: "(176)"
      - text: "Feststellen liegt vor, wenn ein Gefühl unmittelbar mit einem vorher eingespeicherten verglichen und erkannt wird; Erschliessen liegt vor, wenn das System es aus weiteren Daten ableitet, etwa durch lernende Verfahren. Wer erschliesst, stellt zugleich fest."
        beleg: "(174)"
      - text: "Offen sichtbare Ausdrücke und Gesten sind erfasst, sobald sie benutzt werden, um Gefühle oder Absichten festzustellen oder zu erschliessen."
        beleg: "(177)"
      - text: "Sprachbasierte Begleitsysteme sind nicht ausdrücklich eingestuft, können aber erfasst sein, wenn sie Gefühle oder Absichten aus Körpermerkmalen wie Stimme oder Videogesprächen ableiten."
        beleg: "(173)"
      - text: "Es spielt keine Rolle, ob das System die Person zugleich erkennen soll, und es spielt keine Rolle, ob das Ergebnis nur der betroffenen Person selbst angezeigt wird."
        beleg: "(177)"
      - text: "Systeme zur Gefühlserkennung ausserhalb von Arbeitsplatz und Bildungseinrichtungen sind nicht verboten, sondern hochriskant; ebenso solche, die an diesen Orten aus medizinischen Gründen oder aus Sicherheitsgründen eingesetzt werden."
        beleg: "(126)"
    nicht_erfasst:
      - text: "Körperliche Zustände wie Schmerz oder Müdigkeit gehören nicht zu Gefühlen oder Absichten; die Erkennung von Müdigkeit bei Piloten oder Fahrern zur Unfallverhütung fällt nicht darunter, ebenso nicht die Feststellung, dass eine Person krank ist."
        beleg: "(177)"
      - text: "Das blosse Erkennen offen sichtbarer Ausdrücke, Gesten oder Bewegungen fällt nicht darunter, solange daraus keine Gefühle oder Absichten abgeleitet werden."
        beleg: "(177)"
      - text: "Gefühle, die allein aus getipptem Text abgeleitet werden, also aus Inhalt, Stimmungsauswertung oder Schreibstil, beruhen nicht auf Körpermerkmalen und fallen nicht darunter."
        beleg: "(124)"
    beispiele:
      - lage: "Körperkameras von Polizeikräften erkennen selbsttätig Verhaltensmuster und melden eine aggressive Körperhaltung anhand von Gangart, Haltung, Bewegung und Gesichtsauswertung, um einzuschätzen, ob eine Person in eine Auseinandersetzung geraten wird."
        wertung: "hochrisiko"
        begruendung: "Körperliche Anzeichen werden ausgelegt, um den Gefühlszustand Wut zu erschliessen."
        beleg: "(177)"
      - lage: "System der Spielebranche verfolgt Körperhaltung, Gesichtsausdruck, Augenschluss und Blick, um Erregung, Wut, Frust und Belustigung der Spieler zu messen und das Produkt zu verbessern."
        wertung: "hochrisiko"
        begruendung: "Gefühle werden aus Körpermerkmalen erschlossen."
        beleg: "(177)"
      - lage: "Kameras an Wänden und Decken prüfen bei Konzerten die Stimmung des Publikums anhand von Stimmen, Gesichtern und Bewegungen und schicken mehr Sicherheitspersonal in Bereiche, in denen die Stimmung aggressiv wird."
        wertung: "hochrisiko"
        begruendung: "Gefühle einzelner Teilnehmer werden ausgewertet, um die Stimmung einzuschätzen."
        beleg: "(177)"
      - lage: "System im Callcenter wertet Tonlage, Tonhöhe und Lautstärke der Kundenstimme aus, um Zufriedenheit zu messen, Wut zu erkennen und an einen Menschen weiterzuleiten."
        wertung: "hochrisiko"
        begruendung: "Aus der Stimme werden Gefühle abgeleitet; dass der Kunde nicht erkannt werden soll, ändert nichts."
        beleg: "(177)"
      - lage: "Armbanduhr misst Stimme und Herzschlag und überwacht die Stimmung des Trägers, um ihm den eigenen Gefühlszustand bewusst zu machen und Vorschläge zur Besserung zu geben."
        wertung: "hochrisiko"
        begruendung: "Gefühle werden erschlossen; dass das Ergebnis nur dem Träger angezeigt wird, ändert nichts."
        beleg: "(177)"
      - lage: "System im Fahrzeug verfolgt Körperhaltung, Gesichtsausdruck, Augenschluss und Blick, um zu erkennen, wenn der Fahrer die Aufmerksamkeit verliert, einschläft oder ein plötzliches gesundheitliches Problem hat, und bringt das Fahrzeug sicher zum Stehen."
        wertung: "kein_hochrisiko"
        begruendung: "Schmerz und Müdigkeit sind körperliche Zustände und gehören nicht zu Gefühlen oder Absichten."
        beleg: "(177)"
      - lage: "Ein Fernsehsender zählt mit einem Gerät, wie oft seine Nachrichtensprecher in die Kamera lächeln."
        wertung: "kein_hochrisiko"
