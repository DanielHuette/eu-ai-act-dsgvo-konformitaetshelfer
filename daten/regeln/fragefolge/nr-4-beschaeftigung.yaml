bereich: "KI-VO/anh-III/nr-4"
titel: Beschäftigung und Personalmanagement
quelle: "Entwurf der Leitlinien der Kommission vom 19.05.2026, Anhang III, Abschnitt 3.4"
punkte:
  - fundstelle: "KI-VO/anh-III/nr-4"
    hauptfrage: "Hat Ihr System mit Menschen zu tun, die arbeiten oder Arbeit suchen - also mit Beschäftigung, mit der Steuerung von Arbeitskräften oder mit dem Zugang zu selbstständiger Tätigkeit?"
    folgefragen:
      - frage: "Geht es um Menschen, die für eine bestimmte Zeit Leistungen für einen anderen und nach dessen Weisung gegen Bezahlung erbringen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(239)"
      - frage: "Setzen Sie voraus, dass die betroffene Person einen förmlichen Arbeitsvertrag hat, damit Ihr System sie betrifft?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(239)"
      - frage: "Sind die betroffenen Personen Selbstständige, freie Mitarbeiter, unabhängige Berufsträger, Dienstleister oder Plattformarbeiter?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(241)"
      - frage: "Vermittelt oder bedingt Ihr System den Zugang dieser Selbstständigen oder Plattformarbeiter zu Arbeitsgelegenheiten?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(241)"
      - frage: "Sind die betroffenen Personen zwar selbstständig - aus eigener Entscheidung oder weil Vorschriften es verlangen -, aber fest in eine Organisation eingebunden, für die sie ihre Leistungen erbringen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(239)"
      - frage: "Betrifft Ihr System eine Leitungsaufgabe, nämlich Einstellungsverfahren, Arbeitszuweisung, Überwachung, Bewertung von Mitarbeitern oder Entscheidungen über Beförderung, Bezahlung oder Beendigung?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(240)"
      - frage: "Soll Ihr System den Gefühlszustand von Menschen am Arbeitsplatz erkennen oder daraus Schlüsse ziehen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(242)"
    erfasst:
      - text: "Der persönliche Anwendungsbereich umfasst Beschäftigung, Steuerung von Arbeitskräften und Zugang zu selbstständiger Tätigkeit."
        beleg: "(238)"
      - text: "Kennzeichen eines Arbeitnehmers ist, dass eine Person für eine bestimmte Zeit Leistungen für einen anderen und nach dessen Weisung gegen Bezahlung erbringt."
        beleg: "(239)"
      - text: "Erfasst ist nicht nur der förmliche Arbeitsvertrag, sondern das breitere Spektrum von Vereinbarungen, die Arbeit, Beschäftigung und selbstständige Tätigkeit ausmachen - etwa Selbstständige, die fest in eine Organisation eingebunden sind, für die sie Leistungen erbringen."
        beleg: "(239)"
      - text: "Leitungsaufgaben wie Einstellungsverfahren, Arbeitszuweisung, Überwachung und Mitarbeiterbewertung sowie Entscheidungen über Beförderung, Bezahlung oder Beendigung sind von Nummer 4 erfasst."
        beleg: "(240)"
      - text: "Freie Mitarbeiter, unabhängige Berufsträger, Dienstleister und Plattformarbeiter fallen unabhängig von ihrem Vertragsstatus in den persönlichen Anwendungsbereich, soweit KI-Systeme ihren Zugang zu Arbeitsgelegenheiten vermitteln oder bedingen."
        beleg: "(241)"
      - text: "Zugang zu selbstständiger Tätigkeit ist weiter als Plattformarbeit und umfasst auch Alleinselbstständige, die sich in einer mit Arbeitnehmern vergleichbaren Lage befinden."
        beleg: "(241)"
      - text: "Arbeitsplatz ist weit zu verstehen: jeder bestimmte körperliche oder virtuelle Raum, in dem Menschen Aufgaben und Verantwortlichkeiten erfüllen, die ihnen ihr Arbeitgeber oder die Organisation, der sie angehören, zugewiesen hat - auch bei Selbstständigkeit."
        beleg: "(241)"
    nicht_erfasst:
      - text: "Nicht jedes KI-System, das bei Auswahl, Einstellung oder am Arbeitsplatz eingesetzt wird, ist hochriskant; nur Systeme, die für die Anwendungsfälle in Nummer 4 Buchstabe a oder b bestimmt sind und nicht unter die Ausnahmen des Artikels 6 Absatz 3 fallen (Fußnote 34 zu diesem Absatz)."
        beleg: "(238)"
      - text: "Fällt ein System unter ein Verbot des Artikels 5 - insbesondere das Ableiten von Gefühlen am Arbeitsplatz nach Artikel 5 Absatz 1 Buchstabe f -, gilt nicht die Einstufung als hochriskant, sondern das Verbot: Inverkehrbringen, Inbetriebnahme und Verwendung sind unzulässig, gleichgültig welche Schutzmaßnahmen getroffen wurden."
        beleg: "(242)"
    beispiele: []

  - fundstelle: "KI-VO/anh-III/nr-4-a"
    hauptfrage: "Soll Ihr System dazu dienen, Menschen für eine Stelle oder einen Auftrag zu gewinnen oder auszuwählen - gleichgültig ob es Angestellte oder Selbstständige sind?"
    folgefragen:
      - frage: "Betrifft die Tätigkeit, für die Ihr System bestimmt ist, die Substanz des Einstellungsverfahrens - also vorbereitende Schritte wie gezielte Werbung, Ansprache möglicher Bewerber oder Vorprüfung vor der Bewerbung?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(245)"
      - frage: "Betrifft die Tätigkeit das Auswahlverfahren selbst - engere Auswahl, Benotung, Rangfolge oder Testung von Bewerbern?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(245)"
      - frage: "Sucht Ihr System mögliche Bewerber in Datenbanken oder spricht es sie auf anderem Weg an, bevor ein förmliches Verfahren begonnen hat?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(246)"
      - frage: "Sichtet Ihr System Lebensläufe, sucht es Bewerber oder bildet es eine Rangfolge der Bewerber?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(246)"
      - frage: "Werden mit Ihrem System Selbstständige durch ihren Auftraggeber ausgewählt, bevor sie beauftragt werden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(249)"
      - frage: "Erzeugt Ihr System Eignungswerte, prüft es die Passung des Profils oder der Erfahrung eines Bewerbers zu den Auswahlkriterien oder zur Stellenbeschreibung, oder erstellt es Kompetenzprofile, die über die engere Auswahl mitentscheiden?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(253)"
      - frage: "Analysiert Ihr System Bewerbungen nur beschreibend - etwa Dateiformate umwandeln oder Abschlüsse in Standardkategorien einordnen -, ohne dabei zu bewerten?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(253)"
      - frage: "Schätzt Ihr System Eignung, Verdienst oder Potenzial eines Bewerbers ein - durch Punktwerte, Rangfolge, Vorhersagemodelle oder beschreibende Urteile aus Daten?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(254)"
      - frage: "Beeinflusst die Ausgabe Ihres Systems die Entscheidung merklich - etwa indem sie engere Listen aufstellt, bestimmte Bewerber vorzieht oder Beurteilungen mit Punktwerten versieht -, auch wenn sie die Einstellung nicht unmittelbar bestimmt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(254)"
      - frage: "Zeigt Ihr System ausschließlich Tatsachen ohne eigene Bewertung an, etwa den unveränderten Beschäftigungsverlauf, und erzeugt es keine Einschätzung der Eignung?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(254)"
      - frage: "Platziert Ihr System Stellenanzeigen gezielt bei bestimmten Personen oder Personengruppen?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(250)"
      - frage: "Stützt sich Ihr System bei der gezielten Platzierung von Stellenanzeigen auf Profilbildung, also auf die Auswertung persönlicher Merkmale einzelner Personen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(250)"
      - frage: "Bestimmt Ihr System - auch ohne Profilbildung - in erheblicher Weise, wer Zugang zu Beschäftigungsmöglichkeiten erhält, oder kann es zu einem Diskriminierungsrisiko führen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(250)"
      - frage: "Zeigt die Anzeige aktiv an, dass ein Arbeitgeber Bewerber für eine konkrete offene Stelle sucht?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(251)"
      - frage: "Ergibt sich die Auswahl der Personen, denen die Anzeige gezeigt wird, unmittelbar aus nicht diskriminierenden, sachlichen und vernünftigen Kriterien, die der Stellenbeschreibung selbst innewohnen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(252)"
      - frage: "Platziert Ihr System Stellenanzeigen ausschließlich nach dem Umfeld - etwa nach dem Inhalt der Internetseite, auf der die Anzeige erscheint -, ohne Bezug zu bestimmten Personen oder Personengruppen, und kann die Anzeige jeder sehen, der diese Seite aufruft?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(252)"
      - frage: "Wird Ihr System im Rahmen der Einarbeitung eingesetzt und ist diese Einarbeitung noch ein maßgeblicher Teil des Einstellungsverfahrens - etwa weil der Arbeitgeber vorläufig eingestellte Mitarbeiter noch überprüft?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(248)"
      - frage: "Wird Ihr System erst eingesetzt, nachdem die Person als eingestellt gilt und eine Trennung nur noch über die dafür vorgesehenen Wege möglich wäre?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(248)"
      - frage: "Wird Ihr System vom Bewerber selbst gestartet und geführt, außerhalb der Einflussmöglichkeit des möglichen Arbeitgebers, und gehen die Empfehlungen ausschließlich an den Bewerber?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(254)"
      - frage: "Bewertet oder wählt Ihr System Angebote oder Antworten auf Ausschreibungen aus, und führt dieser Einsatz tatsächlich dazu, dass die selbstständige Person selbst ausgewählt, ausgeschlossen oder bewertet wird statt nur ihr Angebot?"
        bei_ja: "erfasst"
        bei_nein: "nicht_erfasst"
        beleg: "(250)"
    erfasst:
      - text: "Erfasst sind Systeme, deren Tätigkeit die Substanz des Einstellungsverfahrens betrifft oder beeinflusst: vorbereitende Schritte - gezielte Werbung, Ansprache möglicher Bewerber, Vorprüfung vor der Bewerbung - und das Auswahlverfahren - engere Auswahl, Benotung, Rangfolge, Testung."
        beleg: "(245)"
      - text: "Personalgewinnung ist der Vorgang, mit dem ein neues Arbeitsverhältnis vorbereitet wird; er beginnt bereits mit dem Auffinden und Ansprechen möglicher Bewerber und dauert bis zum Vertragsschluss, falls es dazu kommt."
        beleg: "(246)"
      - text: "Erfasst sind frühe Schritte wie das Auffinden möglicher Bewerber in Datenbanken und andere informelle Ansprachen vor dem Beginn eines förmlichen Verfahrens, ebenso die Sichtung von Lebensläufen, die Bewerbersuche und die Rangfolgebildung."
        beleg: "(246)"
      - text: "Systeme, die Einstellungsdaten auswerten, um vorherzusagen, welche Bewerber am erfolgreichsten sein werden, oder die Stellenbeschreibungen erzeugen helfen, fallen unter Nummer 4, wenn sie wirklich zum Bereich der Personalgewinnung gehören und dabei die Berufsaussichten oder Arbeitnehmerrechte in der Substanz beeinflussen."
        beleg: "(247)"
      - text: "Einarbeitung ist erfasst, soweit das Ergebnis des Systems den Zugang zur Arbeit beeinflussen kann und die Einarbeitung ein maßgeblicher Teil des Einstellungsverfahrens ist und nicht erst der erste Schritt danach."
        beleg: "(248)"
      - text: "Die Auswahl von Selbstständigen durch ihre Auftraggeber fällt unter Nummer 4 Buchstabe a, auch wenn es sich nicht um Personalgewinnung im engen Sinn handelt."
        beleg: "(249)"
      - text: "Auswahl erfasst die Prüfung von Bewerbungen, die automatische engere Auswahl, Punktbewertung, Rangfolge und das Zuweisen von Vorhersagewerten zur Eignung für eine Stelle."
        beleg: "(249)"
      - text: "Die in Nummer 4 Buchstabe a genannten Beispiele sind nicht abschließend."
        beleg: "(250)"
      - text: "Stützt sich ein System zur gezielten Platzierung von Stellenanzeigen auf Profilbildung, ist es stets hochriskant, weil Artikel 6 Absatz 3 letzter Unterabsatz Systeme mit Profilbildung von den Ausnahmen ausschließt."
        beleg: "(250)"
      - text: "Auch ohne Profilbildung ist ein solches System hochriskant, wenn es den Zugang zu Beschäftigungsmöglichkeiten in erheblicher Weise bedingt oder zu einem Diskriminierungsrisiko führen kann."
        beleg: "(250)"
      - text: "Die Wörter Bewerbungen prüfen und filtern sind weit zu verstehen; ein System muss nicht beides gleichzeitig tun."
        beleg: "(253)"
      - text: "Erfasst sind Systeme, deren Prüfung von Bewerbungen dazu führen kann, dass der Bewerber beim Zugang zu bestimmten Stellen beschränkt wird - etwa durch Eignungswerte, Passungsbewertung von Profil oder Erfahrung zu Auswahlkriterien oder Stellenbeschreibung oder Kompetenzprofile, die über die engere Auswahl mitentscheiden."
        beleg: "(253)"
      - text: "Prüfung und Filterung bilden ein Kontinuum: eine Prüfung, die den Zugang zu späteren Stufen beeinflusst, wirkt tatsächlich als Filter."
        beleg: "(253)"
      - text: "Bewerten von Bewerbern ist jede Einschätzung von Eignung, Verdienst oder Potenzial - durch Punktwerte, Rangfolge, Vorhersagemodelle oder beschreibende Urteile aus Daten; auch Selbstständige sind einbezogen."
        beleg: "(254)"
      - text: "Es genügt, dass die Bewertung die Entscheidung merklich beeinflusst, etwa durch Aufstellen engerer Listen, Vorziehen bestimmter Bewerber oder Punktbewertung von Beurteilungen; sie muss das Einstellungsergebnis nicht unmittelbar bestimmen."
        beleg: "(254)"
    nicht_erfasst:
      - text: "Arbeitgeberwerbung oder allgemeine Werbung für das Unternehmen, die sich praktisch nicht auf eine offene Stelle bezieht, fällt nicht unter Nummer 4 Buchstabe a; eine Stellenanzeige muss aktiv anzeigen, dass ein Arbeitgeber Bewerber für eine konkrete offene Stelle sucht."
        beleg: "(251)"
      - text: "Ergibt sich die Auswahl der angesprochenen Personen unmittelbar aus nicht diskriminierenden, sachlichen und vernünftigen Kriterien, die der Stellenbeschreibung innewohnen, kann sie von den gezielten Stellenanzeigen ausgenommen sein."
        beleg: "(252)"
      - text: "Das Platzieren von Stellenanzeigen ausschließlich nach Umfeldmerkmalen - etwa dem Inhalt des Ortes, an dem die Anzeige erscheint - ohne unmittelbaren Bezug zu bestimmten Personen oder Personengruppen fällt nicht unter Nummer 4 Buchstabe a; die Anzeige bleibt für jeden sichtbar, der den Ort aufruft, es gibt also keinen Ausschluss."
        beleg: "(252)"
      - text: "Prüft ein System Bewerbungen nur beschreibend, etwa durch Umwandeln von Dateiformaten oder Einordnen von Abschlüssen in Standardkategorien ohne bewertendes Gewicht, kann es als vorbereitende Aufgabe im Sinne des Artikels 6 Absatz 3 Buchstabe d gelten."
        beleg: "(253)"
      - text: "Werkzeuge, die nur Tatsachen ohne bewertendes Gewicht darstellen - etwa Software, die den unveränderten Beschäftigungsverlauf anzeigt -, können außerhalb des Anwendungsfalls liegen, wenn sie keine Einschätzung der Eignung erzeugen."
        beleg: "(254)"
      - text: "Die Personalgewinnung ist abgeschlossen, wenn die Person als eingestellt gilt und eine Trennung nur über die dafür vorgesehenen Wege möglich ist."
        beleg: "(248)"
      - text: "Systeme, die Angebote oder Antworten auf Ausschreibungen auswählen oder bewerten sollen, sind nicht allein deshalb hochriskant, weil sie theoretisch auch das Angebot eines selbstständigen Einzelunternehmers auswählen oder bewerten könnten; dies gilt aber nur, solange der Einsatz nicht tatsächlich zur Auswahl oder zum Ausschluss der selbstständigen Person selbst oder zu deren Bewertung statt der des Angebots führt (Fußnote 44 zu diesem Absatz)."
        beleg: "(250)"
      - text: "Systeme, deren Einsatz der Bewerber selbst beginnt und führt, außerhalb der Einflussmöglichkeit des möglichen Arbeitgebers und außerhalb des Einstellungs- und Auswahlverfahrens, fallen nicht unter Nummer 4 Buchstabe a, wenn die Empfehlungen ausschließlich an den Bewerber gehen."
        beleg: "(254)"
    beispiele:
      - lage: "Ein System erzeugt Stellenbeschreibungen ausschließlich aus einer Liste von Aufgaben und einer Liste notwendiger Qualifikationen und Fähigkeiten, die zuvor ein Mensch festgelegt hat."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfüllt eine enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstabe a, birgt nur begrenzte Risiken und beeinflusst das Bewerbungsverfahren nicht in bedeutsamer Weise."
        beleg: "(247)"
      - lage: "Dasselbe System erzeugt die notwendigen Qualifikationen und Fähigkeiten selbst aus einer groben Beschreibung der Stelle, oder es bewertet zusätzlich die Lebensläufe der Bewerber an der von ihm erstellten Stellenbeschreibung und empfiehlt daraufhin, wer geeignet ist."
        wertung: "hochrisiko"
        begruendung: "Es kann das Bewerbungsverfahren wesentlich beeinflussen und fällt deshalb nicht unter die Ausnahmen."
        beleg: "(247)"
      - lage: "Ein Werkzeug gleicht Bewerber automatisch mit Stellen ab und bildet eine Rangfolge; es verarbeitet Lebensläufe, Fähigkeiten, Bildung, frühere Einsätze sowie kognitive, soziale und emotionale Kompetenzen, vergleicht sie mit Stellenbeschreibungen oder früheren Einstellungsdaten und erzeugt Punktwerte, Ranglisten wie Top 5 und Passungskategorien wie hohe oder geringe Passung. Interne und externe Personalverantwortliche dürfen übersteuern, aber die Rangfolge ist die wichtigste Eingangsgröße der Entscheidung."
        wertung: "hochrisiko"
        begruendung: "Das System prüft und filtert Bewerber; es könnte etwa zu einer niedrigen Einordnung oder zum Ausschluss von Bewerbern eines bestimmten Geschlechts oder von Bewerbern mit Behinderungen führen."
        beleg: "(254)"
      - lage: "Eine Personalvermittlung sucht mit einem Werkzeug in sozialen Netzwerken, Berufsportalen, Stellenbörsen und eigenen Lebenslaufdatenbanken nach Personen, die vorgegebenen Kriterien wie Berufsjahren, technischen Fähigkeiten oder Bildungsweg entsprechen, und erzeugt eine engere Liste möglicher Bewerber oder Auftragnehmer."
        wertung: "hochrisiko"
        begruendung: "Es wirkt unmittelbar und bedeutsam auf Gewinnung und Auswahl von Menschen, indem es Bewerber filtert und auffindet; keine der Ausnahmen des Artikels 6 Absatz 3 greift."
        beleg: "(254)"
      - lage: "Eine Internetplattform, über die Verbraucher selbstständige Dienstleister für verschiedene Aufgaben finden, bildet mit einem Abgleichwerkzeug eine Rangfolge der Dienstleister und bestimmt, welche den Verbrauchern gezeigt werden."
        wertung: "hochrisiko"
        begruendung: "Die Ausgabe bestimmt den Zugang zu künftigen Aufträgen und kann über Laufbahn, Lebensunterhalt und Rechte der Selbstständigen entscheiden."
        beleg: "(254)"
      - lage: "Ein System prüft mit Kameras und Sensoren das Sehvermögen von Pilotenbewerbern, misst etwa Sehschärfe und Reaktionsgeschwindigkeit und bewertet, ob die Schwellenwerte für den Passagierflug erreicht werden; das Ergebnis entscheidet unmittelbar über die Eignung für bestimmte Rollen."
        wertung: "hochrisiko"
        begruendung: "Es wird in Gewinnung und Auswahl eingesetzt, um die Eignung von Bewerbern zu bewerten."
        beleg: "(254)"
      - lage: "Ein System bewertet schriftliche oder mündliche Antworten von Bewerbern in einer Online-Prüfung, gibt jedem eine Punktzahl nach sprachlichen und inhaltlichen Kriterien und erzeugt daraus eine Rangfolge, die bestimmt, wer zum Gespräch eingeladen wird."
        wertung: "hochrisiko"
        begruendung: "Es übernimmt eine zentrale bewertende Aufgabe und beeinflusst die Substanz von Gewinnung und Auswahl in bedeutsamer Weise."
        beleg: "(254)"
      - lage: "Ein Wirtschaftsunternehmen setzt ein System zur Unterstützung der Gewinnung von Auszubildenden ein; es verwaltet und bearbeitet Bewerbungen, sichtet Lebensläufe, ordnet Bewerber Rollen zu oder erzeugt engere Listen anhand vorgegebener Kriterien wie Qualifikation oder Alter."
        wertung: "hochrisiko"
        begruendung: "Obwohl eine Ausbildung Lernanteile hat, wird das System im Rahmen der Einstellung für ein förmliches Arbeitsverhältnis eingesetzt."
        beleg: "(254)"
      - lage: "Ein System platziert Stellenanzeigen gezielt bei bestimmten Nutzern sozialer Medien; es sammelt und analysiert Nutzungsmuster und Nutzermerkmale, erhält von den Werbenden Zielkriterien wie Alter, Bildung, Berufserfahrung oder Branche und bestimmt und priorisiert daraufhin mögliche Zielgruppen - über ein blosses Abgleichen von Anforderungen wie Berufszulassung oder Ort hinaus."
        wertung: "hochrisiko"
        begruendung: "Es bestimmt über gezielte Werbung den Zugang zu Beschäftigungsmöglichkeiten und kann wesentlich beeinflussen, welche Bewerber überhaupt von offenen Stellen erfahren."
        beleg: "(254)"
      - lage: "Eine Arbeitsvermittlung ordnet mit einem System Bewerber offenen Stellen zu: es verarbeitet Bewerberdaten aus Lebensläufen wie Fähigkeiten, Bildungsweg und frühere Berufserfahrung sowie auf Arbeitgeberseite Stellenanforderungen, Berufsklassifikationen und Arbeitsmarktdaten und erzeugt Empfehlungen, indem es Bewerber für bestimmte Stellen in eine Rangfolge bringt oder Jobsuchenden passende Stellen vorschlägt; die Sachbearbeiter stützen sich bei großen Bewerbermengen stark darauf."
        wertung: "hochrisiko"
        begruendung: "Die Empfehlungen wirken sich unmittelbar darauf aus, welche Bewerber Arbeitgebern vorgeschlagen und welche Stellen Jobsuchenden gezeigt werden."
        beleg: "(254)"
      - lage: "Ein System führt Hintergrundprüfungen von Bewerbern durch: es bündelt amtliche Nachweise, Beschäftigungsverlauf, Verlauf in sozialen Netzwerken sowie - soweit rechtlich zulässig - Kredit- und Finanzdaten mit offen zugänglichen Internetinformationen und gibt zusammengesetzte Risikowerte, Kategorien wie geringes, mittleres oder hohes Risiko oder Hinweise auf auffällige Punkte aus; in Verfahren mit hohen Bewerberzahlen werden damit Bewerber vor der menschlichen Prüfung zurückgestellt oder ausgeschlossen."
        wertung: "hochrisiko"
        begruendung: "Die Ausgabe beeinflusst in der Praxis stark, wer weiterkommt, und damit die Berufsaussichten wesentlich; weil das System Profilbildung vornimmt, kann es die Ausnahmen des Artikels 6 Absatz 3 nicht nutzen."
        beleg: "(254)"
      - lage: "Ein System erkennt ausschließlich nicht inklusive oder diskriminierende Formulierungen in Anzeigentexten; die Erkennungslogik beruht auf Mustern und Begriffen, die Menschen festgelegt und geprüft haben, und das System markiert mögliche problematische Wendungen."
        wertung: "kein_hochrisiko"
        begruendung: "Es ist nicht dazu bestimmt, Menschen zu gewinnen oder auszuwählen, auch wenn es im weiten Beschäftigungsbereich arbeitet."
        beleg: "(254)"
      - lage: "Ein System platziert Arbeitgeberwerbung, die das Unternehmen als attraktiven Arbeitsplatz darstellt - etwa Unternehmenskultur, Zusatzleistungen oder Entwicklungsmöglichkeiten -, ist an keine konkrete offene Stelle gebunden, ist nicht diskriminierend und optimiert die Platzierung nach Kennzahlen wie Seitenaufrufen, Beteiligungsraten oder allgemeiner Bevölkerungsstruktur."
        wertung: "kein_hochrisiko"
        begruendung: "Es beschränkt sich auf Arbeitgeberwerbung und betrifft keine bestimmten offenen Stellen."
        beleg: "(254)"
      - lage: "Ein Unternehmen durchsucht mit einem System Internetplattformen und soziale Medien nach Äußerungen über sich als Arbeitgeber, um das eigene Ansehen zu verfolgen und allgemeine Entwicklungen in der Wahrnehmung durch mögliche Bewerber zu erkennen; einzelne Beiträge oder einzelne Nutzer werden nicht ausgewertet oder verfolgt, die Daten werden bei der Erhebung anonymisiert."
        wertung: "kein_hochrisiko"
        begruendung: "Das System ist nicht dazu bestimmt, Menschen unmittelbar zu gewinnen oder auszuwählen, auch wenn das Ansehen des Arbeitgebers mittelbar mit der Personalgewinnung zusammenhängt."
        beleg: "(254)"
      - lage: "Ein System unterstützt die Einarbeitung neuer Mitarbeiter mit persönlich zugeschnittenen Hinweisen zu Unternehmensregeln und Schulungsplänen und beantwortet häufige Fragen."
        wertung: "kein_hochrisiko"
        begruendung: "Es unterstützt interne Personalabläufe nach der Einstellung und beeinflusst weder Gewinnung oder Auswahl noch in irgendeiner Weise den Zugang zur Arbeit; es kann jedoch unter Nummer 4 Buchstabe b fallen, wenn es die Bedingungen des Arbeitsverhältnisses betrifft, in Leistungsbewertungen einfließt oder Mitarbeiter überwacht."
        beleg: "(254)"
      - lage: "Ein System hilft Bewerbern, ihren Lebenslauf auf eine bestimmte offene Stelle zuzuschneiden: es prüft den Lebenslauf und die vom Bewerber selbst bereitgestellte Stellenbeschreibung und empfiehlt Änderungen, um die Einladungschance zu erhöhen; die Empfehlungen gehen ausschließlich an den Bewerber."
        wertung: "kein_hochrisiko"
        begruendung: "Der Einsatz wird vom Bewerber begonnen und geführt, liegt außerhalb der Einflussmöglichkeit des möglichen Arbeitgebers und findet außerhalb des Einstellungs- und Auswahlverfahrens statt."
        beleg: "(254)"
      - lage: "Ein System hilft Bewerbern, die beste verfügbare Stelle zu finden: es prüft offene Stellen und die vom Bewerber angegebenen Fähigkeiten, Erfahrungen und Erwartungen, bildet daraus eine Rangfolge der Stellen und empfiehlt die passendsten; die Empfehlungen gehen ausschließlich an den Bewerber."
        wertung: "kein_hochrisiko"
        begruendung: "Der Einsatz wird vom Bewerber begonnen und geführt, liegt außerhalb der Einflussmöglichkeit des möglichen Arbeitgebers und findet außerhalb des Einstellungs- und Auswahlverfahrens statt."
        beleg: "(254)"
      - lage: "Ein System prüft Berufszulassungen von Bewerbern gegen amtliche Register, etwa die vom Bewerber angegebene Kammermitgliedsnummer gegen die Register der Kammern; die Ausgabe ist tatsächlich und lautet bestätigt oder nicht bestätigt, Auffälligkeiten gehen zur Nachprüfung an die Personalabteilung oder die Rechtsabteilung."
        wertung: "kein_hochrisiko"
        begruendung: "Es fällt in den Anwendungsfall, prägt aber die Auswahl über die tatsächliche Bestätigung hinaus nicht wesentlich und erfüllt eine klar umschriebene, begrenzte Funktion; es ist deshalb eine enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(254)"
      - lage: "Ein System erkennt Angaben in eingegangenen Lebensläufen und ordnet sie in einer internen Datenbank, die Personalverantwortliche durchsuchen können."
        wertung: "kein_hochrisiko"
        begruendung: "Es erfüllt eine klar umschriebene, begrenzte Funktion und wirkt sich nicht wesentlich auf Gewinnung oder Auswahl des Bewerbers aus; es fällt unter die Ausnahme des Artikels 6 Absatz 3 Buchstabe d."
        beleg: "(254)"
      - lage: "Ein System plant Vorstellungsgespräche: es greift auf die Kalenderwerkzeuge des Unternehmens und die von den Bewerbern angegebenen Zeitwünsche zu, schlägt Termine nach gegenseitiger Verfügbarkeit und Randbedingungen wie Zeitzonen oder maximaler Zahl täglicher Gespräche vor, versendet Erinnerungen und nimmt angegebene Barrierefreiheitsbedarfe wie Gebärdensprachdolmetschung, verlängerte Gesprächsdauer oder andere Kommunikationsformen auf."
        wertung: "kein_hochrisiko"
        begruendung: "Der Zweck ist rein organisatorisch; das System trägt nicht zur Auswahl bei und löst oder beeinflusst keine beschäftigungsbezogene Bewertung; enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(254)"
      - lage: "Ein System prüft menschliche Muster bei früheren Einstellungsentscheidungen: es wertet anonymisierte Daten wie Lebenslaufbewertungen, Gesprächsnotizen und Einstellungsergebnisse statistisch aus, um mögliche Verzerrungen oder Widersprüche zu erkennen; es nimmt an laufenden Verfahren nicht teil, beeinflusst keine aktuellen Bewerberbewertungen und bewertet oder entscheidet nicht anhand bestimmbarer persönlicher Merkmale von Personalverantwortlichen oder Bewerbern."
        wertung: "kein_hochrisiko"
        begruendung: "Es fällt in den Anwendungsfall, nutzt aber die Ausnahme des Artikels 6 Absatz 3 Buchstabe c für Systeme, die Entscheidungsmuster oder Abweichungen davon erkennen sollen, ohne abgeschlossene menschliche Bewertungen zu ersetzen oder zu beeinflussen."
        beleg: "(254)"
      - lage: "Ein System versendet persönlich zugeschnittene Eingangsbestätigungen per E-Mail mit Namen und Anrede der Person, die sich beworben hat."
        wertung: "kein_hochrisiko"
        begruendung: "Es beeinflusst die Aussicht auf Auswahl in keiner Weise; enge Verfahrensaufgabe nach Artikel 6 Absatz 3 Buchstabe a."
        beleg: "(254)"

  - fundstelle: "KI-VO/anh-III/nr-4-b"
    hauptfrage: "Soll Ihr System in einem bereits bestehenden Arbeits- oder Auftragsverhältnis eingesetzt werden - um über die Bedingungen, über Beförderung oder Beendigung zu entscheiden, Aufgaben zuzuweisen oder Leistung und Verhalten zu überwachen oder zu bewerten?"
    folgefragen:
      - frage: "Wird Ihr System erst nach Gewinnung und Auswahl eingesetzt, also während des laufenden Arbeits- oder Auftragsverhältnisses bis zu seinem Ende?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(256)"
      - frage: "Entscheidet Ihr System selbst, oder trifft ein Mensch die Entscheidung förmlich, stützt sich dabei aber erheblich auf die Ausgabe Ihres Systems?"
        bei_ja: "weiter"
        bei_nein: "nicht_erfasst"
        beleg: "(258)"
      - frage: "Betrifft die Entscheidung grundlegende Bestandteile des Arbeitsvertrags oder Arbeitsverhältnisses, also Bedingungen wie Entgeltansprüche, Arbeitszeitgestaltung, Urlaubsansprüche oder Ruhezeiten?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(259)"
      - frage: "Berührt die Entscheidung in erheblicher Weise, ob der Arbeitnehmer wesentliche Rechte und Pflichten aus dem Vertrag oder Verhältnis wahrnehmen kann - etwa die Ablehnung eines Urlaubsantrags oder eine erhebliche Änderung der regelmäßigen Arbeitszeit?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(259)"
      - frage: "Ist es eine alltägliche Betriebs- oder Organisationsentscheidung innerhalb der bestehenden Bedingungen, die die Rechte und Pflichten aus dem Vertrag nicht wesentlich verändert - etwa die Zuteilung von Büroräumen oder die Lage von Pause und Mittagszeit innerhalb einer zugeteilten Schicht, ohne dass sich die Gesamtdauer von Pause und Mittagszeit ändert?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(262)"
      - frage: "Betrifft Ihr System eine Beförderung, also das Heben von Stufe, Verantwortung, Entgelt oder Zugang zur beruflichen Entwicklung - oder ein Unterlassen, das im Zusammenhang einer Beförderung gleichkommt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(263)"
      - frage: "Betrifft Ihr System die Beendigung, also einen Akt oder ein Unterlassen des Arbeitgebers, der das Verhältnis beendet oder die Person der wesentlichen damit verbundenen Rechte und Vorteile beraubt?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(263)"
      - frage: "Geht es um Kündigung, Stellenabbau oder die Nichtverlängerung eines befristeten Vertrags, wobei die Entscheidung zur Nichtverlängerung von Ihrem System getrieben wird?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(264)"
      - frage: "Sperrt Ihr System ein Plattformkonto endgültig, oder führt es zu langen oder häufigen Sperrungen des Zugangs zur Plattform?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(265)"
      - frage: "Hält Ihr System lediglich fest, dass ein befristeter Vertrag demnächst ausläuft, und meldet dies der zuständigen Führungskraft - ohne Ermessen, ohne eigene Bewertung und ohne eine Entscheidung vorzuschlagen?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(266)"
      - frage: "Weist Ihr System einzelne Aufgaben zu?"
        bei_ja: "weiter"
        bei_nein: "weiter"
        beleg: "(269)"
      - frage: "Stützt sich die Aufgabenzuweisung auf individuelles Verhalten oder persönliche Eigenschaften oder Merkmale - etwa Daten aus Persönlichkeitstests, Verhaltensbewertungen oder abgeleitete Produktivitätsmerkmale?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(269)"
      - frage: "Verwendet Ihr System bei der Aufgabenzuweisung Verhaltenskennzahlen wie Pünktlichkeit, Reaktionsbereitschaft auf Kundenanfragen, Zuverlässigkeitswerte oder Leistungsbewertungen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(270)"
      - frage: "Betrifft das verwendete Merkmal persönliche Eigenschaften oder die soziale Identität des Arbeitenden - statt neutraler, sachlicher und äußerer Umstände, die die Ausführung der verlangten Aufgaben unmöglich machen, etwa Nichtverfügbarkeit oder ein unpassender Ort?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(271)"
      - frage: "Stützt sich Ihr System bei der Aufgabenzuweisung ausschließlich auf sachliche, neutrale und äußere Kriterien, die unmittelbar an die Anforderungen der Arbeit gebunden sind - etwa die von den Arbeitenden selbst in Planungswerkzeugen angegebene Verfügbarkeit, eine erforderliche Berufsberechtigung wie einen Gabelstaplerschein oder eine Kammerzulassung, oder die räumliche Nähe zum Lieferort?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(272)"
      - frage: "Können diese sachlichen Kriterien in Ihrem Fall als Ersatzmerkmal für Staatsangehörigkeit oder ethnische Herkunft wirken?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(272)"
      - frage: "Überwacht oder bewertet Ihr System die Leistung oder das Verhalten von Arbeitenden regelmäßig und planmäßig - auch während einer Probezeit und auch dann, wenn damit keine förmlich vereinbarte Vertragsbedingung wie Entgelt oder Arbeitszeit berührt wird?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(274)"
      - frage: "Misst Ihr System Leistung in Mengen - etwa die Zahl erledigter Aufgaben oder die Ausgabegeschwindigkeit - oder in Qualität, etwa die Güte der Arbeit?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(275)"
      - frage: "Erzeugt Ihr System Rückmeldungswerte, Leistungseinschätzungen, Beurteilungen oder Ranglisten, die unmittelbar in die Personalakte einfließen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(275)"
      - frage: "Erfasst Ihr System Verhalten wie Pünktlichkeit, die tatsächliche oder voraussichtliche Einhaltung von Regeln am Arbeitsplatz, die Reaktionsbereitschaft gegenüber Kunden, Umgangsmuster mit Kollegen oder gewerkschaftliches Engagement?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(276)"
      - frage: "Bewertet Ihr System Arbeitende - gegebenenfalls herabstufend - dafür, dass sie Schichten selten annehmen oder Aufgaben ablehnen?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(276)"
      - frage: "Setzt der Arbeitgeber Ihr System ausschließlich ein, um äußere rechtliche oder aufsichtsrechtliche Pflichten zu erfüllen - etwa die Protokollierung von Geschäften wegen der Regeln gegen Marktmissbrauch - und wird es auch nicht zur Leistungs- oder Verhaltensbewertung genutzt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(277)"
      - frage: "Setzen Sie Ihr System rein und ausschließlich aus medizinischen Gründen, aus Sicherheitsgründen oder zum Schutz von Eigentum und Firmenvermögen ein?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(277)"
      - frage: "Unterstützt Ihr System die Arbeitenden bei der Erledigung ihrer Aufgaben, ohne darauf ausgelegt zu sein, sie zu zusätzlicher Produktivität zu drängen - etwa durch automatische Hinweise, damit Angaben oder Waren nicht an falsche Empfänger gehen -, und gehen diese Hinweise ausschließlich an die Arbeitenden selbst und nicht an den Arbeitgeber oder an andere Personen in dessen Organisation?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(278)"
      - frage: "Teilt Ihr System Leistungsdaten - etwa zusammengefasste Verkaufszahlen im Vergleich zum Firmendurchschnitt - ausschließlich den Arbeitenden selbst mit?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(278)"
      - frage: "Bewertet Ihr System die Leistung in Schulungen, und fließt diese Bewertung in Leistungsbeurteilungen, in die weitere Beschäftigungsfähigkeit oder in die Eignung für höhere Stufen ein?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(261)"
      - frage: "Geht es um freiwillige oder zusätzliche Schulung, auf die kein Anspruch besteht und für die keine gesetzliche oder tarifliche Pflicht gilt?"
        bei_ja: "nicht_erfasst"
        bei_nein: "weiter"
        beleg: "(261)"
      # Diese Frage nennt einen ZUSAETZLICHEN Fall der Leistungsueberwachung,
      # keine Ausnahme: Absatz (275) zaehlt auf, was alles unter Leistung
      # faellt. Stand hier bei_nein auf nicht_erfasst, warf ein Nein jeden
      # Fall der Arbeitnehmerueberwachung aus dem Punkt - gemessen traf
      # Nummer 4 Buchstabe b dadurch praktisch nie, obwohl fuenf andere
      # Fragen zuvor erfasst ergeben hatten.
      - frage: "Misst Ihr System körperliche Werte wie Muskelbewegung, Ermüdung, Hirnwellen oder Herzfrequenz, und werden diese Werte zur Überwachung oder Bewertung der Leistung verwendet?"
        bei_ja: "erfasst"
        bei_nein: "weiter"
        beleg: "(275)"
    erfasst:
      - text: "Erfasst sind Systeme, die nach Gewinnung und Auswahl eingesetzt werden und die Ausübung bestimmter Leitungsrechte sowie die Organisation der Arbeit über die gesamte Dauer des Arbeits- oder - bei Selbstständigen - Vertragsverhältnisses bis zu seiner Beendigung betreffen."
        beleg: "(256)"
      - text: "Entscheidung ist funktional zu verstehen: jeder dem Arbeitgeber zurechenbare Akt oder jedes Unterlassen, das wesentliche Wirkungen auf die vertragliche Stellung des Arbeitenden, auf das Verhältnis oder auf die Art und Weise seiner Arbeit hat; sie ist nicht auf einseitige Vertragsänderungen im engen Sinn beschränkt."
        beleg: "(258)"
      - text: "Zum Entscheiden gehören sowohl Fälle, in denen das System selbst automatisiert entscheidet, als auch Fälle, in denen ein Mensch förmlich entscheidet, sich dabei aber erheblich auf die Ausgabe des Systems stützt."
        beleg: "(258)"
      - text: "Bedingungen des Arbeitsverhältnisses sind die grundlegenden Bestandteile des Vertrags oder Verhältnisses, ohne die oder bei deren anderer Gestaltung eine oder beide Seiten möglicherweise nicht zugestimmt hätten; dazu gehören Arbeitsbedingungen wie Entgeltansprüche, Arbeitszeitgestaltung, Urlaubsansprüche und Ruhezeiten."
        beleg: "(259)"
      - text: "Erfasst sind auch Festlegungen, die die Wahrnehmung der Rechte und Pflichten aus diesen grundlegenden Bestandteilen wesentlich berühren, etwa die Ablehnung eines Urlaubsantrags oder eine erhebliche Änderung der regelmäßigen Arbeitszeit."
        beleg: "(259)"
      - text: "Arbeitsverhältnisse umfassen auch selbstständige Tätigkeit, einschließlich der Vertragsverhältnisse von Selbstständigen, die Leistungen über Plattformen erbringen, und anderer Alleinselbstständiger in einer mit Arbeitnehmern vergleichbaren Lage."
        beleg: "(260)"
      - text: "Schulung wird rechtlich bedeutsam, wenn Abschluss oder Bewertung zur Bedingung für Aufstieg oder Beförderung gemacht wird oder anderweitig mit Entgelt, Stufe oder weiterer Beschäftigungsfähigkeit und dem Erhalt des Arbeitsplatzes verknüpft ist; bewertet ein System die Leistung in Schulungsmodulen und fließt diese Bewertung in Leistungsbeurteilungen, die weitere Beschäftigungsfähigkeit oder die Eignung für höhere Stufen ein, fällt es unter Nummer 4 Buchstabe b."
        beleg: "(261)"
      - text: "Beförderung ist jeder dem Arbeitgeber zurechenbare Akt oder jedes Unterlassen, der die Stellung des Arbeitenden durch Heben von Stufe, Verantwortung, Entgelt oder Zugang zur beruflichen Entwicklung berührt, sowie jedes Element, das im Zusammenhang einer tatsächlichen Beförderung gleichkommt."
        beleg: "(263)"
      - text: "Beendigung ist jeder dem Arbeitgeber zurechenbare Akt oder jedes Unterlassen, der das Arbeitsverhältnis oder ein anderes Vertragsverhältnis beendet oder die Person der wesentlichen damit verbundenen Rechte und Vorteile beraubt."
        beleg: "(263)"
      - text: "Beendigung ist der endgültige, unwiderrufliche Endpunkt des Verhältnisses; sie umfasst Kündigung, Stellenabbau und die Nichtverlängerung befristeter Verträge, wenn die Entscheidung zur Nichtverlängerung vom System getrieben ist, sowie jeden Akt mit gleichwertiger Wirkung; nicht endgültige Formen der Entfernung von der Arbeit können wesentliche Änderungen der Bedingungen sein und damit ebenfalls erfasst werden."
        beleg: "(264)"
      - text: "Sperrt ein System ein Plattformkonto endgültig, nimmt es der Person den Zugang zu ihrer beruflichen Tätigkeit, unabhängig von der Vertragsform; lange oder häufige Sperrungen des Zugangs können gleiche Wirkungen haben."
        beleg: "(265)"
      - text: "Erfasst ist jede einzelne Aufgabenzuweisung, die auf individuellem Verhalten oder persönlichen Eigenschaften oder Merkmalen beruht; dazu können Daten aus Persönlichkeitstests, Verhaltensbewertungen oder abgeleitete Produktivitätsmerkmale gehören."
        beleg: "(269)"
      - text: "Verhaltenskennzahlen wie Pünktlichkeit, Reaktionsbereitschaft auf Kundenanfragen, Zuverlässigkeitswerte oder Leistungsbewertungen fallen unter persönliche Eigenschaften oder Merkmale."
        beleg: "(270)"
      - text: "Die Trennlinie verläuft danach, ob das Merkmal die persönlichen Eigenschaften oder die soziale Identität des Arbeitenden betrifft oder aber neutrale, sachliche und äußere Umstände, die die Ausführung der verlangten Aufgaben unmöglich machen, etwa Nichtverfügbarkeit oder ein unpassender Ort."
        beleg: "(271)"
      - text: "Überwachen und Bewerten sind eine eigenständige Hochrisikokategorie; die Voraussetzungen stehen alternativ zueinander und erfassen Systeme, die Leistung oder Verhalten planmäßig überwachen oder bewerten sollen - auch während einer Probezeit und unabhängig davon, ob dies eine förmlich vereinbarte Vertragsbedingung wie Entgelt oder Arbeitszeit berührt."
        beleg: "(274)"
      - text: "Leistung umfasst Mengenmaße wie die Zahl erledigter Aufgaben oder die Ausgabegeschwindigkeit sowie Qualitätsmaße wie die Güte der Arbeit; erfasst sind auch Rückmeldungswerte, Leistungseinschätzungen, Beurteilungen und Ranglisten, die unmittelbar in die Personalakte einfließen; Systeme, die körperliche Werte wie Muskelbewegung, Ermüdung, Hirnwellen oder Herzfrequenz messen, können hochriskant sein, wenn diese Werte zur Überwachung oder Bewertung der Leistung verwendet werden (Fußnote 56 zu diesem Absatz)."
        beleg: "(275)"
      - text: "Verhalten kann Pünktlichkeit, die tatsächliche oder voraussichtliche Einhaltung von Regeln am Arbeitsplatz einschließlich Risikoprofilen von Beschäftigten, die Reaktionsbereitschaft gegenüber Kunden, Umgangsmuster mit Kollegen und gewerkschaftliches Engagement umfassen; ein System, das Arbeitende für niedrige Annahmeraten von Schichten oder für das Ablehnen von Aufgaben bewertet und gegebenenfalls herabstuft, bewertet Verhalten."
        beleg: "(276)"
    nicht_erfasst:
      - text: "Nicht jede alltägliche Leitungs- oder Organisationsanpassung ist eine Entscheidung über die Bedingungen des Arbeitsverhältnisses; die Entscheidung muss eine Schwelle der Erheblichkeit erreichen, und Festlegungen, die die Rechte oder Pflichten aus dem zugrunde liegenden Vertrag oder Verhältnis nicht wesentlich verändern, sind nicht erfasst - dazu gehören einzelne Betriebsentscheidungen von Führungskräften im Rahmen dieser Bedingungen, etwa die Zuteilung von Büroräumen sowie die Lage von Pause und Mittagszeit innerhalb einer zugeteilten Schicht, solange sich die Gesamtdauer von Pause und Mittagszeit nicht ändert."
        beleg: "(262)"
      - text: "Freiwillige oder zusätzliche Schulung ohne Anspruch und ohne gesetzliche oder tarifliche Pflicht fällt nicht ohne weiteres unter Nummer 4 Buchstabe b."
        beleg: "(261)"
      - text: "Hält ein System lediglich fest, dass ein befristeter Vertrag demnächst ausläuft, und meldet dies der zuständigen Führungskraft - ohne Ermessen, ohne eigene Bewertung und ohne eine Entscheidung vorzuschlagen -, folgt das Ergebnis aus dem Vertrag selbst und nicht aus einer Entscheidung des Systems; es verändert die Rechte des Arbeitenden nicht in der Substanz und ist nicht als hochriskant anzusehen."
        beleg: "(266)"
      - text: "Aufgabenzuweisungssysteme, die sich ausschließlich auf sachliche, neutrale und äußere Kriterien stützen, die unmittelbar an die Anforderungen der Arbeit gebunden sind, fallen nicht unter Nummer 4 Buchstabe b - etwa Zuweisung nach der von den Arbeitenden selbst in Planungswerkzeugen angegebenen Verfügbarkeit, nach dem Besitz einer erforderlichen Berufsberechtigung wie eines Gabelstaplerscheins oder einer Kammerzulassung, oder nach räumlicher Nähe zum Lieferort; solche Kriterien dürfen kein Ersatzmerkmal für Staatsangehörigkeit oder ethnische Herkunft sein."
        beleg: "(272)"
      - text: "Systeme, die der Arbeitgeber ausschließlich einsetzt, um äußere rechtliche oder aufsichtsrechtliche Pflichten zu erfüllen - etwa die Protokollierung von Geschäften wegen der Regeln gegen Marktmissbrauch -, überwachen oder bewerten nicht die Leistung oder das Verhalten einer Person zu Beschäftigungszwecken, solange sie auch nicht zu diesem Zweck verwendet werden."
        beleg: "(277)"
      - text: "Ebenfalls außerhalb liegen Systeme, die rein und ausschließlich aus medizinischen Gründen, aus Sicherheitsgründen oder zum Schutz von Eigentum und Firmenvermögen eingesetzt werden."
        beleg: "(277)"
      - text: "Systeme, die Verhalten oder Leistung überwachen, um die Arbeitenden bei ihren Aufgaben zu unterstützen, ohne darauf ausgelegt zu sein, sie zu zusätzlicher Produktivität zu drängen - etwa indem sie durch automatische Hinweise verhindern, dass Angaben oder Waren an falsche Empfänger gehen -, sind nicht hochriskant, sofern die Hinweise ausschließlich an die Arbeitenden selbst gehen und nicht an den Arbeitgeber oder an andere Personen in dessen Organisation."
        beleg: "(278)"
      - text: "Ebenso sind Systeme nicht hochriskant, die Leistungsdaten übermitteln - etwa zusammengefasste Daten erfolgreicher Verkaufsgeschäfte im Vergleich zum Firmendurchschnitt - und sie ausschließlich den Arbeitenden selbst mitteilen."
        beleg: "(278)"
    beispiele:
      - lage: "Ein Handels- und Logistikunternehmen setzt einen Planer ein, der Schichten, Ruhezeiten und Rufbereitschaftsfenster zuweist; Eingangsgrößen sind unter anderem Verhaltens- und Leistungssignale wie Pünktlichkeit, Nichterscheinen in der Vergangenheit, Annahme- und Ablehnungsraten angebotener Schichten sowie Bewertungen von Kunden und Führungskräften. Der Planer bringt die Arbeitenden für jeden Platz in eine Rangfolge und weist Schichten selbst zu, wobei die leistungsstärksten Personen die wichtigsten Schichten erhalten; niedriger eingeordnete Personen erhalten weniger wichtige und möglicherweise weniger Schichten, geringeres veränderliches Entgelt und unbeständigere Muster, und wer vorrangige Angebote ablehnt, wird in der Priorität herabgestuft."
        wertung: "hochrisiko"
        begruendung: "Das System bewertet Leistung und Verhalten der Arbeitenden und weist auf dieser Grundlage Aufgaben zu; der Einsatz berührt Entgelt, Zugang zu vorrangigen Aufgaben und möglicherweise den Aufstieg, so dass die Ausnahmen des Artikels 6 Absatz 3 nicht greifen."
        beleg: "(278)"
      - lage: "Eine Nachhilfeplattform verwaltet mit einem System die Konten selbstständiger Lehrkräfte; Eingangsgrößen sind Zufriedenheitsbewertungen der Schüler, Abschlussquoten der Stunden und Pünktlichkeitsprotokolle aus dem Videosystem. Daraus bildet das System einen Leistungswert; fällt er drei Wochen hintereinander unter vier von fünf, sperrt das System das Konto automatisch für einen Monat, halten die niedrigen Bewertungen in einem weiteren Prüfzeitraum an, wird das Konto dauerhaft abgeschaltet - die Lehrkräfte können dann keine Stunden mehr annehmen."
        wertung: "hochrisiko"
        begruendung: "Die Wirkung ist die tatsächliche Beendigung des Arbeitsverhältnisses; Beendigung ist inhaltlich zu verstehen und umfasst jede Entscheidung, die den Arbeitenden die weitere Beschäftigung nimmt."
        beleg: "(278)"
      - lage: "Eine Anwaltskanzlei verteilt mit einem System die Arbeitslast unter den angestellten Anwälten; es verarbeitet Daten zu abgerechneten Stunden, Bearbeitungszeiten früherer Mandate, Reaktionsbereitschaft auf E-Mails und freiwilliger Teilnahme an Kanzleiaktivitäten wie Schulungen oder Mandantengewinnung und fasst diese Verhaltensdaten zu einem Wert zusammen, der die Grundlage für die Zuweisung von Mandaten bildet."
        wertung: "hochrisiko"
        begruendung: "Das System weist Aufgaben anhand des individuellen Verhaltens zu und berührt damit wesentlich sowohl die gegenwärtigen Arbeitsbedingungen als auch die langfristigen Berufswege."
        beleg: "(278)"
      - lage: "Eine Fahrdienstplattform setzt ein System ein, um die Vergütung der Fahrer laufend festzulegen; Eingangsgrößen sind die aktuelle Nachfrage, Annahmeraten der Fahrer, Bewertungen der Fahrgäste und durchschnittliche Fahrtzeiten. Das System berechnet Fahrtpreise und verändert die Entgeltfaktoren einzelner Fahrer: wer dauerhaft schlechter bewertet wird oder langsamer fährt, erhält einen geringeren Faktor, hoch bewertete Fahrer erhalten Zuschläge. Die Anpassungen erfolgen automatisch in Echtzeit; eine menschliche Aufsicht besteht förmlich, in der Praxis bestimmt aber allein der Algorithmus die Entgelthöhe, und Beschwerden ändern die Ergebnisse selten."
        wertung: "hochrisiko"
        begruendung: "Entscheidungen über die Vergütung gehören zu den Bedingungen eines Arbeitsverhältnisses."
        beleg: "(278)"
      - lage: "Eine öffentliche Verwaltung weist mit einem System erfolgreiche Bewerber wie Lehrkräfte oder Ärzte nach einem bestandenen Auswahlverfahren bestimmten Stellen zu; es berücksichtigt Prüfungsergebnisse, Ortswünsche, freie Stellen und Dienstalter und erzeugt endgültige Zuweisungslisten, die bestimmen, wer welche Stelle erhält. Beschwerden sind möglich, in der Praxis ist die Zuweisung des Systems aber entscheidend, weil die Verwaltung sich bei der endgültigen Besetzung darauf stützt."
        wertung: "hochrisiko"
        begruendung: "Das System wird zur Zuweisung von Rollen im öffentlichen Dienst eingesetzt und bestimmt unmittelbar und bedeutsam die Arbeitsbedingungen und Berufswege der Bediensteten."
        beleg: "(278)"
      - lage: "Ein Kurier- und Versandunternehmen verfolgt mit einem System Versanddaten und erkennt mögliche Fehler bei der Beschriftung oder Störungen in der Verteilung; es prüft Inhalte von Etiketten, beobachtet Pakete auf dem Weg und erkennt Abweichungen zwischen erwarteter und tatsächlicher Route. Erkennt es eine Abweichung, benachrichtigt es ausschließlich den zuständigen Mitarbeiter, der dann die nötigen Schritte zur Berichtigung einleitet."
        wertung: "kein_hochrisiko"
        begruendung: "Zweck ist ein störungsfreier Arbeitsablauf und die Einhaltung vertraglicher Pflichten; das System unterstützt die Arbeitenden bei ihren Aufgaben statt ihre Leistung zu bewerten, die Überwachung ist nur beiläufig - vorausgesetzt, es ist nicht auch zur Leistungsbeurteilung bestimmt."
        beleg: "(278)"
      - lage: "Ein Unternehmen bewertet mit einem System den Fortschritt der Beschäftigten in freiwilligen Schulungsmodulen anhand von Testergebnissen und Abschlussdaten; es gibt ausschließlich Rückmeldungen und Lernempfehlungen an die Beschäftigten selbst, um deren persönliche Entwicklung zu unterstützen."
        wertung: "kein_hochrisiko"
        begruendung: "Die Funktion beschränkt sich darauf, Lernergebnisse in einem Schulungszusammenhang zu messen; sie beurteilt nicht die Arbeitsleistung, bestimmt keine Beförderungen und prägt keine Leitungsentscheidungen."
        beleg: "(278)"
      - lage: "Ein Unternehmen optimiert mit einem Buchungswerkzeug die Verteilung von Arbeitsplätzen in einem gemischt genutzten Büro, indem es Reservierungen der Beschäftigten mit freien Schreibtischen oder Besprechungsräumen zusammenbringt."
        wertung: "kein_hochrisiko"
        begruendung: "Es organisiert körperliche Arbeitsmittel, weist aber keine Aufgaben zu, bestimmt keine Beförderungen, bewertet die Arbeitenden nicht und berührt keine Beschäftigungsrechte."
        beleg: "(278)"
      - lage: "Ein Unternehmen optimiert mit einer Anwendung Geschäftsreisen und schlägt kostengünstige Flüge, Hotels und Reisewege für Beschäftigte vor, die Termine oder Tagungen besuchen müssen; die Vorschläge hindern die Beschäftigten nicht daran, anders zu wählen oder vollständig selbst zu buchen, solange sie nicht gegen sachliche Regeln der Unternehmensrichtlinie wie Höchstpreise verstoßen."
        wertung: "kein_hochrisiko"
        begruendung: "Das System unterstützt Abwicklung und Budgetierung, bestimmt aber nicht die Verteilung der Arbeit, keine Leistungsbewertungen, keinen Aufstieg und keine Beendigungsentscheidungen."
        beleg: "(278)"
      - lage: "Eine Essenslieferplattform empfiehlt mit einem System Gebiete, in denen nach Wetter, früheren Bestellungen und aktuellen Verkehrsdaten höhere Nachfrage erwartet wird; die Kuriere erhalten Hinweise wie hohe Nachfrage in Gebiet X zwischen 13 und 14 Uhr, können sie aber frei übergehen. Es gibt keine Nachteile für das Ablehnen, kein Verzeichnis darüber, wer Empfehlungen angenommen oder abgelehnt hat, und das System verringert den Zugang zu künftigen Aufträgen nicht."
        wertung: "kein_hochrisiko"
        begruendung: "Das Empfehlungswerkzeug liefert nur freiwillige, nicht bindende Hilfsinformationen und stellt keine Aufgabenzuweisung auf der Grundlage individuellen Verhaltens dar."
        beleg: "(278)"
      - lage: "Ein Industrieunternehmen sammelt mit einem System die monatlichen Anwesenheitsdaten der Beschäftigten automatisch aus der Zeiterfassungsanwendung, ordnet sie in gegliederte Berichte und Übersichten und schickt diese zu einem festen Termin an die Führungskräfte; es überwacht die Anwesenheit nicht, erzeugt keine Leistungswerte, gibt keine Empfehlungen und markiert keine Beschäftigten, sondern fasst nur die Angaben zusammen, die die Beschäftigten selbst in der Zeiterfassung eingetragen haben. Die Führungskräfte nehmen ihre inhaltlichen Bewertungen weiterhin selbst vor."
        wertung: "kein_hochrisiko"
        begruendung: "Das System fällt in den Anwendungsfall, überwacht aber nicht und trifft keine bewertenden Urteile; es fällt unter die Ausnahme für vorbereitende Aufgaben nach Artikel 6 Absatz 3 Buchstabe d."
        beleg: "(278)"
      - lage: "Eine Beratungsgesellschaft verbessert mit einem Schreibhilfssystem die Beförderungsberichte der Führungskräfte, nachdem die Bewertungen vollständig abgeschlossen sind; die Führungskräfte entscheiden über die Empfehlungen, verfassen die Begründungen und setzen die Bewertungen nach den Unternehmenskriterien selbst, bevor das System die Sprache klarer macht, die Einheitlichkeit mit dem Hausstil sichert und möglicherweise voreingenommene Formulierungen markiert; am Ende muss die Führungskraft die überarbeiteten Bewertungen nach interner Vorgabe noch einmal prüfen. Das System ändert keine Ergebnisse oder Bewertungen und erzeugt keine neuen Inhalte."
        wertung: "kein_hochrisiko"
        begruendung: "Das System betrifft Beförderungsentscheidungen, beeinflusst aber die Entscheidungsfindung nicht; es fällt unter die Ausnahme für Systeme, die das Ergebnis einer bereits abgeschlossenen menschlichen Tätigkeit verbessern sollen, nach Artikel 6 Absatz 3 Buchstabe b."
        beleg: "(278)"
